ref = "flotsync-ehe"
title = "Fix Discovery build without default features"
body = "The standalone `cargo check --locked -p flotsync_discovery --no-default-features --lib` build fails because `endpoint_selection.rs` always compiles the `EndpointSelectionPort` implementation, which refers to the optional Kompact dependency. Gate the port module and its re-export behind `kompact-runtime`, keeping endpoint selection available in the base build. Verify the featureless, peer-announcement, and default Discovery library builds."
