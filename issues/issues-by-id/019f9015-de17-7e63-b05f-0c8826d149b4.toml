title = "Split replicated checklist REPL by responsibility"
body = """
Objective

R01. Split the oversized replicated-checklist REPL module into coherent responsibility-based modules without changing user-visible behaviour.

Scope

R02. Move group registry, creation-wizard, invitation mediation, and group rendering code from runner/repl.rs into a dedicated runner/groups module.
R03. Keep runtime wiring and the top-level interactive loop in runner/repl.rs, and keep checklist working-set behaviour in its existing owning module.
R04. Move group-specific test helpers and tests with the extracted implementation while preserving narrow visibility and avoiding duplicate wrapper types.
R05. Preserve the temporary direct-store workaround and TODO(flotsync-git-c9m) until that architectural follow-up replaces it.
R06. Verify formatting, pedantic Clippy, and the flotsync_io_examples test suite without changing command syntax or output.

Estimate

R07. Approximately 100-250 LOC of structural edits plus mechanical moves; expected to remain below 1,000 LOC because behaviour and tests should move without redesign."""
