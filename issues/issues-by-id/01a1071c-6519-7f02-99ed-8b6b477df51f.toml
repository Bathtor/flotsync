title = "Enable compatible runtime flow concurrency"
body = """
Goal
Enable actual overlap between admitted ownership-compatible flows. Implements parent R17; follows flotsync-zop.21.

Instructions
S01. Relax the serial admission limit incrementally using reviewed owned partitions, not a global database reader/writer lock. Keep head-only admission: demonstrations must distinguish permitted overlap after admission from intentionally blocked younger starts.
S02. Start with independent identity/security/read/preparation work and unrelated-group operations. Preserve same-group publication/apply order, whole-batch ownership, predecessor/successor exclusion, projection-writer lifetime and serial listener invocation.
S03. For every admitted pair document permitted intermediate inconsistency, inaccessible partitions, aliased store access, revalidation, listener/provider lifetime, bounded output and the absence of a wait cycle. CPU-parallel execution is not required; overlapping asynchronous waits is.
S04. Keep creation, publication and membership dispatch/listener ordering distinct. Do not remove safeguards merely because operations use different group ids. Do not relax whole-map projection-writer exclusion or implement group deltas.

Acceptance and validation
Controlled futures demonstrate real progress of an independent admitted operation while another waits, in both completion orders. Negative tests prove conflicting operations remain deferred and head fairness holds. Include retained activation provider versus batch/store waits, failure during overlap and projection-publication lag.

Review and size
350-550 edited/new LOC including tests; split operation-family enablement into separate review patches if necessary. Removing block_on alone is not acceptance. Follow parent Rust/no-staging rules and user-reviewed closure.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Compatibility must combine owned field/record intervals with aliases, database isolation/revalidation, logical order, notification capacity, retained readers and absence of wait cycles. SecurityStore shares the backend; different group ids do not by themselves prove database independence. SQLite's single writer is a throughput constraint, not a reason for a blanket runtime database reader/writer gate. Demonstrate useful progress while an admitted operation waits, in both completion orders.

Start with compatible read/security/preparation work while preserving group/DecisionSet boundaries, whole-map writer ownership and one listener lane. Batches retain their group/lane through all callbacks. An activation provider can retain a read transaction and wait for a listener already occupied by work awaiting a store writer; reserve the lane before opening the provider where needed to exclude that cycle. Callback re-entry must not await a conflicting new flow. .01's tests characterise current blocking order only: add positive overlap, conflicting deferral, head fairness, provider/writer waits and failure-at-commit/publication/listener tests without claiming the existing gates alone prove concurrency."""
