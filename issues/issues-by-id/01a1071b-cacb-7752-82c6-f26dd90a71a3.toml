title = "Extract group policy and decision persistence"
body = """
Goal
Extract group classification, policy and decision persistence before converting their orchestration. Implements parent R07; follows flotsync-zop.06.

Instructions
S01. Move replay/conflict classification, membership/setup validation, automatic/listener policy decisions and pending-decision persistence into narrow group-domain modules.
S02. Keep predecessor-based competing proposal selection explicit. Preserve creator/member ordering, accepted-direction replay, metadata refresh, unsupported initial snapshot treatment and inactive-material visibility.
S03. Preserve each existing transaction boundary, including acceptance persisted before activation and atomic cleanup of competing proposals/material. Keep current component orchestration and reliable processed acknowledgement points unchanged.
S04. Separate pure policy inputs from security preparation and transactional effects. Avoid exposing the whole component or blanket services context. Do not redesign group lifecycle, introduce snapshot fetching or change protobuf conversions.

Acceptance and validation
Existing tests for policy decisions, stale/replayed invitations, conflicting targets and unsupported metadata-only snapshots still apply. Add no tests solely for relocated methods. Verify error context/classification and touched-file helper reuse.

Review and size
250-400 edited/new LOC, 500-700 relocated. Present pure-policy and persistence moves in separate mechanical patches if necessary; do not combine a large move with FSM semantics. Follow parent validation/review rules and preserve staging state.
"""
