flotsync-zop.06: Compose inbound and listener flow FSMs (R06/F03/F07).
flotsync-zop.07: Extract group policy and decision persistence (R07).
flotsync-zop.08: Convert pending group decision flows (R08).
flotsync-zop.09: Extract activation transaction and provider boundaries (R09).
flotsync-zop.10: Convert activation checkpoint FSM (R10).
flotsync-zop.11: Convert local group creation flow (R11a).
flotsync-zop.12: Convert membership replacement flow (R11b).
flotsync-zop.13: Convert recovery and narrow topology dependencies (R12).
flotsync-zop.14: Complete summary flows and security adapters (F08/R13).
flotsync-zop.15: Implement flow-owned partition registry (R14/R13).
flotsync-zop.16: Specify store isolation and revalidate flow phases (R19a).
flotsync-zop.17: Enforce flow-owned group projection publication (R19b).
