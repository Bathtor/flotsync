id = "01a060af-43d8-7250-8bb6-f7eb9ae61700"
ref = "flotsync-5ou.3"
title = "Optimise startup synchronisation incrementally"
body = """
Goal

Optimise staged startup so applications reconcile from an optional ApplicationReadToken one group at a time, using coalesced incremental changes when retained evidence is complete and safe full-snapshot fallback otherwise, while preserving the strict pre-runtime listener boundary.

Application contract

A01. None requests snapshots for every readable group; Some(token) requests reconciliation from that position.
A02. Ready is returned only when the supplied token exactly represents the current readable group set and no retirement remains.
A03. ApplicationSynchronisation advances asynchronously and fallibly and yields explicit Snapshot, Changes, or Retired entries in deterministic group-id order.
A04. Snapshot carries the target GroupReadToken and bounded SnapshotRowProvider. Changes carries DataChangeReadPosition and one complete group-local coalesced RowChange collection. Retired removes a supplied group which is no longer readable.
A05. Applications may persist final_read_token atomically or persist positions independently after consuming each group.
A06. Ok(None) from next_group means either complete natural exhaustion with transaction release or an incomplete previously dropped row provider; is_exhausted distinguishes them.
A07. Active public store failures preserve StoreErrorClassification. Explicit shutdown remains terminal cleanup with the ordinary source chain.

Planning and provider state

P01. Select absent-token snapshot mode once. With a token, classify each readable group as exact, incremental candidate, or snapshot and add independent retirements.
P02. Use one shared readable-group input containing group id, target token, and schema, with named conversions to pending work.
P03. Keep deterministic unresolved work in a VecDeque and at most one separate resolved current snapshot or change entry. Pending and resolved variants remain different types; no claimed booleans.
P04. Pop pending work before fallible resolution and restore it on error. Exceptional-path efficiency does not shape normal control flow.
P05. Keep a current entry installed until its provider reports natural exhaustion. Dropping the provider early blocks later claims and completion.
P06. Refactor snapshot and change batching to take the current entry once, operate on owned state, and restore it only when processing may continue. Terminal errors and exhaustion leave no current entry.
P07. Use a named internal batch outcome for batch-produced versus group-exhausted semantics, translating to Option only at the BatchProvider boundary.
P08. Centralise checked and invariant streaming-transaction access behind documented helpers.

Classification and coalescing

C01. Use VersionVector::missing_version_ranges_to and load each complete missing producer range inside the retained read transaction.
C02. Until flotsync-h3l supplies reusable-batch pagination, request complete ranges without a limit and retain TODO(flotsync-h3l) markers.
C03. Missing expected history and absent optional row-creation provenance select named snapshot fallback. Malformed store results, causal inconsistencies, unknown datasets, codec failures, inconsistent current rows, and invalid creator indices are contextual Snafu errors.
C04. Reuse one producer-causality classifier for inbound and retained updates.
C05. Collect affected identities in ordered deduplicating collections. Current visible rows become complete upserts; applicable tombstones become deletes; rows created and deleted after the supplied position emit nothing.
C06. Reserve the output from the affected-row count and rely on the strengthened exact row-slice contract instead of redundant validation sets.
C07. Keep the already-decoded protobuf operation row-id extractor for this task, but document that it does not operate on a wire-format view and test that it bypasses schema-dependent domain decoding with an invalid payload. Add TODO(flotsync-h3l) at the eager SchemaOperationView-to-owned conversion. flotsync-h3l owns the view-backed reusable update-batch design.

Lifecycle and startup invariants

L01. Do not reconstruct historical replacement transitions. Supplied groups no longer readable produce Retired; current readable groups absent from the token produce Snapshot.
L02. Keep one coherent store cut while reconciliation is incomplete. Runtime logic remains inactive until completion so represented updates cannot also arrive live.
L03. Retirement, snapshot, and change entries are independent; parallel group ingestion and transaction forking remain out of scope.

Code quality and review fixes

Q01. Keep unit-only host controls separate from feature test support and place cfg attributes at coherent trait/implementation boundaries.
Q02. Build named fields before public enum variants rather than nesting large expressions.
Q03. Document every non-obvious optional, boolean, and multi-way outcome, including state transitions and internal preconditions. Use named outcomes when None encodes domain policy.
Q04. Apply the established early-return threshold to exiting let-else forms; use let-else normally for local invariant extraction without an early exit.
Q05. Keep expected fallback separate from malformed state and use contextual Snafu errors for actual failures.
Q06. Remove the PendingResolutionFailure bookkeeping wrapper rather than promoting queue restoration into an error type.
Q07. Rename affected-row collection according to its actual collection role rather than claiming a separate validation phase.
Q08. Assert the real next_group future is Send inside an existing host test which already owns ApplicationSynchronisation; remove the black_box function-pointer workaround.
Q09. Update outcome documentation for claim_next_group, claim_streaming_group, expose_current_group, preparation-error handling, abort, transaction exhaustion, snapshot/change filling, current-row loading and projection, and incremental resolution.
Q10. Do not add the proposed extract macro or vague structural/allocation agent rules.
Q11. Share assert_inferred_send through flotsync_utils::testing and reuse one local malformed-operation fixture in the codec tests. Before review hand-off, check files touched by the change for duplicated helpers or logic and extract the second occurrence unless retaining it is explicitly justified. Do not expand routine checks repo-wide; repository-wide duplicate analysis occurs only when explicitly requested.

Validation

V01. Cover exact, missing, behind, ahead, concurrent, incompatible, retired, replacement, read-only, closed, and unknown group arrangements.
V02. Cover coalesced upserts, deletes, repeated identities, row-free progress, created-then-deleted omission, and mixed group outcomes.
V03. Cover missing evidence fallback and malformed retained history, self-dependency, unknown datasets, codec failures, row-slice violations, and invalid creators as errors.
V04. Cover retry restoration inside the same transaction, sticky terminal failure, dropped-current incompleteness, and empty/non-empty batch exhaustion.
V05. Cover represented-cut no-redelivery, multiple producer ranges, public Send/Sync boundaries, and the async application API.
V06. Run formatting, focused and broader tests, pedantic Clippy, rustdoc with warnings denied, diff checks, and the Rust instruction audit.

Deferrals and linked work

D01. Do not reconstruct replacement lineage, historical value equality, parallel ingestion, gateways, or the general runtime FSM.
D02. flotsync-5az owns genuinely bounded incremental materialisation and delivery.
D03. flotsync-h3l owns correct reusable-batch pagination, replacement of temporary unlimited loads, view-backed update batches retaining protobuf backing storage, store contract tests, and the wider audit of store APIs for correct pagination or no pagination.
D04. Priority-0 child/blocker flotsync-r6x owns the pre-merge split of runtime/synchronisation.rs into a folder module, beginning with an intact move to synchronisation/mod.rs and then cohesive extraction. The mechanical refactor exceeds 1,000 changed lines and remains separate.
D05. Fast deterministic general duplicate-detection tooling is a possible future concern, not part of this task and not required for routine review readiness.

Implementation sequence

I01. Update the review ledger and holistic task plan.
I02. Move assert_inferred_send to flotsync_utils::testing and update both callers.
I03. Extract and reuse the local malformed protobuf operation fixture.
I04. Add the touched-files-only duplication review rule to AGENTS.md.
I05. Recheck all touched files for newly duplicated helpers or logic.
I06. Run focused tests, formatting, pedantic Clippy, diff checks, and return the task to review.

Sizing

Z01. Third-round changes are approximately 15–30 LOC and should be a net reduction in duplicated test code.
Z02. The later module split will exceed 1,000 mechanical changed lines and remains a separate blocker."""
