id = "019f5b3a-ee57-7413-b39b-55e107995695"
ref = "flotsync-9fs"
title = "Design application-facing record identity across group changes"
body = """
Define application-facing row correspondence across group changes so applications can replace an old group view with a successor view without treating every successor row as an unrelated insertion or silently collapsing potentially divergent state.

Context:
C01. flotsync-git-pow.4 materialises Empty or Inline snapshots into a new group namespace and emits new-group rows to the listener after activation.
C02. RowId is group-scoped, so the same dataset row key in old and successor groups denotes two distinct row occurrences.
C03. Repeated membership or schema changes currently leave applications to infer that relationship from ordinary new-group upserts, which can produce duplicate application rows and hides the reconciliation boundary.
C04. The old group already records its selected successor and migration cut, so the runtime has an explicit old-to-new transition context.

Agreed model:
M01. Keep RowId as the authoritative application-visible, group-scoped row identity.
M02. A successor-group row has a distinct RowId from its old-group counterpart. Flotsync must not silently collapse the two occurrences into one stable record identity.
M03. Within one explicit group change, matching DatasetId and RowKey values define row correspondence between the old and successor group. This correspondence is transition-local and does not create application-global record identity.
M04. Corresponding rows are related but need not be equivalent. Membership or schema changes may expose state that differs from the application last observed old-group state.
M05. Applications own reconciliation of dirty or otherwise retained local state. They may remap it, warn that it may be lost, or expose a conflict for user resolution.
M06. Flotsync should make reconciliation easier by reporting conservative facts about correspondence and divergence, but it must not choose an application-specific merge or conflict resolution.
M07. A stable group-lineage id remains an orthogonal optional extension tracked in priority-4 follow-up flotsync-2js; it is not part of this slice.

Agreed listener API:
A01. Keep ReplicationEvent::DataChanged as the streamed listener boundary and add batch lineage distinguishing ordinary data changes from GroupReplacement { migration_id }.
A02. Do not expose a group-wide previous-position comparison. Apart from MigrationId, reconciliation evidence is row-local.
A03. Refactor the emitted row item so PreviousRow is parent metadata for a current Upsert or Delete change rather than metadata nested only inside an upsert.
A04. PreviousRow distinguishes ordinary/not-compared changes, a present corresponding old occurrence, an absent old occurrence with evidence, and unavailable old-group state.
A05. Present previous rows carry their old RowId plus the strongest conservative row-local causal evidence available for relevant create, update, and delete operations relative to the accepted cut.
A06. Corresponding old/new rows emit one successor Upsert whose PreviousRow names the old occurrence. Old-visible rows without successor occurrences emit Delete for the old RowId with the same previous-row lineage. Successor-only rows emit Upsert with absent or unavailable previous-row evidence.
A07. When Flotsync compares projected row values, it emits the canonical identities of differing fields so applications do not repeat the comparison with potentially inconsistent equality semantics.
A08. Detailed schema-change semantics are deferred from the first implementation slice, but the row-level field-change model must remain extensible to schema-added/defaulted, schema-removed, and definition-changed fields. A separate schema-comparison helper will support columnar applications.
A09. One GroupReplacement DataChanged batch is an atomic application-view transition, including when its row provider is empty. Applications merge its ReadToken only after recording the complete replacement and any unresolved conflicts.
A10. Flotsync reports evidence and application-facing changes but does not choose how dirty state is rebased, discarded, or presented as a conflict.

Current implementation slice:
S01. Implement the agreed DataChanged lineage and parent PreviousRow/current-change API for membership-change activation with unchanged schemas.
S02. Compare visible old and successor occurrences by DatasetId and RowKey and emit corresponding upserts, successor-only upserts, and old-only deletes.
S03. Emit canonical changed-field identities for corresponding projected rows.
S04. Emit the strongest row-local creation/change/deletion cut evidence supported by retained state, with an explicit unknown/unavailable fallback rather than inference.
S05. Cover Empty activation, migration-sourced invitations without a hosted old group, and repeated membership changes.
S06. Preserve opaque multi-group ReadToken behaviour and the existing post-commit listener boundary.
S07. Keep group-scoped snapshot APIs; document that restart rebuilds from application-readable groups and therefore excludes closed predecessors.
S08. Make only minimal replicated-checklist changes required to conform to the new API. Substantive example dirty-state reconciliation is a separate child.

Agreed implementation architecture:
I01. Storage aligns raw previous/current row records by DatasetId and RowKey; replication alone owns application visibility, correspondence, field equality, causal interpretation, and public listener semantics.
I02. Add an ordered row-transition store scan whose result contains independently optional raw previous/current records, including tombstones. Provide a correct default implemented by merging two existing ordered scans.
I03. Override the transition scan in SQLite with an indexed union-of-keys query and joins to the two row records, avoiding a dependency on FULL OUTER JOIN support.
I04. Persist the UpdateId which first introduced each row and preserve it across later updates and tombstoning. Combine this with existing last-changed versions in replication to derive only conservative included/not-included/unknown evidence relative to the accepted cut.
I05. Do not replay the complete old-group update log by default. Missing historical proof remains explicitly unknown or unavailable.
I06. After atomic successor activation and predecessor closure, use a store-backed provider over one pinned read transaction to compare and emit rows in bounded batches.
I07. Compare materialised application values in replication and emit deterministic canonical differing-field identities. The first slice supports unchanged schemas.
I08. Retain the existing post-commit listener failure model; a general retryable listener outbox remains outside this task.

Agreed task split:
T01. flotsync-j6x, Add paired row scans and provenance, owns the raw row-transition storage contract, its generic fallback, the SQLite optimisation, creator provenance, patch call sites, and focused store tests. This child is complete.
T02. flotsync-v76, Emit group replacement row lineage, owns the public listener API, streaming replacement provider, replication-layer comparison/evidence, runtime integration, OKF updates, focused/end-to-end runtime coverage, and only minimal replicated-checklist API conformance.
T03. flotsync-v76 consumes the settled flotsync-j6x storage foundation.
T04. flotsync-fk0, Add checklist group replacement reconciliation, owns the checklist-specific dirty-state reconciliation policy, conflict representation, user-visible resolution workflow, tests, and scenario documentation.
T05. flotsync-fk0 is blocked by flotsync-v76 so it consumes the final public listener API.

Deliverables:
D01. Update OKF design documentation and public API contracts with the agreed identity, correspondence, replacement, and reconciliation semantics.
D02. Add the public listener and snapshot/query API shapes selected during design alignment.
D03. Add runtime/store comparison and transition plumbing required by those contracts.
D04. Keep the replicated checklist compiling against the new API in flotsync-v76 without introducing an accidental reconciliation policy.
D05. In flotsync-fk0, teach the replicated checklist to demonstrate safe handling of clean, dirty, identical, divergent, introduced, removed, and unresolved rows.
D06. Add focused and integration tests for repeated group changes with unchanged schemas, overlapping rows, Empty activation, and restart/replay behaviour in flotsync-v76; add application dirty-state reconciliation coverage in flotsync-fk0.

Explicit deferrals:
X01. Framework-level application-specific dirty-state merge and automatic conflict resolution are out of scope; flotsync-fk0 implements only an example application policy.
X02. Stable group-lineage identity is deferred to flotsync-2js.
X03. GroupClose protocol shape and standalone old-group access policy remain in flotsync-yty.
X04. Chunked or fetched snapshot transfer and broader snapshot batching redesign remain outside this task.
X05. Detailed schema-added/defaulted/removed field semantics and the columnar schema helper remain deferred.
X06. Exact-cut history replay and a general retryable listener outbox are not introduced in this slice.

Implementation estimate:
E01. Completed flotsync-j6x storage foundation: approximately 1,700 added lines including tests and tracking updates.
E02. flotsync-v76 core API/runtime/documentation and minimal checklist conformance: roughly 870-1,500 LOC.
E03. flotsync-fk0 substantive checklist reconciliation: roughly 540-960 LOC.
E04. The remaining work is intentionally split because the combined runtime and application-policy work is likely to exceed 1,000 LOC and has distinct review boundaries."""
