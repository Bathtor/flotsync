body = "Model decision aligned: retain group-scoped RowId and treat successor rows as distinct but transition-related occurrences. Applications remain responsible for dirty-state reconciliation; Flotsync will expose previous-row existence, projected-state equality, and conservative divergence context without choosing a merge. Stable group-lineage identity is deferred as optional priority-4 follow-up flotsync-2js."
