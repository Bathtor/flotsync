title = "Audit and finish store pagination contract"
body = """
Scope
Finish the integrated store-pagination audit after completed children flotsync-h3l.1-.7 and the opaque-continuation redesign flotsync-o3o. The user agreed the remaining cleanup and authorised execution on 2026-10-04. Do not close this child or the parent without user approval. Preserve manual changes and review staging. Do not create/switch branches.

Current agreed contract
Use PageCursor<Params>, constructed directly with ordinary immutable query data. Params may borrow; separate query/call lifetimes are intentional for mutable cursor variance. The backend supplies a private Send + 'static continuation, erased into Any by the cursor; Rust Ord/Clone and caller-visible continuation semantics are not required. Format validation preserves a cursor on recoverable mismatch, but is not operation identity. Do not reintroduce operation tags or query-specific cursor aliases.
PageBatch is object safe and supports temporary borrowed views during synchronous projection. Finite limits count successful source records independently of output cardinality. Custom batches may filter or expand. Vec/inline batches and positional row batches reuse their storage. A new fill clears output/metadata; failed, cancelled or unwound active fills clear output and fail the cursor. Exhausted reuse is an error. Backend PageEnd separates continuation/exhaustion from result length and metadata; unlimited and empty fills cannot yield continuations.
Bounded update/ID pages use each backend's deterministic traversal order; SQLite orders by version then producer; inclusive producer filters do not depend on applied state and inverted ranges are empty. Unlimited update and metadata reads need no ORDER BY, except where a particular API promises order (ordinary row/transition scans). Existing lower bounds still apply when switching to unlimited. Requested-row selections report present/missing explicitly and may know exact final exhaustion or require an empty confirmation page. Transaction identity is common UUID-backed and wrappers forward it; cursor calls hold no transaction borrow afterwards. Preserve snapshots, read-your-own-writes, error classification and contextual Snafu errors.
Read generated operation views from temporary stored payloads without materialising operations. SQLite ID-only reads exclude payloads; selected-ID decoding skips unselected payloads. Exact full-update lookup shares validation with the projected scan. Compact dependency/recovery/summary collections use unlimited projection when the complete output must be assembled before processing; incremental history and response payload reads stay bounded with a separate response cap. Application-facing providers remain adapters.

Audit results
All collection families have common _into methods or deliberate complete-result conveniences. Production update callers are converted. Old row/transition APIs are gone. Shared lifecycle/error/cancellation/cardinality tests cover the common implementation. Runtime regression tests cover the adopted call paths. No additional runtime correctness defect was identified in inspected paths.
Only two TODO(flotsync-h3l) remain: the temporary limit-only update and update-ID adapters in api/store.rs. Their five call sites are SQLite test helpers. Reusable backend-specific domain scenarios currently exist for metadata only, whereas this child's acceptance includes all adopted families; update/row/transition/requested-row/delivery scenarios are presently SQLite-specific.

Agreed work
A01. Remove both legacy optional-limit update methods after converting existing SQLite helper calls to _into. Preserve all existing filter, bounded selection, indexed/payload mismatch and ID-only assertions. Rename the legacy helper and remove obsolete imports. Do not remove single-record ownership conversion or valid complete-result conveniences. Estimate 60-100 changed Rust LOC.
A02. Make existing public-boundary domain assertions reusable by extracting narrow test-support helpers for update/ID, ordinary/requested/transition rows and delivery metadata. Accept public trait objects and caller-prepared fixtures; use them from the same existing SQLite tests. Leave SQLite corruption injection, query details and database-specific checks in SQLite tests. Agreed review fixes R01/R02: accept backend traversal order separately from the five update fixtures; derive projected/ID/selected/limited expectations from that order, and compare projected flags by identity. Return ExactPageCompletion for requested-row checks, allowing immediate exhaustion or an empty confirmation; SQLite asserts its immediate-exhaustion choice locally. About 80-130 affected Rust lines, using existing tests only. Do not add redundant tests or repeat the generic cursor lifecycle suite. Estimate 300-500 affected Rust LOC, primarily moved/refactored code; preserve existing test count where practical. If decoupling exposes substantial extra implementation, report and split instead of concealing it in this estimate.
A03. Keep this holistic plan reconciled with later accepted changes and record chronological audit/progress comments. Before final handover reconcile the parent P01-P09 checklist with bounded-only update ordering, opaque backend continuation and arbitrary batch output cardinality. Preserve original goals and intentional deferrals; do not restore superseded sketches. Tracking changes only.
Total estimated Rust scope: 360-600 affected LOC, under 1,000. Implementation is authorised.

Implementation completed for review
A01: removed both optional-limit compatibility methods and migrated their five test call sites. Source/tests/docs contain no TODO(flotsync-h3l) or legacy update-loader invocation.
A02: existing SQLite tests now call public async contract helpers for updates/IDs, ordinary rows, requested-row present/missing outcomes, transitions and delivery metadata. Helpers take public trait objects plus caller-prepared contexts or borrowed fixtures. SQLite corruption, absent-dataset/SQL/snapshot checks stay local. ExactPageCompletion reports either valid backend exact-boundary policy; existing SQLite update/delivery cases still assert the empty-confirmation policy and requested-row cases assert immediate completion. Library test count remains 421; no new test cases or batch implementations.
A03: reconciled the full parent requirements/contract with accepted opaque ordering, cardinality and unlimited metadata decisions, preserving linked follow-ups and historical comments.
R01/R02 review fixes completed: update fixtures supply backend traversal order separately; projected flags are compared by identity and ordered/limited expectations derive from that order. Requested-row checks return ExactPageCompletion and allow empty confirmation, with SQLite asserting immediate completion locally. Both affected existing SQLite tests, all-target and test-support-feature pedantic Clippy, formatting and diff checks passed. No test cases added. Review staging untouched.
Validation: 421 library tests and the downstream backend construction boundary test passed. Final formatting, all-target pedantic Clippy and diff checks complete the review gate. Parent/child remain open pending user agreement; nothing is staged or committed during this implementation.

Validation and acceptance
Use existing tests, extracting rather than duplicating domain coverage. Parent P01-P09 are checked with accepted refinements: bounded update order, precise inclusive producer filters and result bounds; legacy TODO removal; all callers/wrappers; reusable backend scenarios; bounded history payload processing; one protocol across collection families; generated operation-view projections. Verify relevant integrated tests, external backend boundary, formatting and pedantic Clippy, with serial Cargo and socket broker requirements. Limit duplication inspection to touched files. No TODO(flotsync-h3l), obsolete partial-result compatibility adapter or undocumented temporary API remains after implementation. Report intentional complete-result APIs and unresolved linked work explicitly.

Explicit deferrals
flotsync-yzq: custom collection-backed batches (including the trust-evidence Vec-to-set conversion).
flotsync-mzc: generic composed cursors/two-source transition fallback.
flotsync-dj1: extracting SQLite into a separate crate; public external-backend view construction is already covered.
flotsync-duu: further row scan allocation/streaming work (reusable output is now implemented, SQL fetch_all evaluation remains separate).
flotsync-git-qsg: inline initial snapshot threshold/Metadata path; existing TODO remains intentionally outside this parent.
No database migrations, new branches, operation identity, generic engine ordering assumptions, or redundant tests.
"""
