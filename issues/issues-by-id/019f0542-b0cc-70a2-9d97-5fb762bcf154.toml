id = "019f0542-b0cc-70a2-9d97-5fb762bcf154"
ref = "flotsync-261"
title = "Make ReadToken opaquely serialisable"
body = """
Goal

Make ReadToken opaquely and canonically serialisable so disk-backed applications can persist and restore application read positions without inspecting replication-group scoping.

Context

C01. ReadToken currently stores group-scoped VersionVector values in a private HashMap behind Arc and has no persistence format.
C02. Applications are trusted to restore only opaque token bytes previously returned by the runtime. Decode therefore performs structural format validation, not runtime/store compatibility validation.
C03. Restored positions may intentionally be behind current state or contain outdated lifecycle information. Publish retains authoritative validation for the group it changes.
C04. Application restart synchronisation from a stored token is tracked separately by flotsync-5ou under flotsync-d3k, including incremental replay and per-group snapshot fallback.
C05. The existing self-describing VersionVectorProtoCodec already carries the member count needed for standalone persistence and should be reused.
C06. Canonical token bytes require deterministic group ordering.
C07. ApplicationSchemas currently uses a private sorted boxed slice with a custom length-first dataset-id order. ReadToken group ids are fixed-length UUID values with efficient natural comparison.
C08. Public ReadToken debug output must remain opaque in every formatting mode.
C09. Public-key-bundle pasteable text already uses standard padded Base64 over canonical protobuf bytes; ReadToken text should follow the same convention.
C10. Group membership changes rarely. Most ReadToken merges update vectors for existing groups; inserting a newly encountered group is an exceptional path.

Plan

P01. Add flotsync_core::SortedArrayMap<K, V, O = NaturalOrder> backed by a Vec<(K, V)> whose entries remain contiguous, unique, and sorted by O. Define SortOrder<K> with an associated borrowed LookupKey type and a static comparison function. Provide zero-allocation empty construction, checked unsorted bulk construction with duplicate-key reporting, singleton construction, borrowed binary-search lookup, mutable lookup, length and emptiness, ordered exact-size iteration, and replace-or-insert.
P02. Expose the immutable contiguous representation through public as_slice, AsRef<[(K, V)]>, and Deref<Target = [(K, V)]>. Do not expose mutable slice conversion or DerefMut because arbitrary key mutation could violate ordering and uniqueness. Use flotsync_utils::NonOwningPhantomData for the type-level ordering marker.
P03. Keep bulk collision-resolution logic out of the generic collection. ReadToken::merge_applied will iterate applied groups, update the common in-place case through get_mut, and insert only groups added by rare membership changes. Document this workload assumption at the use site.
P04. Move ApplicationSchemas to SortedArrayMap<&static str, &static Schema, DatasetIdOrder>, retaining its existing length-first comparison and public ordering abstraction.
P05. Move ReadToken group storage to SortedArrayMap<GroupId, VersionVector>, retaining Arc-backed cheap cloning, binary-search lookup, single-group advancement, and least-upper-bound merging at the use site.
P06. Add a thin format-versioned protobuf ReadToken envelope whose entries contain group-id bytes and the existing self-describing VersionVector representation. Encode entries in map order and reject unsupported versions, malformed group ids and vectors, and duplicate groups.
P07. Add canonical ReadToken::to_bytes and structurally checked ReadToken::from_bytes. Preserve decoded positions exactly without consulting current runtime or store state.
P08. Implement Display and FromStr so ordinary to_string and parse calls use canonical standard padded Base64 over the canonical serialised bytes. Reject non-canonical equivalent text after decode and re-encode comparison.
P09. Keep runtime compatibility validation at actual use sites. Publish continues validating its target group; startup synchronisation validation belongs to flotsync-5ou.
P10. Remove alternate Debug exposure of internal group vectors.
P11. Cover SortedArrayMap ordering policies and invariants, immutable slice exposure, ApplicationSchemas behaviour, ReadToken storage and merging, canonical byte and string round trips, all VersionVector representations, ordering independence, duplicates, malformed formats, unsupported versions, and opaque debug output.
P12. Stage implementation safely: revise and validate only SortedArrayMap in flotsync_core after its first review. Consumer and serialisation work follows in later turns after this reusable base is accepted.

Size estimate

S01. Revised SortedArrayMap implementation and focused tests: about 250-350 LOC.
S02. ApplicationSchemas and ReadToken representation changes: about 100-180 LOC.
S03. Protobuf, byte/string codecs, errors, and tests: about 260-430 LOC.
S04. Total expected implementation: about 610-960 LOC, below 1000 LOC. If later codec requirements make the issue likely to exceed 1000 LOC, split a self-contained codec or consumer child before expanding further."""
