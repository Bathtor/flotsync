id = "019f0542-b0cc-70a2-9d97-5fb762bcf154"
ref = "flotsync-261"
title = "Make ReadToken opaquely serialisable"
body = """
Goal

Make ReadToken opaquely and canonically serialisable so disk-backed applications can persist and restore application read positions without inspecting replication-group scoping.

Context

C01. flotsync_core::SortedArrayMap is implemented and reviewed as a contiguous Vec-backed sorted map with natural or custom ordering, immutable slice exposure, binary-search lookup, mutable lookup, and ordered insertion.
C02. Applications are trusted to restore only opaque token bytes previously returned by the runtime. Decode therefore performs format and structural validation, not runtime or store compatibility validation.
C03. Restored positions may intentionally be behind current state or contain outdated lifecycle information. Publish retains authoritative validation for the group it changes.
C04. Application restart synchronisation from a stored token is tracked separately by flotsync-5ou under flotsync-d3k, including incremental replay and per-group snapshot fallback.
C05. The existing self-describing VersionVectorProtoCodec already carries the member count needed for standalone persistence and should be reused.
C06. Token output is deterministic because groups are encoded in sorted order. Decoding accepts compatible protobuf payloads even when the current encoder would emit a different field or entry order.
C07. ApplicationSchemas retains its custom length-first dataset-id order but can store an empty SortedArrayMap directly.
C08. Ordinary ReadToken Debug output remains opaque and count-based. Alternate Debug remains an explicit diagnostic representation containing group details.
C09. Public-key-bundle pasteable text already uses standard padded Base64. ReadToken text follows that convention and canonicalises only the Base64 spelling of the exact encoded bytes.
C10. Group membership changes rarely. Most ReadToken merges update vectors for existing groups; inserting a newly encountered group is an exceptional path.
C11. A one-byte discriminator belongs outside protobuf so later values can select a completely different encoding rather than only another protobuf schema.
C12. Encoding the protobuf into a temporary Vec and then copying it behind the outer discriminator is unnecessary. Buffa messages already encode directly into BufMut, and Bytes is accepted directly by Base64 through AsRef<[u8]>.

Plan

P01. Retain the reviewed SortedArrayMap<K, V, O = NaturalOrder> implementation and immutable contiguous access through as_slice, AsRef, and Deref. Do not expose mutable slice access.
P02. Keep bulk collision resolution out of the generic collection. ReadToken::merge_applied updates existing entries through get_mut and inserts only groups introduced by rare membership changes, with that workload assumption documented at the use site.
P03. Move ApplicationSchemas to a direct SortedArrayMap<&static str, &static Schema, DatasetIdOrder> field and remove Option handling. Expose EMPTY as an associated &static ApplicationSchemas backed by one actual static, because borrowing a Vec-containing associated const value cannot satisfy the runtime APIs requiring a static reference. Translate duplicate-key construction errors with map_err.
P04. Keep ReadToken group storage in SortedArrayMap<GroupId, VersionVector> behind Arc. Preserve binary-search lookup, single-group advancement, and least-upper-bound merging. Its HashMap conversion retains the checked generic constructor with the direct invariant message that a hash map has no duplicate keys.
P05. Define opaque bytes as one u8 format discriminator followed by the selected format payload. Format 1 contains protobuf. Reject a missing or unsupported discriminator before payload decoding.
P06. Define the protobuf ReadToken message as only repeated group entries. Each entry contains the canonical 16-byte UUID representation of GroupId plus the existing self-describing VersionVector protobuf. Remove protobuf-level format_version handling and translate duplicate groups with map_err.
P07. Keep ReadToken::to_bytes deterministic and return Bytes. Build one BytesMut, append the format discriminator, encode sorted protobuf groups directly into that buffer, and freeze it without copying. Keep ReadToken::from_bytes independent of runtime state and accept structurally valid protobuf payloads without requiring re-encoding to reproduce the original bytes.
P08. Implement Display and FromStr with standard padded Base64. Parsing verifies canonical Base64 by re-encoding the decoded bytes themselves, then decodes the token. Display passes Bytes directly to Base64 without an intermediate vector.
P09. Keep runtime compatibility validation at actual use sites. Publish continues validating its target group; startup synchronisation validation belongs to flotsync-5ou.
P10. Preserve ordinary opaque Debug output and restore alternate Debug output containing internal group vectors for diagnostics.
P11. Keep Snafu context wrapping where errors retain sources. Use map_err only for the real source-free translations from duplicate sorted-map keys to duplicate datasets or groups.
P12. Cover ApplicationSchemas empty and populated behaviour; ReadToken storage and merging; empty and populated byte and text round trips; every VersionVector representation; deterministic output; compatible differently ordered protobuf input; malformed payloads; missing and unsupported format discriminators; invalid ids and vectors; duplicate groups; invalid and non-canonical Base64; and both Debug modes.
P13. Run protobuf formatting and linting, focused unit tests, the complete replication suite serially, and all-target pedantic Clippy. Reconcile every review item before returning the work for review.
P14. Extend EncodeProto with direct encoding into a caller-supplied BufMut using the generated Buffa Message::encode implementation. Retain the existing Bytes and Vec convenience methods and test that all three paths produce identical protobuf bytes.
P15. Do not add a dedicated ReadToken vector-returning method until a caller needs it. Callers which specifically require Vec<u8> can explicitly convert the returned Bytes.

Size estimate

S01. Reviewed SortedArrayMap implementation and tests: about 250-350 LOC.
S02. ApplicationSchemas and ReadToken representation changes: about 120-200 LOC.
S03. Outer format byte, protobuf codec, public byte and text API, errors, and tests: about 280-440 LOC.
S04. Direct BufMut encoding and Bytes-returning token refinement: about 30-60 LOC.
S05. Total expected implementation: about 680-1050 LOC. The upper estimate crosses 1000 only when counting all staged tests and reviewed collection work together; the buffer refinement is a small self-contained addition and does not warrant a separate child issue."""
