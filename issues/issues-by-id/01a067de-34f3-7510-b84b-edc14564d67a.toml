id = "01a067de-34f3-7510-b84b-edc14564d67a"
ref = "flotsync-4e8"
title = "Refactor replication runtime load arguments"
body = """
Goal

Replace positional replication-runtime loading and host preparation APIs with a readable application-facing builder and validated named internal inputs. Preserve startup synchronisation, security validation, listener activation, socket ownership, and shutdown behaviour.

Public runtime builder

P01. Keep ReplicationRuntime::builder(application_id) as the primary application entry point. Use a handwritten builder with private state, consuming setters, and public read accessors for every stored value.

P02. Required setters are store, listener, and security_secrets. Validate all omissions together before store access, security loading, or runtime creation. Store missing field names as a boxed slice and join them only for error display.

P03. Default application schemas to ApplicationSchemas::EMPTY. Supplying schemas remains an optional process-static reference reuse optimisation. Retain the defaults of no application read token and ReplicationConfig::default().

P04. Keep runtime TOML fragments in SmallVec<[String; 1]> as a temporary owned representation. runtime_config_toml appends fragments in order and later values take precedence. Keep the TODO link to https://github.com/kompics/kompact/issues/232 and build the non-Send runtime configuration only inside the blocking system-construction boundary.

P05. Remove maybe_runtime_config_toml. Optional fragments are handled explicitly at use sites.

P06. Provide documented public borrowed accessors for application id, schemas, store, listener, security secrets, application read token, runtime policy, and runtime configuration. Expose runtime configuration as an opaque ordered iterator of string slices so the backing representation can later change without altering the accessor API.

P07. Keep focused rustdoc on the builder, setters, and accessors. Use runtime-facing vocabulary, keep listener execution guidance on the listener setter, and keep shutdown and synchronisation obligations on lifecycle APIs.

Validated internal loading

P08. Use ValidatedRuntimeInputs<S> for both security stages, parameterised by ReplicationSecuritySecrets before store loading and DeliverySecurity afterwards. Keep its fields private and construct it only after missing-input validation.

P09. Reuse ReplicationRuntimeBuilder for already-loaded-security paths through the crate-private conversion. Build and bind each stage separately.

P10. Deterministic test-security support reads builder state through the same public accessors available to every caller.

Host preparation

P11. Use DeliveryRuntimeHost::prepare(args) for ordinary preparation and retain prepare_with_test_support(args, test_support) for the distinct test seam. Keep removed specialised start and TOML-named host methods removed.

P12. Keep the startup listener internal to host preparation. Strict inactive-listener behaviour belongs to RuntimeHostTestSupport. Active-host tests prepare and then activate their application listener explicitly.

P13. Pass ordered owned runtime configuration fragments through host preparation and merge them on the blocking construction thread.

Test fixtures and call sites

P14. Replace the load_runtime_with_parts family with runtime_builder(application_id, store, listener), which applies common test inputs, and load_runtime(builder), which reads the configured store, loads test security, validates the builder, and completes test startup.

P15. Tests override schemas, runtime policy, application position, or configuration fragments directly on named builders before passing them to load_runtime.

P16. Update the fragment-precedence delivery test to append both fragments directly to an actual builder.

P17. Keep higher-level fixtures that assemble several related objects, but implement their runtime loading through the common builder and loader.

P18. Bind every builder before loading it. Avoid nesting builder chains or validated input construction inside block_on, wait_for_test_reply, or other expressions.

Compile-time and behaviour coverage

P19. Keep private trybuild pass fixtures for normal and configured load futures being Send, including ownership of temporary TOML strings. Keep ordinary trait assertions in the integration test.

P20. Preserve coverage for omitted schemas, structured missing inputs, validation ordering, configuration precedence, security conversion, staged listener activation, reconciliation, route publication, and shutdown.

Validation and review readiness

P21. Run formatting, the full serial replication test suite, affected example checks, rustdoc validation, and pedantic Clippy for replication and examples.

P22. Inspect touched files for stale helper names and new duplication, audit changed Rust against AGENTS.md, reconcile every review note, and return the issue to in-review status.

Scope

The additional review round is expected to rewrite approximately 180 to 300 lines, mostly mechanical test call sites, and remains below 1,000 lines. The broader issue already includes the public builder, validated input model, host consolidation, compile checks, documentation, and application call-site updates.

Context

This work was discovered during flotsync-5ou.2 and must preserve its startup-synchronisation correctness. The separate lifecycle-ownership concern in flotsync-3ht remains out of scope."""
