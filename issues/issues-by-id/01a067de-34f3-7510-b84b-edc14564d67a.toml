id = "01a067de-34f3-7510-b84b-edc14564d67a"
ref = "flotsync-4e8"
title = "Refactor replication runtime load arguments"
body = """
Goal

Replace the growing positional replication-runtime loader APIs with one or more named argument structs so call sites are readable, optional inputs can have sensible defaults, and loader evolution does not require repetitive signature churn.

Scope

P01. Redesign the public load entry points around cohesive argument structs while preserving the standard and explicit runtime-config entry points where useful.
P02. Include the internal typed loader, security-ready loader, test-support loader, and lifecycle-test loader so positional forwarding is removed throughout the complete call chain.
P03. Define defaults only where they are semantically safe and unsurprising; keep required identity, schema, store, listener, and security inputs explicit.
P04. Update examples, test support, integration tests, and documentation to use the named inputs.
P05. Remove obsolete too-many-arguments allowances after the conversion.
P06. Include the host preparation chain—prepare_with_runtime_config_toml, prepare_with_test_support, prepare_with_options, and DeliveryRuntimeHost construction—so the eventual named inputs remove positional forwarding and the corresponding too-many-arguments allowances at this lower boundary as well. Keep optional test seams isolated from ordinary host preparation inputs.

Context

Discovered during review of flotsync-5ou.2. Keep this refactor separate from the startup-synchronisation correctness and terminology fixes in that issue."""
