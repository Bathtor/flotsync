ref = "flotsync-h3l.7"
title = "Page reliable delivery metadata"
body = """
Scope (AJ7)
Expose reliable-delivery scheduling metadata through the shared paging contract within one consistent read session. Keep this delivery-specific capability independent of unrelated replication-state reads. Work on the current branch; do not create or switch branches. Agreed original estimate: 460–730 changed Rust LOC (session API 100–150; SQLite 130–200; startup and wrappers 100–160; focused verification 130–220). Latest review delta is roughly 45–85 LOC, and the overall task remains below 1,000 LOC. Blocked-by flotsync-h3l.1 is closed.

Current code and paging contract
ReliableDeliveryStore opens a narrow read session and retains a complete-result convenience. The shared PageCursor<Params> owns immutable parameters and an erased backend continuation; PageAttempt and PageBatch handle lifecycle, limits, cleanup and projection. SQLite reuses pool-owned StoreTransactionId allocation and its existing read-transaction guard. The backend defines ordering and continuation; the public cursor does not expose MessageId ordering. Bounded exact-size results may require an empty confirmation page. Unlimited reads need no ORDER BY unless the API explicitly promises ordered output. The earlier PageCursor<Params, Key> and Rust key-comparison sketches are obsolete.

Implementation
1. ReliableDeliveryReadSession provides load_reliable_delivery_work_metadata_into using PageCursor<()> and a PageBatch accepting owned StoredReliableDeliveryWorkMetadata with unit metadata, plus release(self: Box<Self>). ReliableDeliveryStore::begin_read_session creates this view. Keep load_reliable_delivery_work_metadata as a complete-result convenience using one unlimited VecPageBatch and explicit release. Store and page failures preserve classification.
2. SQLite implements the session using its read transaction and existing pool identity. Stream only message_id, recipient and first_submitted_at. Bounded pages use the stored SQL TEXT message_id as their opaque exclusive continuation and ORDER BY message_id LIMIT; unlimited fresh reads have no ordering or limit. Obtain the extra owned continuation only after the record that fills a bounded page, avoiding an extra String allocation for every row. Remove WHERE 1 = 1: add a narrow first-predicate variant of the shared TEXT page-window helper, emitting WHERE only if continuation exists and sharing the lower-bound and ordering/limit code with existing helpers. Document the existing helpers' requirement for a preceding WHERE predicate. Explicitly release after success and rely on rollback-on-drop after failure/cancellation. The session view is fixed from its first SQLite read; later pages cannot gain inserted rows or lose deleted rows from that view. Full-envelope reads remain separate.
3. Startup fills one unlimited metadata batch in one session call because every item ultimately enters the scheduling map and outbound work starts after the scan. Release the read session immediately after filling, then consume the batch into the map, place items by route, and select/load outbound attempts. Remove the recovery page-size constant and loop. The batch holds only compact metadata, never encoded envelopes. Preserve acknowledgement, deletion, retry and eligible-load behaviour. ControlledStore and FailingStore delegate the narrow session.
4. Reuse the existing SQLite and restart tests rather than adding further tests or duplicating the generic paging suite. SQLite tests cover bounded/multi-page, empty and exact-size scans, session mismatch, concurrent view stability, explicit release and failure cleanup. Simplify the earlier 65-item restart fixture to a few items for distinct recipients now that recovery is unlimited; preserve restoration of all items, no full-envelope reads before route eligibility, and original envelope reuse after discovery. Check touched files for duplicated helpers. Run focused serial tests, rustfmt and pedantic Clippy.

Acceptance
One consistent delivery metadata scan uses shared paging semantics and caller-owned output storage. Startup uses one unlimited fill before constructing its scheduling state. SQLite preserves bounded pagination for other callers, using its own deterministic ordering and opaque continuation. Metadata queries exclude envelope bytes and unnecessary predicates/order/limits. Full envelopes load only for eligible work. Session resources are released promptly on success and failure/cancellation. Existing delivery behaviour remains covered. Do not close this issue until user review confirms completion.

Context and explicit deferrals
This is an implementation child of flotsync-h3l. Preserve manual changes and the user's staged review state, follow AGENTS.md, and leave compatibility-adapter removal to flotsync-h3l.8. R03 replaces the earlier bounded-startup plan and its 65-item component page-boundary fixture; SQLite bounded-page coverage remains. R01's allocation improvement remains applicable to bounded callers. Chronological review history stays in issue comments and the local working note.
"""
