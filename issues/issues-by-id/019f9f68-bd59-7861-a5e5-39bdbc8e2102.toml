id = "019f9f68-bd59-7861-a5e5-39bdbc8e2102"
ref = "flotsync-j3v"
title = "Remove temporary Windows failure caching"
body = """
Objective

Stabilise explicitly-bound outbound TCP connection completion on Windows, validate the Windows test path, and then remove the temporary Windows-only rust-cache failure-saving exception.

Diagnosis

Flotsync must bind caller-selected local TCP addresses because the test socket broker reserves every required socket up front. Mio supports portable pending connection completion through TcpStream::connect, but that constructor cannot bind a caller-selected local address. Mio documents TcpStream::from_std for streams already connected by another mechanism. On Windows, an explicitly-bound non-blocking connect initiated outside Mio does not reliably produce Mio AFD readiness, so the driver needs a separate completion source until the stream is established.

Local experiments ruled out two tempting shortcuts. Zero-timeout Winsock select did observe successful connects but did not expose the pending failure case. Calling take_error and peer_addr without a readiness signal is also invalid: peer_addr can return the configured target while the Windows socket is still connecting. WSAPoll is the appropriate isolated status check; Microsoft documents failed connects on supported Windows versions as writable together with error and hang-up status. A released broker TCP listener is not a deterministic refusal on this host: even a blocking standard-library connect silently times out, so tests must not require it to fail within two seconds.

Agreed design

- Preserve exact explicit local-address binding on every supported platform.
- Introduce a TCP connect module that returns the stream together with its completion source: already complete, Mio readiness, or platform monitoring.
- Keep ordinary connections and non-Windows explicitly-bound connections on the existing Mio readiness path.
- On Windows, leave explicitly-bound pending connections unregistered with Mio and track them in an isolated connect-completion monitor.
- While that monitor is non-empty, constrain the normal driver poll timeout to the next fixed-interval check. Preserve the configured timeout when it is earlier and restore normal blocking behaviour immediately after the final monitored connection finishes.
- After each due wake-up, run a zero-timeout WSAPoll check for each monitored socket inside the Windows-specific module. Treat no reported status as still pending and any reported write, error, or hang-up status as an advisory completion signal.
- Treat Mio readiness and Winsock polling only as advisory completion signals. Route both through the same finish_connect transition.
- In finish_connect, inspect take_error first and peer_addr second. Report Connected only after a completion signal and when peer_addr returns an address; treat NotConnected and EINPROGRESS as still pending; report every other error as ConnectFailed.
- Publish the actual peer address returned by peer_addr.
- On monitored success, remove the connection from the monitor and register the established stream with Mio for normal I/O. On failure, cancellation, release, or shutdown, remove it from the monitor before resetting or dropping the entry.
- Keep all unsafe Winsock code and platform conditionals inside the TCP connect module. The normal TCP lifecycle sees only the common completion-source and monitor interfaces.
- Remove the diagnostic first-post-poll probe and its connect_probe_pending lifecycle flag.

Scheduling constraints

- Use a private fixed probe interval, initially 10 ms, only while explicitly-bound Windows connects are pending.
- Do not busy-spin or reset the deadline after unrelated early wake-ups.
- Do not add a public connection timeout or broaden periodic polling to ordinary Mio-managed connections.

Validation

- Cover successful explicitly-bound connection establishment and data exchange through the Windows monitor.
- Cover deterministic connection-initiation failures reporting ConnectFailed without relying on a released local listener producing an immediate refusal.
- Cover ordinary local_addr None connections continuing to use Mio without scheduled checks.
- Cover monitored connection cancellation and restoration of the normal poll timeout.
- Cover timeout clamping and unrelated early wake-ups without deadline starvation.
- Run focused TCP tests repeatedly on Windows, then the complete serial flotsync_io suite, netcat smoke tests, formatting, and pedantic Clippy.
- Run the Windows workspace test path. Once it is clean, remove cache-on-failure and its TODO from .github/workflows/platforms.yml and validate the workflow configuration.

Constraints

- Keep the shared connection-completion state transition platform-neutral.
- Preserve the socket broker requirement that tests declare and reserve their complete socket set before execution.
- Avoid a Mio fork or unsupported Mio poll configuration.
- Expected implementation size remains below 1000 LOC."""
