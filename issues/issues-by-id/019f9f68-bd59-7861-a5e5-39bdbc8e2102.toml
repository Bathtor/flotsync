body = "Implementation progress on 2026-08-14: explicitly-bound pending Windows connects now remain outside Mio and are checked every 10 ms with zero-timeout WSAPoll. Reported status routes through the shared take_error-then-peer_addr completion transition before Mio registration. Added scheduler, early-wake, timeout-preservation, successful bound-connect/data-exchange, deterministic failure-reporting, and pending-release coverage. The complete serial flotsync_io suite passes (77 passed across targets, 5 existing Windows ignores), all 8 netcat smoke tests pass, changed Rust files pass direct rustfmt check, and flotsync_io is pedantic-Clippy clean apart from two pre-existing flotsync_utils warnings. The locked workspace command is currently blocked before tests because this local Windows machine has no libclang.dll for bonjour-sys; the platforms.yml cache-on-failure exception remains unchanged pending an actual clean CI-equivalent workspace run."
created_at = "2026-08-14T15:09:18.6119746Z"

