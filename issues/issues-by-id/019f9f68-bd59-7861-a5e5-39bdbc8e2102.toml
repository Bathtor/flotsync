id = "019f9f68-bd59-7861-a5e5-39bdbc8e2102"
ref = "flotsync-j3v"
title = "Remove temporary Windows failure caching"
body = """
Objective\r
\r
Stabilise the Windows TCP connection-failure lifecycle, verify the Windows test path, and then remove the temporary Windows-only rust-cache failure-saving exception.\r
\r
Plan\r
\r
- Track newly registered outbound TCP connections that still require their first post-poll completion probe.\r
- Make the next driver poll non-blocking while such probes are pending so Mio submits its Windows AFD poll before Flotsync checks completion.\r
- Probe those connections immediately after that poll with the existing connect-completion logic, then retain normal readiness-driven completion for connections still pending.\r
- Remove the current post-registration SO_ERROR probe because it runs before the first Windows AFD poll is submitted.\r
- Preserve deterministic explicit local and remote socket reservation in the refused-connection regression test.\r
- Add coverage for a successful explicitly bound outbound connection through the same lifecycle.\r
- Validate focused TCP tests repeatedly on Windows, the complete serial flotsync_io suite, netcat smoke tests, formatting, and pedantic Clippy.\r
- Run the Windows workspace test path. Once it is clean, remove cache-on-failure and its TODO from .github/workflows/platforms.yml and validate the workflow configuration.\r
\r
Constraints\r
\r
- Keep normal readiness-driven connect completion after the single first-post-poll probe.\r
- Do not introduce a periodic driver wake-up or general connection timeout merely to close this registration race.\r
- Preserve explicit local-address binding support.\r
- Expected implementation size remains below 1000 LOC."""
