body = "Windows-local reproduction on 2026-08-14: cargo test -p flotsync_io driver::tcp::tests::tcp_connect_failure_is_reported -- --exact --nocapture --test-threads=1 fails consistently after registering WRITABLE interest; no driver event arrives and the two-second wait expires. The complete serial flotsync_io suite reports 61 passed, 1 failed (the same test), and 2 intentionally ignored Windows backpressure tests. The historical Ubuntu netcat failure \tcp_listener_empty_scripted_line_closes_cleanly passes locally on Windows. Current diagnosis: on Windows, Mio registration queues the first AFD poll for the next Poll::poll; Flotsync's post-registration SO_ERROR probe runs before that submission, leaving a race where a fast loopback refusal can complete before AFD polling starts and then produce no readiness notification. Proposed direction awaiting plan agreement: force one immediate post-registration poll cycle and probe pending connects only after that first poll has been submitted, retain readiness-driven completion thereafter, add focused lifecycle coverage, then remove the temporary Windows cache-on-failure setting only after the Windows suite is clean."
created_at = "2026-08-14T08:31:25.3096596Z"

