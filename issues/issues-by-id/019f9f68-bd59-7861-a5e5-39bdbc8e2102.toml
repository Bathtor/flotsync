body = "PR #35's Linux Clippy job found that the common connect-completion abstraction left Windows-only variants dead on portable targets and modelled the portable monitor as a unit struct whose Default construction triggers a lint. Kept the shared state-machine shape, added narrowly target-specific dead-code allowances with reasons, and made the portable zero-sized monitor a braced struct. The exact flotsync_io all-targets no-deps pedantic Clippy target and serial tests pass locally."
