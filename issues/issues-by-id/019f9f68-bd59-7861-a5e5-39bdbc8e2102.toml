body = "Implementation diagnosis update: the first-post-poll probe removes the false success but Windows still emits no Mio readiness and SO_ERROR remains empty. Mio documents from_std for streams already connected via another mechanism, whereas Flotsync passes it an explicitly bound non-blocking stream whose connect is still pending. Mio connect cannot specify a local bind. Winsock documents non-blocking connect success through writable select readiness and failure through exceptional select readiness followed by SO_ERROR. The agreed one-shot Mio probe therefore cannot robustly implement explicit local binds on Windows; the plan needs a Windows completion-monitor choice before continuing."
created_at = "2026-08-14T08:57:48.1008848Z"

