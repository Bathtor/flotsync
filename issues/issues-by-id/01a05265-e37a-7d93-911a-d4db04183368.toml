title = "Add schema-bound transition row batches"
body = """
Extend the positional state-row batch design from flotsync-nk9.2 across the remaining named-record boundaries.

Scope:
- Design a schema-bound representation for row transitions spanning previous and current group schemas.
- Replace transition scan materialisation through ReplicationRowStateRecord where positional layouts can remain explicit.
- Reassess point-load row slices and replay consumers for the same positional representation without weakening two-schema correctness.
- Preserve row provenance, tombstones, pagination, and dataset-existence semantics.
- Keep writes record-oriented unless a batch representation materially improves their API.

This task is intentionally deferred until flotsync-nk9.2 establishes the single-schema state batch and ordinary scan contract."""
