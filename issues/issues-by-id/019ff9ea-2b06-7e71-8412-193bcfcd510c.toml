ref = "flotsync-n7j"
title = "Preserve store classifications through consumer error boundaries"
body = """
Child of flotsync-7g5.2. This task implements the approved classification-propagation half before consumer policy adoption.

Scope

- Implement StoreErrorClassificationSource on store-bearing security-store, delivery-security, provisioning, catch-up, runtime, public escalation, and other relevant wrapper errors. Delegate only through variants that retain a classified store source; non-store variants return None.
- Replace classification-erasing BoxedError fields where the concrete source is DeliverySecurityError, especially group preparation, membership changes, and inbound group setup. Keep sources boxed when useful for enum size, but retain the concrete type.
- Add ApiError::StoreExternal with StoreErrorClassification plus the original BoxError source. Provide an explicit conversion from StoreErrorClassificationSource: Some becomes StoreExternal and None remains ApiExternal. Do not apply a None-to-UNKNOWN fallback and do not add a blanket From implementation.
- Add typed StoreAccess variants to LoadError and LoadSecurityError for direct or wrapped store failures currently boxed as generic runtime or security errors. Implement classification delegation through these public boundaries while retaining generic Runtime and Other variants for genuinely unclassified failures.
- Snapshot the small Copy classification only at the two deliberate type-erasure boundaries, ApiError::StoreExternal and LoadSecurityError::StoreAccess. Keep short developer comments at both copy sites explaining that this preserves an explicitly classified variant, ordinary Snafu source handling, and direct concrete-source downcasting; a boxed optional classification-source trait object would weaken those properties and require adapter machinery.
- Audit runtime API conversion sites so store-bearing wrapper errors opt into the classified conversion while unrelated errors retain the existing unclassified context. Preserve concrete source downcasting and the opaque classification code in printed source chains.
- Update examples, public extension fixtures, and test support affected by the public error shape.
- Add focused tests proving classifications survive security, runtime, ApiError, and load-error wrapper chains and that unclassified sources remain unclassified.

Review refinements

- Describe ApiError::StoreExternal in plain language: the API operation failed due to a store error and the error chain supplied its classification.
- Retain classification copying at the two erasure boundaries after evaluating the trait-object alternative.

Constraints

- This task changes propagation only. It does not add retry, isolation, or catch-up behaviour.
- Generic mutation retries remain out of scope.
- Automatic classification is explicit at each escalation boundary.

Estimated size: 400-650 LOC for the original implementation plus a 1-3 LOC review delta; the realised task is near but not expected to materially exceed 1000 changed lines."""
