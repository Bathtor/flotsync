id = "019fec1b-5a35-72f2-a498-2c2c526db28f"
ref = "flotsync-7g5.2"
title = "Adopt classified store-failure policies across consumers"
body = """
Child of flotsync-7g5, blocked by flotsync-7g5.1. Detailed policy alignment is intentionally deferred until the classification contract and SQLite backend mapping are complete and reviewed.

Current broad scope

- Replace reliable-delivery retry-all behaviour for admission, selected-row load, cleanup, and restart with explicit retry, isolate-record, or fail-component decisions.
- Preserve existing bounded backoff only for classifications that permit repeating the relevant idempotent operation.
- Report and deliberately isolate invalid data scoped to one selected reliable-delivery record. Do not treat bulk invalid data or store-wide corruption as a transient per-message failure.
- Implement the dyn-compatible classification-access trait on delivery security, security-store, runtime, public escalation, and other relevant wrapper errors by delegating through store-bearing variants.
- Avoid erasing typed classification into plain BoxError where escalated callers need programmatic access. Preserve the opaque code in printed source chains.
- Audit catch-up, runtime transactions, startup, provisioning, examples, public extension fixtures, and test stores. Every classification family must be deliberately propagated, retried, isolated, or escalated.
- Keep generic write retry policy operation-specific; classification alone does not prove an arbitrary mutation safe to repeat.
- Remove all flotsync-7g5 retry-all TODOs and add focused behavioural tests.

Estimated size: approximately 550-950 LOC.

Before implementation, re-inventory consumers against the completed flotsync-7g5.1 API and align a concrete per-consumer policy matrix with the user."""
