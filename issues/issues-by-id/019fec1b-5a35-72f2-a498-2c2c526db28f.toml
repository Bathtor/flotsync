id = "019fec1b-5a35-72f2-a498-2c2c526db28f"
ref = "flotsync-7g5.2"
title = "Adopt classified store-failure policies across consumers"
body = """
Child of flotsync-7g5. The classification contract and SQLite mappings are complete in flotsync-7g5.1. The consumer adoption work has been fully aligned and split into two ordered children because the repository-grounded estimate is approximately 910-1,470 LOC.

Agreed policy

- Reliable-delivery admission retries only Retry and WaitForResume for the idempotent stored-work upsert. Other store failures fail the component.
- Delivery-security store failures during admission follow the same typed policy; non-store security failures retain per-message rejection.
- Selected reliable-delivery row loads retry Retry and WaitForResume. Exactly Record + InvalidData + Repair is isolated by cleanup of that exact row. All other failures fail the component.
- Cleanup deletes retry Retry and WaitForResume while keeping the message excluded. All other failures fail the component.
- Bulk reliable-delivery restart hydration remains fatal for all store errors.
- Catch-up serving is best effort: ordinary per-request store failures are logged and ignored, and only truly global fatal classifications showing that the store cannot be read again escalate. Catch-up startup and bulk hydration remain fatal.
- Runtime transactions and provisioning propagate classified failures without adding generic mutation retry.
- Recreate escalates where the consumer does not own the resource. Unknown or incomplete classifications never authorise record deletion.

Split

- flotsync-n7j preserves classification through security, runtime, API, and public load error boundaries. Estimated 400-650 LOC.
- flotsync-6at0 adopts reliable-delivery and catch-up behaviour and is blocked by flotsync-n7j. Estimated 510-820 LOC.

Acceptance criteria

- Typed classification survives every relevant wrapper and public escalation boundary without a lossy None-to-UNKNOWN fallback.
- Existing source downcasting and printed stable codes remain available.
- Reliable delivery no longer retries all store errors or deletes work based on an unknown classification.
- Catch-up serving remains available on a best-effort basis and escalates only globally fatal store-read conditions.
- No generic mutation retry is introduced.
- Focused delegation and behavioural tests cover classified and unclassified paths."""
