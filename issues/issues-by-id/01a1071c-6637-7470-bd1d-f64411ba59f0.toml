title = "Complete concurrent shutdown and terminal event handling"
body = """
Goal
Complete shutdown, cancellation and terminal mailbox behaviour with concurrent flows. Lifecycle half of parent R18; follows flotsync-zop.22.

Instructions
S01. Stopping closes new-flow admission, resolves queued API requests, and disposes pending protocol inputs according to the verified delivery contract. Existing flows must still receive completions needed for cleanup or a safe committed checkpoint.
S02. Define phase-specific finish/cancel/fault behaviour. Dropping an effect or losing a reply does not prove rollback; do not return owned partitions while an effect can still mutate their state. Preserve read-provider and transaction cleanup and explicit faulted partitions.
S03. Integrate finite-flow failure/timeout handling with host shutdown. A hung listener cannot be promised an indefinite graceful drain; define escalation without pretending arbitrary futures are safely cancellable. Use scheduled timer UUIDs where timers are needed.
S04. Retire events for terminated flows as legitimate replay/stale input or invariant failure, rather than leaving them at the mailbox head. Guard stopped state against late completions. Preserve idempotent public shutdown and component-replacement deferral to flotsync-sae.

Acceptance and validation
Exercise stopping while writing, after commit before publication, during listener/provider delivery, with deferred requests and with full queue capacity. Verify no lost reply/processed obligation, invalid partition return or post-stop state mutation. Test repeated shutdown and late completions.

Review and size
250-450 edited/new LOC including tests; split if timeout/host integration exceeds 800 substantive lines. Follow parent validation/no-staging and user acceptance before closure.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Finite ownership is conditional on effect completion or a defined safe timeout/fault policy; arbitrary store/listener futures cannot be assumed cancellable. Distinguish pre-commit rollback, accepted pending work left resumable, activation committed with projection pending, fatal provider-open failure after pending removal, and caller-specific post-commit listener failures. Keep partitions owned/faulted while an in-flight effect may still mutate them; lost reply does not restore consistency.

Stopping must leave active completions selectable even behind queued new work or at ordinary capacity. Reliable terminal handling uses the .20 verified processed/retry contract and Summary manager's separate response ownership, not unconditional acknowledgements. Reuse gate cleanup's assertion-unwind release for test hygiene, but do not treat it as production cancellation evidence. Cover retained provider release, hung listener escalation, callback re-entry, late completions and repeated host shutdown; use scheduled timer UUIDs rather than additional timer-generation counters."""
