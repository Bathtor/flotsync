id = "019f0542-b0cc-70a2-9d97-5aa133ae5801"
ref = "flotsync-b6lc"
title = "Persist reliable outbound state and bound sealed bootstrap fan-out"
body = """
Follow-up from flotsync-sec.4. Reliable bootstrap payloads can contain substantial group state, so reliable delivery must persist unacknowledged outbound work and bound the number of recipient envelopes retained for active sends.

Reliable delivery remains one-to-one. Each submitted message is HPKE-sealed and sender-signed independently, then the complete encoded recipient envelope is persisted before its first transport submission. Retries and restart recovery reuse the exact stored bytes for the same message id. Stored metadata contains the message id, recipient, and the UTC wall-clock time when reliable delivery first began processing the submission.

A focused ReliableDeliveryStore capability is composed into ReplicationStore and passed to delivery as a narrower trait object. SQLite stores one row per message. Startup loads all lightweight metadata in unspecified order; OutboundState builds the in-memory scheduling order. Full envelope blobs are loaded only when a usable route and an outbound-attempt slot are both available. No speculative database index is part of this task.

ReliableDeliveryComponent keeps only its Kompact context and ports plus four concise private state groups: Config, InboundState, OutboundState, and SharedState. Config loads its complete value from Kompact at startup. OutboundState owns persistence, admission, sender work, ready and waiting indexes, active attempts, cleanup, and warning suppression. Its implementation lives in reliable_delivery/outbound.rs. ReliableDeliveryComponent retains all Kompact execution-mode decisions, timers, transport asks, and visible Handled::block_on and spawn_local boundaries.

Every persisted message remains represented by one ReliableDeliveryWorkItem through its complete lifecycle. The lifecycle distinguishes waiting for a route, queued, retry scheduled, attempting direct transport, awaiting recipient acknowledgement, and stored-row cleanup. Cleanup state records its reason, whether row removal is pending, and any outstanding send id. A work item is removed only after stored cleanup and any outstanding transport result have both converged. Late transport results for cleanup work release capacity but have no semantic effect. This keeps the message id reserved against duplicate admission.

OutboundState retains attempts_in_flight as a HashSet<MessageId>. It is an explicit capacity index whose size enforces the configured concurrency limit without arithmetic drift. Each work item remains authoritative for lifecycle and send-id state; ready, waiting, and attempts_in_flight are validated indexes. Ack-timeout warning state belongs to the work item. The obsolete retry_after field is removed: RetryQueue alone owns retry due times, while the work lifecycle records whether a retry is scheduled.

The active outbound-attempt limit is declared through Kompact with a greater-than-zero validation expression and defaults to ten. Outbound selection is synchronous, oldest-first, bounded directly in the loop condition, and returns SmallVec<[OutboundAttempt; 1]> in stack order with the oldest attempt at the end. Items with available routes enter ready; other route-eligible items enter waiting. Retry-scheduled work remains outside both until its timer fires. Route withdrawal consumes and partitions the ready set.

Ready and waiting indexes share one mutable validation helper for work presence, ReadyKey identity, and expected lifecycle state. Mismatches log at error level, purge only the affected message, cancel its retries, and allow unrelated work to continue. Validation and movement return explicit success-or-purged outcomes rather than inverted booleans. Waiting work for a newly available route is moved by ready_waiting_items_for_route. Route-index removal always receives the exact ReadyKey and recipient from authoritative work and mutates only that ready entry and recipient waiting set. Indexed callers detach an observed stale entry before validating it, so missing authoritative work never triggers a whole-index scan.

TrieMap gains a documented and tested insertion-oriented mutable accessor equivalent to HashMap entry-or-default behaviour. Reliable delivery uses it to update one recipient waiting set in place rather than remove and reinsert the value.

Admission distinguishes plaintext awaiting security processing from an already encoded encrypted envelope awaiting persistence. A named outbound helper seals plaintext and constructs stored work. Retryable security or persistence failures retain their current representation, warn immediately about shutdown loss, and retry. Once sealing succeeds, persistence retries reuse only the encoded envelope. Permanent security failures remove admission state and are reported visibly.

Transport-result transitions, permanent-failure transitions, and stored-row removal attempts are implemented on OutboundState and return explicit effects to the component. Stored-envelope loading and verified acknowledgement removal use visible Handled::block_on boundaries at component call sites so cleanup cannot interleave with a suspended store load. Route-transport result futures remain non-blocking only after encoded bytes are owned in memory. Callers reserve the initial oldest-first attempt batch synchronously before entering blocking mode; the loading helper consumes that batch in stack order, refills released slots internally, and uses one loop termination condition.

The current StoreError API erases failure disposition behind StoreExternal { BoxError }. As a temporary stepping stone, this task treats every StoreError from per-message load or removal as retryable and carries TODOs linked to P0 task flotsync-7g5. A load failure releases its attempt slot, retains the work item in retry-scheduled state, and schedules backoff. A removal failure retains cleanup state and schedules a dedicated removal retry. Ok(None) is a separate invariant mismatch that logs and purges all in-memory references for the message id.

The ReliableDeliveryStore public documentation is implementor-first and positive. Each method first states what a backend must do and then when reliable delivery calls it. Metadata retrieval has no ordering requirement. Full-work lookup documents Ok(None). Removal returns true when a row was removed and false otherwise.

Pre-encoded envelope bytes are submitted with PayloadWriter::splice_bytes and a cheap Bytes clone. Random route-send identifiers are created through RouteSendId::new_random(). Implementation must inspect and reuse established project APIs before introducing bespoke mechanisms.

The replication runtime continues to trigger independent bootstrap messages through the fire-and-forget delivery port. Trigger sites document the accepted limitation that shutdown can occur after only a subset of recipient messages has been sealed and persisted. This task does not add persistence acknowledgements or make group creation wait for the complete recipient set.

Reliable-delivery tests use one configurable store wrapper for observations, queued persistence/load/removal faults, missing-row injection, and full-load gates. Existing coverage is preserved and extended for acknowledgement during an active resend, strict slot retention until a late result, duplicate-id rejection during cleanup, cleanup completion in either result/removal order, explicit retry-scheduled state, targeted index purge, and TrieMap insertion-oriented mutable access.

## Acceptance Criteria

Reliable delivery persists every successfully sealed outbound envelope before transport submission and resumes unacknowledged work after restart. Stored envelopes are recipient-confidential HPKE payloads and are reused unchanged for retry. Retryable pre-persistence failures are retained in memory, warned about immediately, and retried without repeating completed sealing. Startup and route-pending handling do not load full envelopes without usable routes. At most the validated configured number of attempts remain active, defaulting to ten. Retry-scheduled work cannot become ready before its timer fires.

Every persisted message has one authoritative work item through active sending and cleanup. The in-flight set remains a capacity index and agrees with attempting or cleanup work carrying an outstanding send id. Pending cleanup cannot resend completed work or permit duplicate message-id admission. Late transport results for cleanup work only release capacity. Missing rows and index mismatches are observable and isolate one message.

Component state is grouped by responsibility. Outbound behaviour lives on OutboundState in outbound.rs, while Kompact blocking and spawning remain visible in the component implementation. Waiting work uses TrieMap with in-place entry mutation, route withdrawal partitions the ready set, and encoded Bytes reach egress without copying. Store metadata order is unspecified and SQLite performs no ordering for that load.

Tests cover SQLite round-trips, unordered metadata loads, restart/resume, the configured N versus N+1 bound, starvation avoidance, retryable and permanent security outcomes, persistence retry without resealing, acknowledgement/load serialisation, acknowledgement timeout, completion cleanup, zero config validation, missing-row isolation, retryable load and removal failures, cleanup during active transport, invariant mismatch cleanup, waiting-trie transitions, route-withdrawal partitioning, and consolidated store-test instrumentation.

## Implementation Plan

1. Add TrieMap insertion-oriented mutable access and tests; make ReliableDeliveryStore documentation implementor-first and unordered; remove SQLite ORDER BY and order-dependent assertions.
2. Make Config load itself and consolidate reliable-delivery store test wrappers.
3. Redesign ReliableDeliveryWorkItem lifecycle, retaining attempts_in_flight as a HashSet capacity index while moving pending removal and warning state into work items; remove retry_after in favour of explicit waiting and retry-scheduled states.
4. Centralise indexed-work validation around one mutable lookup, use explicit outcomes, rename waiting-to-ready behaviour, and make route-reference removal accept an exact ReadyKey and recipient without any whole-index fallback scan.
5. Move sealing, transport completion, permanent failure, and removal behaviour onto OutboundState while keeping all Kompact execution boundaries visible.
6. Rewrite the outbound load/refill loop around one termination condition, have selection return stack-ordered attempts with the oldest at the end, preserve synchronous pre-blocking reservation, and preserve per-message error isolation.
7. Add RouteActiveState send-id access and complete boolean, removal-state, and transport-result documentation.
8. Adapt and extend focused tests, then run formatting, sequential focused and package tests with one test thread, pedantic Clippy, the Rust instruction audit, whitespace checks, and a final FB-46 through FB-77 audit.

The aligned fourth- and fifth-round corrections are implemented in one pass each. The fifth-round correction is estimated at roughly 85–180 touched LOC and retains the previously agreed architecture."""
