id = "019ff9ef-0a76-7f91-876c-af0fc45715c8"
ref = "flotsync-6at0"
title = "Apply classified store-failure policies in delivery and catch-up"
body = """
Child of flotsync-7g5.2. This task implements the approved consumer-policy half after classification propagation is available.

Reliable-delivery policy

- Use a consumer-local typed policy that retries only classifications whose resolution equals Retry or WaitForResume.
- Admission persistence retains already encoded idempotent work for retryable classifications. Other store failures fail the component instead of spinning or silently discarding accepted work.
- Delivery-security store failures during admission use the same classified retry versus component-failure decision. Retryable non-store security failures remain retained; permanent non-store failures retain the existing per-message rejection behaviour.
- Selected-row load uses the existing sender retry for retryable classifications. Isolate only the exact classification whose scope equals Record, class equals InvalidData, and resolution equals Repair: mark that message for cleanup and delete only that row. Every other store failure fails the component. Unknown or partially classified errors never authorise deletion.
- Cleanup deletion retains the message exclusion for retryable classifications. Every other failure fails the component so the failure is visible. Escalate the error before matching the successful cleanup outcome.
- Cleanup state remains in memory rather than extending the stored schema in this task. Reliable delivery is explicitly at-least-once: if stored-row cleanup is incomplete when the component or process stops, startup may redeliver a message that was already processed or deliberately abandoned.
- Present the public interface as reliable message delivery. Document duplicate delivery as a rare recovery outcome, such as after a crash before cleanup completes, and require semantic consumers to handle duplicate message ids safely without implying that routine delivery duplicates messages.
- Bulk reliable-delivery metadata loading remains fatal for every store error because the current bulk API cannot safely identify and isolate one bad row.
- Recreate escalates because reliable delivery does not own the affected connection or pool resource.

Catch-up policy

- Catch-up serving is best effort. Store failures while fulfilling one NeedRange are logged and ignored because an individual member need not serve that request. Do not add a second local retry mechanism; the protocol may request the range again.
- Escalate only these exact, fully classified global failures: scope Store plus class InvalidData plus resolution Repair; scope Store or Environment plus class Configuration plus resolution Reconfigure; or scope Store plus class Contract plus resolution FixBug. The first case means store-wide invalidity, not record-level invalid data.
- Record-scoped invalid data, unknown or incomplete classifications, connection recreation, resource exhaustion, and transient availability failures are logged and ignored for that individual NeedRange request.
- Define the boundary through a small catch-up-local policy helper using typed fields rather than opaque display codes, and document and test the lifecycle outcomes.
- Startup and bulk availability hydration remain fatal because the component cannot establish its authoritative local availability view.

Shared store test support

- Maintain one controllable store wrapper in the store module's own test support so store fault injection is discoverable at the boundary it models.
- The wrapper implements both ReplicationStore and ReliableDeliveryStore, delegates ordinary operations to SQLite, retains the reliable-delivery observations, gates, and classified faults, and adds classified read-transaction failure injection for catch-up.
- Remove the reliable-delivery-local and catch-up-local store wrapper implementations and use the shared controlled store from both suites.
- Do not expose this internal fixture as public production API.
- Keep the delegated store outside one state mutex that protects all test controls and observations. Each intercepted call updates observations and consumes configured behaviour under one lock, then releases it before delegating or awaiting.

Other consumers

- Runtime transactions and provisioning continue to propagate classified failures; do not add generic mutation retries.
- Existing inbound payload rejection versus fatal-component policy remains unchanged except where typed delegation is required by the preceding child.
- Remove the remaining flotsync-7g5 retry-all TODOs and audit examples and test stores for deliberate behaviour.

Tests

- Add table-driven tests for each consumer-local policy, including unknown and incomplete classifications.
- Add reliable-delivery behavioural tests for retryable and fatal admission, retryable selected load, invalid-record isolation, permanent selected-load failure, retryable cleanup, and permanent cleanup failure.
- Explicitly document restart redelivery after incomplete cleanup at the consumer contract boundary.
- Add catch-up tests showing ordinary per-request store failures are non-fatal and only the exact globally unusable store classifications escalate.
- Run focused suites, the complete replication suite, Rustdoc, formatting, and pedantic Clippy.

Estimated size

- Policy helpers and integration: 240-430 LOC.
- Shared test wrapper: about 240 moved LOC plus 50-90 LOC of ReplicationStore controls.
- Tests and documentation: 280-430 LOC.
- Logical source remains below 1000 LOC, though moving the existing wrapper may produce roughly 450-650 diff lines."""
