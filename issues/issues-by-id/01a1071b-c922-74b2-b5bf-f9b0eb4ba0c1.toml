ref = "flotsync-zop.05"
title = "Introduce owned publication FSM and blocking driver"
body = """
Goal
Introduce the runtime-local owned FSM/driver shape and convert publication first, still using blocking execution. Implements parent R05; follows flotsync-zop.04.

Instructions
S01. Implement concrete publication states/events/effects and terminal outcomes. Writing and Notifying must distinguish transaction failure from committed-but-not-notified failure. Keep the reply obligation with the live operation.
S02. Introduce only the small shared transition/driver facilities demonstrated by this flow. Do not depend on flotsync-rok/ct7n or build an Any-based/general-purpose framework.
S03. Model owned partitions across the full consistency interval now, even though admission is still serial. Explicitly record an owned/occupied partition across await; do not use transition-only &mut borrowing as the complete ownership design. Document what consistency is restored before return.
S04. Install the next state before executing its effect; execute transactional helpers as linear async functions and feed typed completion back to the machine. Use Handled::block_on as the initial adapter. Keep other operations on their existing paths temporarily.

Acceptance and validation
Tests cover successful state/effect sequence, write failure, notification failure after commit, reply disposal and impossible internal completion with contextual Snafu error. Existing publication integration behaviour is unchanged. No committed-write retry, API reshaping or concurrency enablement.

Review and size
450-650 new/edited LOC including tests; at most 150 relocated. Document compile-time versus runtime guarantees, inspect duplication and run relevant tests/pedantic Clippy. Follow parent review rules; no staging or closure without acceptance.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Publication owns its group consistency interval and notification lane through callback completion, including the API reply obligation. The current component has no persistent mutable per-group row/vector cache: LoadedGroupMeta, PendingUpdateSet and prepared payloads are local values that should become phase-owned payloads, not a new mirrored database. Immutable identity/configuration and cloned output handles do not automatically become exclusive partitions.

Use the accepted publication phase table to distinguish Writing from committed outbound/notification work, with explicit restoration or fault disposition. The shared DataChangeCompletionGate already supports deterministic listener waits and release on assertion unwinding; reuse it. Add pure effect-order tests for commit -> outbound -> catch-up -> listener -> reply, since .01's new integration gate observes commit/listener/reply only. Keep the first driver blocking while its state/effect API accommodates correlated asynchronous completions later."""
