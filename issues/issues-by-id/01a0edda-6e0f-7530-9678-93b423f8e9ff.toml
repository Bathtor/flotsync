title = "Move SQLite replication store into its own crate"
body = "Investigate moving the SQLite replication-store implementation from flotsync_replication into its own crate. The current in-crate implementation can access crate-private projection constructors that external store backends cannot, which let the public API become unusable downstream in flotsync-h3l.4. Compare a separate crate with a dedicated external-backend compile test, identify the public constructors and validation helpers the SQLite implementation would then require, and estimate dependency/API churn. Keep this as a follow-up design and extraction task; flotsync-h3l.4 must still expose a usable public construction path."
