title = "Complete summary flows and security adapters"
body = """
Goal
Complete explicit summary/read flow integration and narrow security request adapters. Covers parent F08 and remaining R02/R13 concerns; follows flotsync-zop.13.

Instructions
S01. Represent local/inbound summary read, reply or delegation and completion as finite operations compatible with the shared driver. Preserve reliable summary processed completion after reply submission.
S02. Keep remote request correlation, route handling and timeouts in SummaryRequestManagerComponent; NeedRange ownership remains in CatchUpManagerComponent.
S03. Preserve advisory summary inspection's stale-tolerant semantics and security operations' existing independent execution until scheduler integration. Record store aliases and mutable security assumptions rather than treating different service fields as independent databases.
S04. Give simple security calls explicit completion/reply ownership without inventing long-lived security FSMs. Preserve public API/message exports and current classification of inbound errors. Replace the temporary ReplicationRuntimeComponent impls introduced in component/summary_api.rs and component/security_api.rs by .02: move summary behaviour to its finite flow types and security behaviour to narrow operation/service owners, with each type's impls colocated. Keep any necessary thin component scheduling/delegation methods in component/mod.rs. Retire the corresponding TODO(flotsync-zop) markers as their conversions complete.

Acceptance and validation
Test local summary success/failure, remote delegation, reliable reply/processed order, advisory staleness and security reply mapping where coverage is missing. Every runtime input family now has a named owner and a clear future scheduler classification. Neither summary_api.rs nor security_api.rs may contain a ReplicationRuntimeComponent impl after this child; verify colocation of new flow/service impls without changing separate-manager ownership.

Review and size
200-350 edited/new LOC including tests, at most 150 moved. Do not refactor remote manager protocols or select a permanent gateway architecture. Follow parent Rust/review rules; no staging or premature closure.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Keep remote summary correlation and reliable Summary response processed completion in SummaryRequestManagerComponent. Runtime observation of that same port input is advisory; both receive clones of one claimable promise, so the runtime must not complete the manager's obligation. For an inbound reliable SummaryRequest, runtime reply submission precedes runtime-owned processed completion. NeedRange continues through CatchUpManagerComponent.

Security paths differ: key assessment may read or store candidate evidence; record feedback writes; known-key lookup reads; local public bundle lookup is synchronous; observed summary work is spawned advisory inspection. Classify narrow adapters by their actual effects instead of one exclusive security flag. SecurityStore uses the same underlying store; declare the alias for .15/.16. Preserve current independent semantics initially and audit all inventory entries before declaring blocking conversion complete."""
