id = "019f9e74-50d2-7bb1-8968-cdc9c89d0ca2"
ref = "flotsync-ng3"
title = "Repair nightly portability CI and replace pnet interface discovery"
body = """
Objective

Repair the deterministic nightly CI failures without installing a packet-capture runtime merely to enumerate network interfaces.

Plan

- Add --no-default-features to the mobile portability cargo check so generic Linux cross-targets do not enable the local keychain backend. Estimated 1 LOC.
- Commit the Linux workflow repair independently.
- Replace pnet_datalink with netdev using default-features = false. Map native interface metadata into Flotsync-owned snapshot types shared by endpoint selection and peer announcement. Estimated 70-140 LOC.
- Preserve interface filtering semantics: operational state, running state, loopback, point-to-point, broadcast capability, MAC identity, and address prefixes.
- Re-enable flotsync_discovery and flotsync_discovery_cli in the Windows nightly tests. Estimated 2 LOC.
- Add or adapt focused unit tests for the interface mapping and peer-announcement broadcast selection. Estimated 30-60 LOC.
- Make the discovery decode-location display assertion platform-neutral by using the compiler-provided file path instead of hard-coded Unix separators. Estimated 1 LOC.
- Make closed-port TCP failure tests deterministic on Windows by reserving distinct local and remote ports, explicitly binding the client locally, and removing the Windows ignore. Estimated 25-50 LOC.
- Replace the empty-send listener forced termination with normal application shutdown and a genuine successful-exit assertion. Estimated 2-5 LOC.
- Follow the documented Mio connection sequence by registering new outbound streams as pending and checking completion after readiness. Estimated 5-15 LOC.
- Temporarily enable rust-cache failure saves only on Windows, with a TODO to remove the exception once Windows CI is stabilised. Estimated 3 LOC.
- After registering an outbound stream, inspect take_error() once to catch a Windows failure that completed between connect and registration; if no error is pending, preserve the normal readiness-driven full completion check. Estimated 5-15 LOC.
- Validate formatting, focused TCP and netcat tests, the complete flotsync_io suite, changed-crate pedantic Clippy, the Windows cross-target check, and one final pushed Windows CI run.

Constraints

- No Npcap or WinPcap runtime should be required.
- Preserve current mobile target support.
- Stop and report if netdev target support or interface semantics do not hold up.
- The unrelated macOS reliable-delivery cleanup flake is explicitly deferred.
- Do not iterate indefinitely on Windows-only behaviour from macOS; after this final pushed Windows run, continue any remaining platform-specific work on a Windows development machine.
- Remove Windows cache-on-failure once Windows CI is stabilised.
- Expected total implementation size: approximately 140-300 LOC, below 1000 LOC."""
status = "closed"
status_reason = "completed; remaining Windows work finished in flotsync-j3v"
