id = "01a04cec-591e-7a31-a545-d82a3d62a9c8"
ref = "flotsync-nk9.1"
title = "Add projected hash map and ordered schema"
body = """
Implement the reusable unordered and positional projected-key collections and apply them throughout Schema, OrderedSchema, and in-memory schema consumers.

Scope:
- Add flotsync_utils::ProjectedHashMap<Value, Projection, HashBuilder = std::collections::hash_map::RandomState> as a representation-hiding newtype around iddqd::IdHashMap.
- Expose representation-independent construction, iteration, lookup, insertion/replacement, removal, length, equality, caller-selected hashing, and guarded mutable access. The mutable guard checks on drop that the projected key did not change; Field::name remains public.
- Keep the contiguous positional implementation as ProjectedIndexHashMap. It retains input order, boxed contiguous values, and projected-key-to-index lookup.
- Place ProjectedHashMap and ProjectedIndexHashMap in the same public projected_hash_map module while keeping their representations independently replaceable.
- Give both generic collections the safe standard RandomState default. OrderedSchema explicitly selects ahash::RandomState because schema data is trusted and the layout is performance-sensitive.
- Keep checked ProjectedIndexHashMap constructors and add safe from_values_unchecked variants that skip duplicate detection. Their contract requires unique projected keys and leaves lookup behaviour unspecified when violated.
- Make DuplicateProjectedIndexKeyError index fields public. Use neutral loop index names, enumerate values directly, and name lookup results before branching.
- Change Schema columns to a ProjectedHashMap specialisation keyed by Field::name, eliminating duplicate field-name storage while preserving arbitrary iteration order, unordered equality, and the existing serialisation shape.
- Make Schema::try_from_fields insert incrementally, validate each field as encountered, and stop at the first duplicate or invalid default.
- Feed decoded protobuf fields lazily into Schema::try_from_fields so decoding stops at the first codec or schema-construction error without an intermediate field vector. Retain the process_results closure required by its borrowed error-slot lifetime and explain that briefly.
- Translate SchemaBuildError through From<SchemaBuildError> for SchemaCodecError.
- Store invalid-default field context only in FieldValueBuildError; SchemaBuildError and SchemaCodecError wrap that source without duplicating the field name.
- Keep OrderedSchema as a whole-schema borrowed-or-owned representation. Construction uses source Schema iteration order without allowing callers to choose it.
- Compare OrderedSchema values positionally, compare OrderedSchema with Schema unordered, and retain eq_unordered for two ordered schemas.
- Convert borrowed OrderedSchema values to owned by cloning fields and metadata; reconstruct the already-owned variant to express the static result lifetime.
- Keep public OrderedSchema documentation focused on order and allocation behaviour. Remove opaque terminology, internal representation details, impossible panic contracts, key/name assertions, and their mismatch test.
- Replace duplicated field-name vectors and lookup maps in both InMemoryStateData and InMemoryValueData with a private owner/dependent wrapper that owns SchemaSource and borrows it through OrderedSchema. Preserve source Field pointer identity and do not clone field names merely to establish positional lookup.
- Adapt row snapshots, field-state encoding/decoding, operations, replication, examples, codecs, and tests to use the new schema APIs.
- Keep all work under this task; do not split further.

Concrete API direction:
- Shared KeyProjection<Value> trait.
- ProjectedHashMap constructors with safe defaults and explicit hash-builder variants; get, get_mut guard, contains_key, iter, len, is_empty, insert_unique, insert_overwrite, and remove.
- ProjectedIndexHashMap checked and unchecked constructors; get, get_index_of, get_index, values, iter, len, is_empty, and into_values.
- Schema::from_fields plus an incremental fallible iterator-based Schema::try_from_fields path for dynamic callers.
- OrderedSchema::from_schema, from_owned_schema, into_owned, field, field_index, field_at, fields, len, is_empty, metadata, and eq_unordered.
- Private shared ordered-schema owner wrapper used by both in-memory data stores.

Validation:
- Unit tests cover unordered projected lookup, insertion policies, guarded non-key mutation, runtime rejection of projected-key mutation, duplicate rejection, collision correctness, arbitrary-order equality, and safe default plus explicit hashing.
- Unit tests cover positional lookup, duplicate checking, public duplicate indices, valid unchecked construction, collision correctness, and preserved input order.
- Unit tests cover Schema duplicate rejection, structured invalid-default rejection, unordered equality, and ergonomic guarded field metadata mutation.
- Message-codec tests cover structured duplicate-field and invalid-default failures.
- Unit tests cover borrowed and owned OrderedSchema values, ownership conversion, retained owned field-name allocations, positional equality, unordered comparisons, metadata, and source-field reuse.
- In-memory state/value tests cover OrderedSchema-backed lookup, row layout, snapshots, and source Field pointer identity.
- Run formatting, focused crate tests, relevant workspace checks, and pedantic Clippy serially.

Estimated final size:
- Existing projected collection and schema implementation remains approximately 950-1450 LOC.
- This review round adds or changes approximately 500-750 LOC, primarily the shared owner/dependent schema wrapper, in-memory adaptations, mutable guard, module consolidation, and tests.
- The agreed review delta remains below 1000 LOC and stays cohesive within this task.

Fourth-review refinements:
- Generalise the private snapshot writer over schema-field lookup so it can validate against either Schema or OrderedSchema.
- Pass only OrderedSchema through the in-memory state-row encode path; do not thread the unordered and ordered views together when they come from the same owner.
- Preserve SchemaSource representation-sensitive equality in OrderedSchemaSource. Ordered equality covers schema content and position; owner equality additionally distinguishes documented Static and Shared representations.
- Describe row initialisation as following the supplied OrderedSchema instance's field order, without implying a canonical Schema order.
- Keep the existing generic projected-key mutation rejection test as the single contract test.

Fourth-review validation:
- Cover the Static-versus-Shared equality counterexample directly.
- Run focused data-type tests, formatting, workspace all-target checking, pedantic Clippy, and diff whitespace checks.

Fourth-review estimate:
- Private snapshot schema-view abstraction and call-site cleanup: 50-90 LOC.
- Equality explanation and coverage: 15-30 LOC.
- Documentation adjustment: 1-5 LOC.
- Total: approximately 65-125 LOC, below 1000 LOC."""
