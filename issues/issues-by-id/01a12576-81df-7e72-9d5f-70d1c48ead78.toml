title = "Improve the schema DSL for typed nullable scalar fields"
body = """
Discovered during maintain-rs-m5t.4.3 review in /Users/lkroll/Programming/maintain-rs. Application schema declarations currently need a local latest_value_wins(name, primitive, nullable) helper to construct BasicDataType::Primitive and wrap it as NullableBasicDataType::Nullable or NonNull before calling Field::latest_value_wins. Improve the public schema DSL so common typed scalar fields and their nullability can be expressed directly without application-owned boilerplate or boolean nullability flags.

Propose and align on the API before implementation. Preserve the existing replicated semantics and error handling. Cover non-null and nullable String, Int, Timestamp and Binary declarations used by MaintainRS, and document the supported construction paths with examples. Prefer explicit typed or named nullability choices. Demonstrate that equivalent schemas can be declared without a local helper and keep backwards compatibility where practical. This is an upstream API task, independent of implementing the current MaintainRS review fixes."""
status = "open"
