id = "019f0542-b0cc-70a2-9d97-60b4c9f35b52"
ref = "flotsync-8la"
title = "Track stable Rust compatibility"
body = """
Objective

Keep Rust nightly as the primary development toolchain while making the workspace build, test, release-build, and expose benchmark targets on the declared stable MSRV in the agreed CI scopes.

Agreed constraints

- Preserve nightly-only standard-library APIs where they provide value and select functional stable fallbacks at compile time.
- Use established compiler-channel detection rather than parsing compiler output.
- Declare Rust 1.96 as the workspace MSRV and pin CI to Rust 1.96.0.
- Pull-request jobs run no release builds.
- Pull-request macOS runs Rust-nightly tests and benchmark compilation only.
- Pull-request Linux reuses one job for Rust-nightly tests/benchmarks and MSRV tests/benchmarks.
- Scheduled native CI provides the full Linux, macOS, and Windows matrix for both toolchains, including tests, release builds, and benchmark compilation.
- Scheduled mobile portability remains compile-only but covers both toolchains.
- Do not add stable formatting or stable Clippy.

Implementation plan

1. Add a small flotsync_build_support workspace crate that depends on rustversion and exposes the checked flotsync_nightly cfg emission. Call it from the existing flotsync_messages build script and the flotsync_udpour build script, removing duplicated channel-detection code and direct rustversion build dependencies.
2. In flotsync_messages, enable iterator_try_collect only under flotsync_nightly. Add itertools directly and conditionally import Itertools in the three modules containing the seven current try_collect calls only when flotsync_nightly is absent. Keep every call expression unchanged.
3. In flotsync_udpour, enable deque_extend_front only under flotsync_nightly. Keep VecDeque::prepend on nightly and select an order-preserving reverse/push_front fallback on stable through cfg_select!.
4. Declare rust-version = "1.96" in workspace package metadata and inherit it explicitly in every member package.
5. Document Rust nightly as the development toolchain and Rust 1.96 as the minimum supported Rust version, including local MSRV test, release-build, and benchmark commands.
6. In pr-linux, run workspace tests and benchmark compilation on Rust nightly and Rust 1.96.0 in the existing shared job. Remove the MSRV release-build step.
7. In pr-macos, retain Rust-nightly workspace tests and add Rust-nightly benchmark compilation. Add no MSRV or release-build phase.
8. In platforms, install Rust nightly and Rust 1.96.0 once per native OS job, then run workspace tests, release builds, and benchmark compilation explicitly on both toolchains across Linux, macOS, and Windows.
9. In mobile-portability, install both toolchains and target components, then run the existing compile-only library subset check explicitly with each toolchain for every scheduled target.

Validation coverage

- Existing codec tests cover all seven result-collection sites on Rust nightly and the MSRV.
- Existing UDPour repair tests cover the nightly prepend implementation and stable ordered fallback in their respective toolchain suites.
- Run pinned-nightly formatting and pedantic Clippy.
- Run full workspace tests and compile benchmarks without execution on Rust nightly and Rust 1.96.0.
- Run local release workspace builds on both toolchains to mirror scheduled native CI.
- Validate locked dependency metadata and workflow diffs.

Explicit deferrals

- No stable formatting or stable Clippy.
- No MSRV checks outside Linux on pull requests.
- No release builds in pull-request workflows.
- No runnable tests, release links, or benchmarks in cross-target mobile portability jobs.
- No support below Rust 1.96.

Estimated size

Approximately 120 to 180 LOC overall, well below 1000 LOC."""
