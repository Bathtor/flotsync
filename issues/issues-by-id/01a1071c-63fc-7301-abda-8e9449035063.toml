title = "Drive owned flows with asynchronous completions"
body = """
Goal
Replace blocking execution with correlated asynchronous effects while still admitting at most one exclusive domain flow. Implements parent R16; follows flotsync-zop.20.

Instructions
S01. Keep the same domain FSMs and owned partition values; replace the driver adapter so effects run asynchronously and return typed operation/phase-correlated completions through the selective mailbox.
S02. Install state/ownership before launching each effect. Do not hold unrestricted component borrows across await. Use existing Kompact closure access correctly; take owned service handles only where effect lifetime requires ownership.
S03. Route all production API/port/recovery paths through the agreed admission/progress policy, retaining lifecycle gating and current independent advisory semantics as explicitly classified. No new flow may bypass head-only admission accidentally through a legacy handler.
S04. Distinguish cancelled/late external results from impossible internal completions; preserve pending reply/processed obligations. Keep the production admission limit serial to separate execution-mechanism review from interleaving changes.

Acceptance and validation
Prove an active flow consumes its completion behind blocked new requests and completes with a full ordinary mailbox. Test duplicate/wrong-phase/stale completions, cancellation with in-flight effects and existing transaction/listener ordering. No unsafe partition return or committed-write replay.

Review and size
450-700 edited/new LOC including tests. This child removes relevant block_on waits without claiming full concurrency is finished. Follow parent tests/Clippy, duplication and no-staging rules; close after user review.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Replace each of the ten production blocking paths only after state and partition ownership are installed, preserving the four independently spawned security/advisory paths according to their audited semantics. Keep typed phase/operation completion obligations distinct from new requests; completions can be selected behind head-blocked requests using capacity reserved before effect launch. The one-flow admission limit remains for this review unit.

Retain commit-before-listener-before-reply evidence and whole-batch callback-before-next-transaction evidence using DataChangeCompletionGate. Pure effect traces must also preserve distinct publication, creation and membership dispatch order. Lost reply/cancelled future is not rollback, and a committed write must not be replayed on late, duplicate or wrong-phase completion. Effects that can still mutate state keep ownership until cleanup or fault; final shutdown semantics are completed in .23."""
