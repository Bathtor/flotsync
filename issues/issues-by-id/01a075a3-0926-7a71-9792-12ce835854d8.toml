body = "Investigation 2026-10-04: confirmed that netcat_smoke.rs kills and waits for the server, rebinds its hidden reservation, then consumes/drops SpawnedNetcat before sending the client probe. ReservedSocketLease::drop returns the rebound socket to the broker; reclaim_idle/trim_idle_to_waiting closes it only when there is no waiting demand. Under concurrent UDP reservations the socket may instead remain bound or be handed to another test. This refines H02: the important race is broker retention/reuse after lease return, not merely the brief explicit rebind. Keeping the unbound lease owned until the disconnect assertion prevents both idle-pool return and fresh broker allocation of that address (occupied_addrs includes all owned slots). The UDP driver emits Disconnected on ConnectionRefused, and the netcat component exits on Closed. Proposed scope is a test-fixture shutdown helper returning process Output plus the still-owned unbound lease, using existing process-collection logic and ReservedSocketLease RAII restoration. No implementation yet; awaiting plan alignment."
