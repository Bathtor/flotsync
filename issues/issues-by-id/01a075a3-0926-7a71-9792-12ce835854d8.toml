title = "Stabilise UDP disconnect netcat smoke test"
body = """
Goal

Make the macOS UDP connected-client shutdown smoke test reliable under the same default-concurrency workspace load used by CI.

Evidence

E01. On 2026-09-06, the exact macOS CI command cargo test --workspace --locked failed once in two outside-sandbox runs at flotsync_io_examples/tests/netcat_smoke.rs::udp_connect_client_exits_after_server_disappears.
E02. The child remained alive for the full 10-second deadline and logged UDP connected, but never UDP closed (Disconnected).
E03. Five isolated reruns passed, so the failure depends on suite load or timing rather than occurring deterministically.
E04. Five full flotsync_replication package runs with default concurrency passed; the earlier serial replication failure also did not recur under CI-style concurrency.

Likely mechanism to verify

H01. The server fixture releases its broker reservation while the child binds, then kill_and_collect restores the reserved UDP binding before the client sends its probe. That restored socket can receive the datagram silently, preventing the ICMP port-unreachable signal the test expects.
H02. The usual passing outcome may therefore depend on a narrow close/rebind/ICMP timing window.

Proposed direction

P01. Confirm the socket-lease rebind timing and whether the restored socket occupies the former server destination before the client probe.
P02. Keep broker ownership while leaving the server destination genuinely unbound until the client observes disconnection, then restore the reservation during final cleanup.
P03. Preserve process diagnostics and ensure cleanup restores every brokered socket even on panic.
P04. Stress the isolated test and run cargo test --workspace --locked repeatedly with default concurrency outside the sandbox.

Estimate

S01. Approximately 80 to 180 LOC including lifecycle helpers and regression coverage; well below 1000 LOC."""
