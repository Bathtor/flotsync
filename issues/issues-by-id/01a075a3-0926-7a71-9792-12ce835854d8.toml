id = "01a075a3-0926-7a71-9792-12ce835854d8"
ref = "flotsync-ejm"
title = "Stabilise UDP disconnect netcat smoke test"
body = """
Goal

Make the macOS UDP connected-client shutdown smoke test reliable under default-concurrency workspace load.

Evidence and mechanism

E01. On 2026-09-06, cargo test --workspace --locked failed once in two outside-sandbox macOS runs: udp_connect_client_exits_after_server_disappears remained alive for its full 10-second deadline after logging UDP connected, without UDP closed (Disconnected).
E02. Five isolated reruns passed; concurrent load or timing affects the outcome. Five full default-concurrency replication package runs also passed.
E03. Investigation on 2026-10-04 confirms server kill_and_collect rebinds the hidden reservation and consumes/drops the fixture before the client sends its probe. Lease drop returns the rebound socket to the broker, which can retain or reuse it for waiting UDP reservations. Without waiting demand it closes the socket. This refines the original narrow rebind-window hypothesis: broker retention/reuse can keep the supposedly closed destination bound.
E04. Retaining the unbound lease prevents idle-pool return and fresh broker allocation of that owned address. The UDP driver produces Disconnected on ConnectionRefused; the netcat component exits on Closed. The isolated baseline passed today, without reproducing the concurrent failure.

Agreed implementation plan (2026-10-04)

P1. Add a private netcat fixture shutdown method returning process Output and the still-owned unbound ReservedSocketLease. Reuse existing kill/wait/output collection and diagnostics; keep ordinary fixture shutdown behaviour intact. Document the lease lifetime and restoration obligations. Estimate 25-45 LOC.
P2. Change the macOS disconnect smoke test to retain the unbound lease until client exit and all disconnect assertions finish, then explicitly rebind. ReservedSocketLease Drop provides restoration on panic unwinding. Estimate 10-20 LOC.
P3. Add a focused fixture regression proving the stopped server destination is unbound while its lease remains owned, using the same broker-reserved address. Release the probe before restoring the reservation. The existing macOS smoke test verifies actual disconnect and clean client exit. Estimate 35-60 LOC.
P4. Validate with the focused regression and smoke suite, 30 isolated disconnect-test repetitions, and three sequential cargo test --workspace --locked runs with default concurrency outside the sandbox. Check formatting, pedantic Clippy, and duplication in touched files. Record failures and limitations rather than claiming unrelated failures resolved.

Scope and completion

Estimated total 70-125 LOC, below 1000 LOC. Confine implementation to the netcat smoke fixture and tests. Preserve process diagnostics and restore brokered sockets on normal cleanup and panic. No production UDP driver or public broker API change is planned. Keep the issue open until the user agrees the work is complete; hand over as in review after validation. The source link to flotsync-5ou.3 remains relevant."""
