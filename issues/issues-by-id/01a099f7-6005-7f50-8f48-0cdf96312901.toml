title = "Schedule causal updates without retaining payloads"
body = """
Scope (AJ6)
Separate causal scheduling for historical replay and pending application from operation payloads. Use the projected update paging API established by flotsync-h3l.4. Keep causal replay and pending application in this child; leave compatibility-adapter removal to flotsync-h3l.8. Work on the current branch, without switching or creating a branch. Implement as two independently buildable review slices: shared scheduling plus historical replay, then pending application. Estimate 840-1,180 changed Rust LOC (shared metadata/readiness 140-200; replay 220-300; pending application 300-420; focused tests and harness 180-260). If this grows beyond 1,000 LOC, consider splitting those two slices into separate child issues rather than widening one review.

Current paging contract
Use PageCursor<ReplicationUpdatesQuery> and load_replication_updates_into with PageBatch<Input = ReplicationUpdatePageInput, Metadata = ()>. The cursor owns an opaque backend continuation; no Rust ordering key or PageQuery trait is involved. Use one unlimited VecPageBatch when the caller needs every compact dependency for causal planning. The SQLite projected-update reader must stream source rows so that it does not hold every encoded operation payload in memory before projection. Other bounded consumers keep normal continuation handling; exact-size final pages may need an empty confirmation. The SQLite update reader orders bounded pages by its stable composite key but does not request ORDER BY for unlimited pages, whose result order is unspecified. An optional borrowed update-ID set on ReplicationUpdatesQuery selects ready updates without cloning the set; backend implementations choose how to apply that predicate. The borrowed ReplicationUpdateView exposes validated group ID, update ID, read_versions, applied_locally and temporary dataset/operation views. Project one compact owned value per source record, without keeping operation payloads in scheduling collections. Preserve PageError classification when converting to the runtime's contextual store error. The existing load_replication_update(group_id, update_id) provides exact-ID payload lookup in the same read-your-own-writes transaction.

Shared causal scheduling
Define a small internal update-dependency value with UpdateId and VersionVector (and group ID only if a caller needs it). Share the readiness predicate: a producer's version must be the next expected one and its read_versions must be no later than the simulated group position. Keep the two selection policies distinct: pending application chooses the smallest ready UpdateId from its BTreeMap; historical replay preserves its current read-frontier comparator, then UpdateId tie-break. PendingApplyPlan should contain ready IDs, already-applied IDs and compact blocked dependency values, with no full ReplicationUpdateRecord. Preserve blocked-range derivation and stale/already-applied handling.

Historical replay slice
In runtime/replay.rs, load Applied updates into one unlimited compact dependency batch, filter candidates against the historical target vector, and compute the same deterministic causal order. Keep the replay-specific read-frontier comparator as a method on UpdateDependency, without defining a global Ord policy. Report incomplete history if candidates cannot all be scheduled; reject malformed target/frontier metadata with contextual Snafu errors rather than panicking. Fetch each selected payload by exact ID, replay only requested rows, and drop the payload before fetching the next. A one-payload bound is intentional: the existing exact-ID API does one lookup per update, so buffering multiple complete payloads would not reduce store calls. A scheduled ID absent on exact lookup is a store inconsistency, not a snapshot fallback. Update the pure replay tests to exercise the scheduling helper or an appropriate store-backed path; do not keep a parallel production path that takes a Vec of complete updates solely for tests.

Pending application slice
In runtime/component/mod.rs and runtime/in_memory.rs, load PendingApply updates (including the inbound update appended in the same transaction) into one unlimited compact dependency batch; plan already-applied, ready and blocked IDs without keeping payloads. Preserve observed availability and bound missing ranges to the lifecycle final frontier. Before application, make a second bounded projected pass to collect touched datasets and row keys for ready IDs only. Carry a borrowed ready-ID selection in the query. The SQLite backend checks each indexed ID before decoding its payload and pushes only selected updates; it scans past unselected rows so bounded pages and continuation remain correct. Other backends may apply this predicate using their own facilities. Do not add a SQLite SQL IN-list, JSON expansion, or chunking. Do not decode blocked operations. Preload the touched row slices as today, then fetch, validate, apply and drop each ready payload by exact ID. Preserve schema/operation validation, listener event ordering, group-version updates, atomic commit or rollback, and existing contextual errors. Treat a missing or mismatched exact-ID payload as a contextual inconsistency. Avoid accumulating complete payloads across a ready chain.

Validation
Re-use existing replay row-scope, unsorted-input, delivery buffering, restart, duplicate and rollback tests. Use existing focused tests for changed behaviour: shrink the former 66-update page-boundary fixture to three causal updates that verify one unlimited request and causal order, and augment existing tests only where selection-before-decoding or bounded selected continuation otherwise lacks coverage. Do not add new tests or duplicate generic paging coverage. Verify final rows/events, blocked and already-applied state, historical replay, and rollback. Extend the existing failing-store test wrapper narrowly for exact-load failure observation. Do not duplicate generic paging-contract tests. Run focused and serial replication tests, formatting and pedantic Clippy, and inspect touched files for newly duplicated helpers. Keep the issue open and set status_reason to in review for handover; close only after user agreement.

Review refinements (agreed 2026-10-02)
R01: Earlier review exercised the bounded dependency loader at its 64-record boundary. S01 supersedes that limit: the existing store-backed fixture now uses three causally related updates and verifies one unlimited request and the same scheduling policy.
R02: Group projected row keys by dataset, validate each dataset against the schema before decoding operations, and merge row sets per dataset. This avoids per-operation dataset-name clones and repeated lookups, at the cost of one small row-key Vec per dataset entry.
R03: Make exact-load mismatch errors report observed identity, frontier, and applied state where relevant; allocate extra diagnostic values only on the error path and test through existing focused cases where practical.
M01: Extract fallible row-key results before iteration to keep `?` out of the `for` expression.
Estimated review delta: roughly 140-270 Rust LOC (R01 80-140, R02 20-45, R03 35-80, M01 under 5). This keeps the full task estimate near or above 1,000 changed LOC; the replay and pending slices are already implemented, so these are focused review corrections rather than a new broad slice.

Second review refinements (agreed 2026-10-02)
S01: Replace bounded dependency loading and accumulation with one unlimited projected batch. Stream SQLite source rows instead of fetch_all so encoded payloads are not all resident at once. Shrink the obsolete 66-record boundary fixture while retaining its causal-order check.
S02: Carry an optional borrowed ready-ID set in ReplicationUpdatesQuery. In SQLite, check the indexed ID during streamed row decoding before parsing an unselected payload; preserve bounded paging semantics by scanning past unselected rows. Leave SQL IN-list and JSON approaches out of scope. Simplify the runtime projector and preserve missing-ID checks. Backend selection strategy remains implementation-specific. Unlimited update pages have no ordering guarantee.
S03: Leave the replay mismatch branch's fail::<()>().context(...) unchanged at the user's request.
S04: Move the replay-only comparator to UpdateDependency; preserve its read-frontier comparison and ID tie-break without implementing Ord.
Validation remains within existing tests, with augmentation only where new behaviour otherwise lacks coverage. Estimated second-round delta: 170-300 Rust LOC; the cumulative task may exceed 1,000 LOC, so keep the current change reviewable and avoid widening scope.
"""
