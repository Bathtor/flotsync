id = "01a060ae-aac2-7e70-93eb-91d3bf122387"
ref = "flotsync-5ou.1"
title = "Introduce group-scoped read tokens"
body = """
Goal

Make replication progress group-scoped for ordinary application work while retaining one serialisable aggregate position for application startup.

Scope

T01. Introduce GroupReadToken as the opaque position for one visible GroupId. Keep the underlying replication position private to the framework.
T02. Introduce ApplicationReadToken as the serialisable aggregate of per-group positions used at the application startup boundary.
T03. Convert snapshots and publish request/receipt paths from the current cross-group ReadToken to GroupReadToken. Bind listener lineage and its GroupReadToken in a framework-created DataChangeReadPosition.
T04. Keep ApplicationReadToken::apply_data_change as the application-position operation and make it consume DataChangeReadPosition so replacement lineage cannot be paired with the wrong successor token.
T05. Ensure group lifecycle and position events expose enough information for applications to maintain an ApplicationReadToken as groups advance, appear, retire, or are replaced.
T06. Update codecs, public re-exports, test helpers, examples, and affected callers while preserving token validation at the appropriate group boundary.
T07. Remove the per-update construction of an all-writable-groups token.

Review corrections

R01. Document that DataChanged events and their application-position transitions must be consumed in listener delivery order; limit out-of-order safety claims to ordinary compatible group-position merges.
R02. Construct GroupReadToken values only when a listener event will actually be emitted and move them without an unnecessary clone.
R03. Test that replacement preserves unrelated application-token groups and that only framework constructors can produce bound replacement positions.
R04. Split checklist errors for a missing application aggregate and a missing requested group token, retaining the GroupId in the latter.
R05. Restore the repository-preferred private Rust item ordering in the token module.
R06. Keep public token documentation in application-facing position terminology and frame aggregate persistence as optional.
R07. Give GroupReadToken and ApplicationReadToken distinct type-specific format bytes and protobuf payloads: ReadTokenGroup for group tokens and ReadToken for application tokens.
R08. Add ApplicationReadToken::from_group_tokens so applications can rebuild an aggregate from separately persisted group tokens; make the singleton From implementation allocate its sorted map directly.
R09. Add SortedArrayMap removal and apply replacements through one mutable aggregate backing-state access by removing the predecessor directly and merging the successor in place.
R10. Make alternate GroupReadToken debug output exhaustive, express ApplicationReadToken debug formatting with if/else, simplify DataChangeReadPosition documentation, and inline the small text-decoding steps in both token parsers.

Validation

V01. Codec round trips preserve opaque group positions and the aggregate application token while cross-type decoding is rejected, including singleton aggregates.
V02. Snapshots and publish APIs carry only the affected group position; data events carry a bound DataChangeReadPosition.
V03. Aggregate-token tests cover reconstruction, adding, advancing, retiring, replacing, duplicate compatible group positions, and preserving unrelated group positions.
V04. Listener-order documentation and tests cover the replacement-aware application-token path.
V05. SortedArrayMap tests cover removal without disturbing sorted order.
V06. Existing publication and listener behaviour remains unchanged apart from token scope.
V07. Rustfmt, pedantic Clippy, affected crate tests, integration boundaries, Rustdoc, diff checks, and OKF documentation checks pass.

Deferrals

D01. Do not implement startup replay, synchronisation classification, or staged component startup in this task.
D02. Do not reorganise ReplicationRuntimeComponent beyond changes directly required by the token conversion.

Sizing

The original implementation was estimated at 350-550 production LOC plus 250-400 test and call-site LOC. The second review adds approximately 120-190 production LOC plus 80-130 test LOC while replacing some existing helpers. The complete child may finish near 1000 added lines. The only sensible further split is the small SortedArrayMap removal dependency, which remains in this child because it is directly required for the agreed replacement implementation."""
