id = "01a099f7-5ef6-7451-b756-e6f2a0fca0fb"
ref = "flotsync-h3l.2"
title = "Page store metadata collections"
body = """
Scope

Adopt the shared paging protocol for replication groups and progress, member keys and trust evidence, and pending decisions and activations. This child tests the common paging foundation across several metadata shapes before rows and replication updates are converted.

Current foundation

Use PageCursor::begin_page with the object-safe PageBatch contract, PageLimit::Max or Unlimited, batch-owned metadata, and cursor-owned continuation and lifecycle. Page methods return PageError. Paging counts successful source-record pushes independently from retained output count. StoreTransactionId binds a cursor to one transaction.

P201. Public store API

Keep each batch-filling method immediately beside its complete-result convenience. Name batch-filling methods load_*_into. The complete method uses an unlimited identity VecPageBatch, preserves the existing method name and StoreError boundary, and relies on normal type inference in simple cases.

Provide batch-filling methods for selected replication groups, writable group versions, member-key identities, member public keys selected by member or fingerprint, trust evidence for one MemberKeyId, pending decisions, and pending activations. Preserve exact-record methods and missing-ID omission.

Spell concrete PageCursor parameter and continuation types at use sites rather than query-specific cursor aliases. Name filters as predicates: ReplicationGroupPredicate with All and GroupIdIn, and MemberPublicKeyPredicate with MemberEq and FingerprintEq. Predicate values may borrow caller-owned sets or identities.

P202. Page lifecycle and ordering

PageCursor::begin_page returns PageAttempt directly. Supplying an exhausted cursor is a contract error represented by PageError::CursorExhausted; the batch is cleared and the cursor remains exhausted. Remove PageStart, the exhausted-metadata argument, and active-page adapters in tests and backends.

Resolve bounded versus unlimited comparison state once when an attempt begins. Bounded attempts compare against and advance from the current continuation. Unlimited attempts retain the initial lower bound without requiring ordering between records in the same fill. Finishing a full bounded page commits the final accepted key; shorter and unlimited fills exhaust the cursor.

Use GroupId for groups and pending work. Temporarily use a composite member-key continuation whose Rust ordering matches SQLite ordering over serialised member_identity TEXT and key_fingerprint BLOB. TODO(flotsync-o3o) marks this temporary public key for the backend-opaque continuation redesign.

Bounded fills require deterministic ascending backend order, ORDER BY, an exclusive lower bound, and LIMIT. Unlimited fills omit ORDER BY unless the API explicitly promises ordering; after a cursor continuation exists, every returned key must remain above it.

P203. Borrowed predicates

Keep separate call and predicate lifetimes on methods whose cursor stores borrowed predicate data. The predicate lifetime outlives each call lifetime, allowing one cursor to be borrowed mutably for successive page calls. Name both lifetimes explicitly for clarity. SQLite implementations mirror the public trait signatures.

P204. Complete-result conveniences and errors

Default complete-result methods construct borrowing predicates where applicable, use an unlimited identity VecPageBatch, invoke the matching load_*_into method once, and return retained values. Convert PageError to StoreError while preserving enclosed backend StoreError values unchanged.

Trust-evidence loading temporarily collects into VecPageBatch and then populates MemberKeyTrustEvidenceSet. TODO(flotsync-yzq) marks the conversion for the custom-collection follow-up.

P205. SQLite implementation boundary

Implement ReplicationStoreReadTransaction methods in sqlite/mod.rs as the paging boundary: obtain the transaction identity, begin the page, and pass PageAttempt by value to groups.rs, security.rs, or pending_groups.rs. Query-module load_*_into helpers handle backend selection, decoding, pushes, and finish.

Add a private lifetime-aware SQLite alias for dyn PageBatch with OwnedPageBatchInput<T> and unit metadata. Use it to shorten SQLite adapter and query-helper signatures. Keep the expanded PageBatch constraints in the public store API.

P206. SQLite query construction

Use SQLite-local query-builder helpers for the common single-column continuation window and for bounded ordering and limit application with composite continuations. Apply predicates before the window helper. SQL column and ordering fragments remain static backend-owned values. Match ReplicationGroupPredicate once, including empty GroupIdIn. Apply SQL ordering and limits only to bounded fills.

P207. Wrappers and callers

Forward all seven load_*_into methods through FailingStoreTransaction and preserve complete-group fault injection. Existing callers continue through complete-result conveniences. Update public backend contract helpers and all call sites.

P208. Reusable backend contract support

Expose metadata paging scenarios through public test support. Validate fixtures once, then use focused helpers for interleaved continuation, group predicates, writable progress, public-key predicates, trust evidence, pending work, and complete-result equivalence.

Use multiplicity-aware unordered collection equality from flotsync_utils::testing and itertools tuple combinations for structured-versus-text member-order fixture checks.

Cover bounded continuation, exhausted-cursor rejection, empty and exact-size final pages, filters, omitted missing IDs, composite member-key ties, pending-work keys, interleaved reads, rotated batches and limits, unlimited unordered fills, and complete-result equivalence.

P209. Linked follow-up work

flotsync-o3o redesigns continuation state so backend order is opaque and explores a fully backend-owned PageCursor.
flotsync-yzq explores custom collection-backed batches to avoid intermediate Vec allocations.

P210. Validation and delivery

Run rustfmt, focused paging and metadata tests serially, the complete flotsync_replication and flotsync_utils library suites, documentation tests, and all-target pedantic Clippy. Inspect touched files for duplicated helpers. Leave Git index state untouched and do not close the issue without user agreement.

Implementation estimate

The remaining agreed review round is approximately 140-250 changed Rust LOC: 60-100 for lifecycle simplification, 40-80 for the private SQLite batch alias, and 40-70 for tests and documentation."""
