id = "01a039c6-cba7-7f72-a2cb-42106e06c80f"
ref = "flotsync-w1o"
title = "Trigger replication synchronisation when peer routes become available"
body = """
Goal

Automatically start summary-based replication catch-up when a direct route to a peer transitions from unavailable to available. This repairs updates missed while peers were disconnected even when no later update exposes a causal gap and MaintainRS does not manually request a summary.

Current code alignment

C01. SummaryRequestManagerComponent owns outbound summary correlation identifiers, application promises, application request timeouts, and route-triggered summary state.
C02. ReplicationRuntimeComponent independently observes every inbound Summary, compares it with stored local progress, and notifies CatchUpManagerComponent of available and needed ranges.
C03. Summary replies without a pending application request are accepted by SummaryRequestManagerComponent and still complete reliable-delivery processing.
C04. CatchUpManagerComponent already deduplicates needed versions, retries NeedRange broadcasts, and consumes UpdateBatch replies.
C05. SharedGroupMemberships snapshots expose exactly the locally hosted groups and their members.
C06. RouteDiscoveryPort updates are complete replacement snapshots: an empty peer route list withdraws availability, while relay updates are separate.
C07. RouteDiscoveryPort is indication-only. In test builds the production and manual discovery providers may both feed a consumer safely; this topology must not be generalised to request-bearing ports because provider ownership would be ambiguous.
C08. Reliable delivery retains unacknowledged outbound work across route withdrawal and deduplicates submissions only by MessageId.
C09. A diagnostic test confirmed that two otherwise equivalent submissions with different MessageId values are both retained concurrently. Internal timeout continuations must retain their operation identity; reliable delivery owns transport retries.
C10. iddqd::BiHashMap atomically maintains unique semantic-target and operation-UUID indexes over one internal request record.
C11. Kompact recovery replaces rather than restarts a component in place. The current host does not provide general machinery for refreshing escaped component references, actor references, and port ownership.
C12. Summary-manager indexed-state invariant failures are therefore unrecoverable in this task. General replacement recovery is tracked separately by flotsync-sae.
C13. Commit 4c92e7a9d33172f05a6a75d86ca0c4baecbdde4d preserves the removed replacement proof of concept and its tests.

Plan

P01. Keep RouteDiscoveryPort<TransportRouteKey> consumption in SummaryRequestManagerComponent and retain the TrieSet of peers whose latest complete direct-route snapshot is non-empty.
P02. Keep the new TrieSet::remove operation and its focused structural tests.
P03. Make GroupMemberships::groups_with_member a required query and implement it directly against every concrete snapshot storage, avoiding a boxed iterator layered over groups().
P04. Remove the core-only membership test implementation. Test the production RuntimeGroupStateSnapshot directly and retain the route-claim and summary-manager scenarios that exercise the two established test implementations.
P05. On an empty-to-non-empty peer-route transition, take one membership snapshot and directly iterate over locally hosted groups containing that peer. Ignore the local member and relay updates, with explanations for intentional no-op paths.
P06. Keep one iddqd::BiHashMap record indexed uniquely by semantic group/peer target and operation UUID.
P07. Generate one operation UUID for each new summary request and use it as both the wire correlation and wrapped reliable-delivery MessageId. Retain internal work across route withdrawal; after timeout, a later reconnect resubmits the same operation UUID.
P08. Update and explicitly release the mutable indexed-map guard before submission. On indexed-state invariant loss, cancel any newly scheduled timer, return an unrecoverable handler error, and never submit untracked work.
P09. Keep SummaryRequestManagerComponent as an ordinary directly owned topology component and pass its strong actor reference directly to ReplicationRuntimeComponent.
P10. Remove the replacement slot, recovery dependency factory, supervisor callback, recovery-time port reconnection, and recovery-only host controls.
P11. Keep both the production discovery connection and the test/test-support manual connection. Place the indication-only multiple-provider caveat directly above the conditional manual connection.
P12. Keep explanations on every intentional no-op control-flow path.
P13. Preserve the corrected full-topology diagram, component and module documentation, and standing AGENTS.md rules.
P14. Validate internal replies through the correlation index, then remove the matching owned record atomically without eagerly cloning the target.
P15. Keep direct KompactSystem::trigger_i route injection in summary-manager component tests.
P16. Track reusable replacement recovery, route snapshot restoration, lifecycle coordination, and outstanding-promise policy in flotsync-sae, linked to this issue and commit 4c92e7a9d33172f05a6a75d86ca0c4baecbdde4d.

Tests

T01. Existing TrieSet tests cover successful removal, absent removal, and structural cleanup without affecting siblings.
T02. A production RuntimeGroupStateSnapshot test covers groups_with_member filtering; the existing route-claim and summary-manager tests cover the established route and replication test implementations.
T03. Component tests cover initial route availability, filtering to shared hosted groups, non-empty replacement, relay updates, route flapping, completion, and identity-stable timeout retry.
T04. A focused component test proves missing indexed retry state is classified as unrecoverable and does not submit work.
T05. Host tests continue to cover both production and manual discovery-provider connections without replacement machinery.
T06. Keep the runtime reconnection integration test proving automatic repair without a later edit or application summary request.
T07. Run formatting, focused serial tests, affected crate suites with one test thread, the project-specific Rust instruction audit, and pedantic Clippy for affected crates.

Estimate

E01. The replacement proof of concept is preserved in commit 4c92e7a9d33172f05a6a75d86ca0c4baecbdde4d.
E02. The simplification removes approximately 250–400 lines and changes fewer than 50 additional lines.
E03. The remaining task stays within the existing issue; general host recovery is split into flotsync-sae at priority 3.
E04. The unrecoverable simplification is implemented and validated; the result is ready for review."""
