id = "01a039c6-cba7-7f72-a2cb-42106e06c80f"
ref = "flotsync-w1o"
title = "Trigger replication synchronisation when peer routes become available"
body = """
Goal

Automatically start summary-based replication catch-up when a direct route to a peer transitions from unavailable to available. This repairs updates missed while peers were disconnected even when no later update exposes a causal gap and MaintainRS does not manually request a summary.

Current code alignment

C01. SummaryRequestManagerComponent owns outbound summary correlation identifiers, application promises, application request timeouts, and route-triggered summary state.
C02. ReplicationRuntimeComponent independently observes every inbound Summary, compares it with stored local progress, and notifies CatchUpManagerComponent of available and needed ranges.
C03. Summary replies without a pending application request are accepted by SummaryRequestManagerComponent and still complete reliable-delivery processing.
C04. CatchUpManagerComponent already deduplicates needed versions, retries NeedRange broadcasts, and consumes UpdateBatch replies.
C05. SharedGroupMemberships snapshots expose exactly the locally hosted groups and their members.
C06. RouteDiscoveryPort updates are complete replacement snapshots: an empty peer route list withdraws availability, while relay updates are separate.
C07. RouteDiscoveryPort is indication-only. In test builds the production and manual discovery providers may both feed a consumer safely; this topology must not be generalised to request-bearing ports because provider ownership would be ambiguous.
C08. Reliable delivery retains unacknowledged outbound work across route withdrawal and deduplicates submissions only by MessageId.
C09. A diagnostic test confirmed that two otherwise equivalent submissions with different MessageId values are both retained concurrently. Internal timeout continuations must retain their operation identity; reliable delivery owns transport retries.
C10. iddqd::BiHashMap atomically maintains unique semantic-target and operation-UUID indexes over one internal request record.
C11. Kompact marks a component faulty after a recoverable handler error and invokes its configured recovery function. Its default recovery function only ignores the fault; useful recovery therefore requires an explicit production replacement function.
C12. A fresh SummaryRequestManagerComponent reconstructs non-application state from membership and subsequent complete route snapshots. It intentionally does not replay route snapshots that predate recovery; a later route change or reachability refresh restores that view.
C13. Outstanding application promises cannot be transferred and must fail with the faulted instance.

Plan

P01. Keep RouteDiscoveryPort<TransportRouteKey> consumption in SummaryRequestManagerComponent and retain the TrieSet of peers whose latest complete direct-route snapshot is non-empty.
P02. Keep the new TrieSet::remove operation and its focused structural tests.
P03. Make GroupMemberships::groups_with_member a required query and implement it directly against every concrete snapshot storage, avoiding a boxed iterator layered over groups().
P04. Remove the core-only membership test implementation. Test the production RuntimeGroupStateSnapshot directly and retain the route-claim and summary-manager scenarios that exercise the two established test implementations.
P05. On an empty-to-non-empty peer-route transition, take one membership snapshot and directly iterate over locally hosted groups containing that peer. Ignore the local member and relay updates, with explanations for intentional no-op paths.
P06. Keep one iddqd::BiHashMap record indexed uniquely by semantic group/peer target and operation UUID.
P07. Generate one operation UUID for each new summary request and use it as both the wire correlation and wrapped reliable-delivery MessageId. Retain internal work across route withdrawal; after timeout, a later reconnect resubmits the same operation UUID.
P08. Refactor retry lookup into direct success and missing branches. Update and explicitly release the mutable indexed-map guard before submission; on invariant loss, cancel the newly scheduled timer, return a recoverable handler error, and never submit untracked work.
P09. Install a production recovery function for SummaryRequestManagerComponent. On recoverable fault, create a fresh manager with the same stable dependencies and settings, reconnect its reliable-delivery and discovery ports, publish the replacement actor reference to every consumer that addresses the manager, and start the replacement.
P10. Keep application-facing promises and timeout behaviour separate from internal synchronisation state. Document and enforce how outstanding application requests are failed or abandoned when the faulted manager is replaced.
P11. Keep both the production discovery connection and the test/test-support manual connection. Place the indication-only multiple-provider caveat directly above the conditional manual connection.
P12. Replace the syntactically empty final route branch with an end-of-chain else comment explaining that an already-available peer creates no transition.
P13. Preserve the corrected full-topology diagram, component documentation, and standing AGENTS.md rule for comments on intentionally empty control-flow branches.
P14. Validate internal replies through the correlation index, then remove the matching owned record atomically without eagerly cloning the target.
P15. Update topology ownership so recovery can replace the manager without leaving stale actor references or port connections. Keep the recovery factory and rewiring responsibility in the runtime host topology rather than embedding topology knowledge in the component.
P16. Accept eventual route-state restoration after recovery. Do not add immediate snapshot replay to route establishment for this edge case.
P17. Add concise module documentation to every touched Rust module identified by the instruction audit.
P18. Replace the route-discovery test sidecar with a shared required-port reference and KompactSystem::trigger_i; retain the reliable-delivery tester used for request observation.
P19. Keep SummaryRequestManagerInstance private because only the stable slot names it.
P20. Verify that an outstanding application summary request fails as RuntimeUnavailable when recovery drops the faulted manager, then verify a later request succeeds through the replacement.

Tests

T01. Existing TrieSet tests cover successful removal, absent removal, and structural cleanup without affecting siblings.
T02. A production RuntimeGroupStateSnapshot test covers groups_with_member filtering; the existing route-claim and summary-manager tests cover the established route and replication test implementations.
T03. Component tests continue to cover initial route availability, filtering to shared hosted groups, non-empty replacement, relay updates, route flapping, completion, and identity-stable timeout retry.
T04. The supervision test triggers the exact invariant failure through normal component dispatch, verifies the original becomes faulty, waits for the configured replacement to become active, and proves the replacement handles later work.
T05. Topology-level coverage proves the replacement manager is connected to both production and test discovery inputs where applicable, to reliable delivery, and to actor consumers through the refreshed reference.
T06. Keep the runtime reconnection integration test proving automatic repair without a later edit or application summary request.
T07. Recovery coverage proves an outstanding application request fails with RuntimeUnavailable and a subsequent request succeeds.
T08. Run formatting, focused serial tests, affected crate suites with one test thread, the project-specific Rust instruction audit, and pedantic Clippy for affected crates.

Estimate

E01. The complete worktree is approximately 1500 changed lines across the original task and four review rounds.
E02. The accepted round-four follow-up is approximately 80–140 changed lines.
E03. The complete task exceeds 1000 changed lines, but recovery remains local to RuntimeLogicTopology, the stable summary-manager slot, and focused test support; no generic recovery infrastructure or child issue is needed.
E04. Implementation and validation are complete; the task is ready for review."""
