id = "01a060af-0325-7591-9353-b025a5a27b68"
ref = "flotsync-5ou.2"
title = "Replay full state during startup"
body = """
Goal

Replace the live snapshot_rows API with staged startup loading: return a live runtime immediately when there is no readable application state, otherwise expose one coherent per-group snapshot replay and start live listener delivery only after application acknowledgement.

Public contract

P01. Both public load entry points accept Option<ApplicationReadToken> and return ReplicationRuntimeLoad::Ready or ReplicationRuntimeLoad::Synchronising.
P02. This child accepts but does not classify the supplied application token. No readable groups returns Ready; any readable group returns Synchronising with snapshot replay. Exact-token and incremental selection remain deferred.
P03. ApplicationSynchronisation exposes an iterator-shaped next_group API which yields sequential SingleGroupSynchronisation values instead of sections, slices, or group indices.
P04. Each SingleGroupSynchronisation exposes its GroupId, resulting GroupReadToken, and a row provider restricted to that group. Snapshot batches remain bounded, never cross dataset boundaries, and contain visible full snapshot rows only.
P05. Restore SnapshotRow, SnapshotRowBatch, and apply_snapshot_rows terminology. Remove batch-level section/group indices and the speculative Full batch enum variant.
P06. Keep the final aggregate ApplicationReadToken available as an optional convenience. Applications may instead persist each GroupReadToken after ingesting that group; both persistence layouts are valid.
P07. ReplicationConfig exposes application_synchronisation_batch_size with a non-zero default of 128 rows.
P08. ApplicationSynchronisation::complete consumes a fully drained replay, installs the retained listener, starts runtime logic, and returns the normal ReplicationApi. Explicit shutdown aborts cleanly.

Preparation and lifecycle

L01. Before creating the Kompact system, open one store read transaction, load and validate groups, resolve schemas, populate SharedGroupState, derive deterministically ordered readable-group synchronisations and their GroupReadTokens, and build the optional aggregate ApplicationReadToken.
L02. Retain that same read transaction throughout snapshot delivery so rows and target tokens describe one store cut without opening one transaction per group.
L03. Represent preparation as an explicit Ready or Synchronising state so the latter owns its replay state and provider without correlated Option fields or assertions.
L04. Internally use one preallocated collection, sized from the loaded group count, whose entries combine application-visible group metadata with dataset scan state. Do not maintain parallel section, token, and scan collections.
L05. Build and connect the ordinary topology with a non-optional placeholder listener and the preloaded SharedGroupState.
L06. Start IO, transport, delivery, and discovery while catch-up, summary management, and ReplicationRuntimeComponent remain inactive.
L07. Completion replaces the listener through on_definition while the runtime component is inactive, then starts catch-up, summary management, and ReplicationRuntimeComponent in that order with lifecycle notification.
L08. ReplicationRuntimeComponent::on_start no longer hydrates group state. It replays pending decisions and resumes accepted activations after listener replacement; queued live work is handled only after on_start completes.
L09. The inactive runtime component mailbox remains the only live-work buffer. Add no gateway, manual update buffer, or token-based listener filtering.

Provider and cleanup state

F01. The startup provider distinguishes streaming, successfully exhausted, explicitly aborted/released, and terminally failed lifecycle outcomes as needed; transaction release alone must not imply exhaustion.
F02. Classify failures at the scope available inside the retained transaction. Terminal store, decode, copy, cursor, or release failures transition to a sticky Failed state. Non-terminal failures which can safely be retried within the existing transaction preserve the transaction and cursor so the current operation can be retried.
F03. Reword ProviderFailed to describe use after an earlier terminal provider error rather than implying every operation failure poisons the provider.
F04. Natural exhaustion is established only after every group and dataset scan is consumed and the retained transaction is released successfully.
F05. Explicit abort releases the retained transaction without pretending the replay was consumed.
F06. Completion requires natural exhaustion. Premature completion, listener installation failure, or component-start failure shuts down the partly started host and requires a fresh load because incomplete application state cannot safely receive unconditional incremental updates.
F07. ApplicationSynchronisation::shutdown explicitly releases the retained transaction before orderly host shutdown so release failures remain observable.
F08. Cleanup attempts all applicable steps. The first operational cleanup failure is returned and secondary failures are logged; premature completion continues to return SynchronisationIncomplete while logging cleanup failures.
F09. Dropping an unfinished synchronisation uses best-effort asynchronous host shutdown and logs accurate guidance for the synchronisation lifecycle.
F10. Use one clearly named owning cleanup operation unless separate borrowed and owning operations have genuinely distinct, documented semantics. Use batch consistently rather than page for the same bounded store result.
F11. If compatibility draining or application snapshot ingestion fails, explicitly await staged synchronisation shutdown before returning the primary error; log any secondary cleanup failure.

Staged host boundary

H01. Move placeholder construction onto StartupEventPolicy::create_listener and pass the created listener into host preparation rather than passing the policy through the host boundary.
H02. Always debug-log the complete unexpected ReplicationEvent before applying logging-only or panic behaviour.
H03. Document the unenforced precondition that listener replacement occurs only while ReplicationRuntimeComponent is inactive.
H04. Remove the test-only host preparation error variant; tests should exercise the same host-startup error shape as production.
H05. Keep application-state preparation out of immediate-start host test helpers so those helpers retain their original concern.
H06. Rename the unit-test query to ReadGroupToken, restrict it to unit-test compilation, and handle it with spawn_local rather than blocking the component.
H07. Feature-level test support reads group tokens through its backing store rather than exposing the unit-test message.
H08. Observe staged inbound delivery through a forwarding PortTesterComponent<GroupBroadcastPort> rather than a test-only counter on GroupBroadcastComponent.
H09. The production placeholder policy remains logging-only; strict lifecycle tests use panic-on-event.

Runtime-load simplification

U01. Replace duplicated public and typed load enums with one generic ready/synchronising enum plus public trait-object and crate-internal concrete aliases.
U02. Move compatibility replay draining onto ApplicationSynchronisation and reuse that single helper from typed test loaders and public test support.
U03. Destructure PendingReplicationRuntime ownership so application_id, listener, host, and config can move independently without eager clones.
U04. Match or transform the original activation result directly while still attempting host shutdown after activation failure.
U05. Keep public documentation entirely in application terms and avoid exposing actor-framework implementation details.
U06. Defer all loader argument-struct work to the P0 follow-up flotsync-4e8, covering public, typed, security-ready, and test-only loader layers.

Snapshot removal and callers

R01. Remove ReplicationApi::snapshot_rows, ReplicationRuntimeMessage::SnapshotRows, SnapshotRowsRequest, SnapshotValueRows, the component handler, and SnapshotRowsError.
R02. Refactor the efficient store snapshot provider into the startup synchronisation provider outside ReplicationRuntimeComponent.
R03. Convert the replicated checklist to construct its working set from startup snapshot rows, persist either each completed GroupReadToken or the optional final aggregate token, complete startup, and only then enter the REPL.
R04. Replace the checklist runner setup tuple with a named struct.
R05. Convert generic runtime test loaders to use the shared drain-and-complete helper where startup behaviour is not under test.
R06. Replace post-start snapshot assertions with startup-replay tests or narrow store-level inspection helpers. Persistence tests reload into a fresh working set rather than inspect already-mutated in-memory state.
R07. Consolidate compile-time Send assertions into one type-only helper.

Test structure

T01. Add a concise title-upsert helper for repeated RowMutation construction.
T02. Check each batch dataset while already iterating over its rows, failing on the first mismatched dataset instead of making a separate pass.
T03. Add a focused single-member readable group-record fixture or builder with sensible module-local defaults.
T04. Add a staged-startup test fixture for repeated member, store, security, socket, listener, schema, and config setup while keeping the two-peer networking scenario explicit enough to read.
T05. Keep individual tests focused on their lifecycle or data assertion rather than environment construction.
T06. Failure-injection wrappers for read transactions must retain the store's actual read-only transaction semantics rather than substituting a write transaction.

Correctness boundary

C01. The application applies each group snapshot and records the corresponding GroupReadToken before advancing; it may atomically record the optional final ApplicationReadToken after the complete replay.
C02. Snapshot groups do not imply removals for locally retained rows missing from the snapshot and emit no partial field upserts.
C03. The sole component that applies semantic replication updates remains inactive throughout the retained store cut.
C04. Starting ReplicationRuntimeComponent is the single transition to unconditional listener delivery.
C05. External concurrent writes to the replication store remain unsupported; no redundant pre-start verification reload is added.
C06. Use “applied group snapshot” for a complete snapshot of one group and “partial application snapshot” only for selected rows spanning selected groups.

Validation

V01. Cover Ready for no readable state and snapshot replay for one or multiple readable groups, including empty groups.
V02. Cover deterministic group ordering, genuinely bounded multi-row batches, dataset boundaries, visible snapshot semantics, tombstone omission, per-group target tokens, and the optional aggregate token.
V03. Cover listener substitution and placeholder policies. A real two-peer delivery test sends work while the target synchronises, observes no callback before completion, and observes exactly-once delivery afterward under the panic placeholder policy.
V04. Cover natural exhaustion, explicit abort, premature completion, drop, retryable in-transaction failures, terminal provider failures, transaction-release failure, completion after failure, component-start failure with its exact error, and a fresh retry completed into a live runtime.
V05. Cover checklist publication by shutting down and rebuilding application state through staged startup, including multiple groups and both viable token-persistence approaches where practical.
V06. Add compile-time Send coverage for the staged load result and synchronisation handle.
V07. Confirm no live snapshot_rows API or caller remains.
V08. Run focused lifecycle and provider tests, the complete replication and example suites, pedantic Clippy, Rustfmt, Rustdoc, diff hygiene, OKF documentation checks, and the repository Rust instruction audit.
V09. Retryable scan coverage must fail after a successful bounded batch and prove that retrying in the same transaction reuses the unchanged cursor and emits every remaining row exactly once.

Code quality

Q01. Keep public documentation focused on current behaviour; rely on non-exhaustive public types rather than speculative future-design prose.
Q02. Follow repository visibility and item ordering, comment intentionally empty control flow, and remove stale or misleading helper naming and unused parameters.
Q03. Keep failure-injection terminology general enough for startup reads rather than activation-specific when the same control serves both paths.
Q04. Prefer named types and helpers where they remove setup noise or clarify ownership, but avoid abstractions which hide the scenario under test.
Q05. Do not retain a transaction after a terminal provider error solely to observe a possible later release error; dropping it is an accepted cleanup trade-off.

Deferrals

D01. Do not classify supplied tokens, return exact-token Ready for non-empty state, emit incremental synchronisations, coalesce update history, or select per-group fallback. flotsync-5ou.3 owns those optimisations.
D02. Do not reorganise the general runtime FSM or decompose ReplicationRuntimeComponent beyond moving startup hydration and snapshot responsibilities required here. flotsync-zop owns that work.
D03. Do not add direct Kompact-only application APIs.
D04. Do not perform the loader argument-struct refactor here. The linked P0 follow-up flotsync-4e8 owns that cross-cutting work and is blocked by this task.

Execution and sizing

E01. Implement this plan within flotsync-5ou.2 in three internal stages: synchronisation/provider, staged host/runtime boundary, then callers/tests/examples. Do not split it into separate tasks or add user checkpoints between individual comments.
E02. Work through the review checklist item by item and keep its status current so every supplied comment has an explicit disposition before returning to review.
E03. Expected repair churn is approximately 1,000-1,500 lines. Removing the section/index machinery and duplicated compatibility paths should keep net growth lower, but the task is likely to exceed 1,000 touched lines.
E04. The user resumed implementation; return the accepted review repairs for review only after focused regression coverage and the complete validation set pass.

Fourth review repairs
G01. Validate each loaded group record before merging its read token or appending its snapshot scan. Duplicate readable records with incompatible member counts must return the structured duplicate-group startup error rather than panic. Add focused regression coverage.
G02. Mark the new public ReplicationRuntimeLoad enum non-exhaustive and update downstream external matches with an explicit unsupported-state fallback.
G03. Replace the five-element checklist test-loader tuple with a named fixture and convert its callers to named-field destructuring or access.
G04. Describe SynchronisationIncomplete in terms of exhausting every prepared group snapshot, including empty groups, rather than consuming row batches.
G05. Preserve all previously agreed lifecycle, retry, cleanup, snapshot, listener, and token-persistence behaviour. Keep loader argument structs deferred to flotsync-4e8.
G06. Expected repair churn is approximately 60-100 lines, below the 1,000-line split threshold.
G07. Re-run focused startup and malformed-store coverage, the replication and checklist suites, pedantic Clippy, Rustfmt, Rustdoc, diff hygiene, and the repository Rust instruction audit before returning to review.

Fifth review repairs
J01. Rely on each restricted topology struct's visibility as the effective cap and use plain pub only for fields which genuinely need cross-module access; keep all other fields private.
J02. Replace the always-present unit-test delivery proxy with one wholly cfg(test) RuntimeHostTestSupport structure. It owns the existing route-publication mode and the optional group-broadcast/runtime proxy, materialises requested test components after the Kompact system exists, derives observation handles on demand, and provides the single extension point for future host instrumentation.
J03. Keep RuntimeHostTestSupport separate from production preparation inputs, RuntimeTopologyBuildInput, DeliveryTopology, and other production payloads. Ordinary preparation wrappers supply its direct/default form internally, while one narrowly named test-only loader opts into the proxy for the staged-startup scenario.
J04. Use cfg_select! once at the connection boundary to express direct production wiring and test direct-or-proxied wiring. Only opted-in tests start and traverse the proxy; ordinary tests retain production-equivalent topology.
J05. Centralise the repeated failure-control mutex acquisition in one documented helper shared by the failing store and delegated transaction wrappers.
J06. Document that ApplicationSynchronisation::next_group returning None means no further group can be claimed, while successful completion still requires natural exhaustion; an incompletely dropped claimed group also yields None but leaves completion ineligible.
J07. Add the local UnitResult<E> alias for unit-valued error conversion and explain any ownership-driven destructuring retained in PendingReplicationRuntime::start.
J08. Use value-free assert_send<T: Send + ?Sized>() and assert_sync<T: Sync + ?Sized>() for named owned and trait-object types. Use a separately named and documented assert_inferred_send(&value) only for opaque return types which cannot be named and require value-based inference.
J09. Retain ChecklistRuntimeFixture values and access their fields directly instead of destructuring stores into deliberately unused bindings.
J10. Expected fifth-review repair churn is approximately 155-270 lines, below the 1,000-line split threshold. Re-run focused runtime-host and checklist tests, workspace all-target/all-feature pedantic Clippy, Rustfmt, Rustdoc, diff hygiene, and the Rust instruction audit before returning to review.

Sixth review repairs

K01. Keep RuntimeHostTestSupport and the reserved local-endpoint lease as separate fields. Move conditional host fields to the end of DeliveryRuntimeHost and conditional constructor arguments to the end of DeliveryRuntimeHost::new, without adding another support or request type.
K02. Extend the deferred P0 follow-up flotsync-4e8 to cover prepare_with_runtime_config_toml, prepare_with_test_support, prepare_with_options, and DeliveryRuntimeHost construction, including removal of the associated too-many-arguments allowances.
K03. Replace the free failure-control lock helper with short associated lock_control functions on FailingStore and FailingStoreTransaction. Use Self::lock_control with either the instance field or a moved control mutex and introduce no wrapper abstraction.
K04. Preserve all existing host behaviour and failure-injection semantics; this pass is ordering and test-helper cleanup only.
K05. Expected sixth-review repair churn is approximately 35-70 lines, below the 1,000-line split threshold. Re-run focused runtime-host and replication tests, the example suite, workspace all-target/all-feature pedantic Clippy, Rustfmt, Rustdoc, diff hygiene, and the Rust instruction audit before returning to review."""
