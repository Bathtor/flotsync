title = "Enforce flow-owned group projection publication"
body = """
Goal
Enforce whole-map projection ownership across its database/publication consistency interval. Projection half of parent R19; follows flotsync-zop.16.

Instructions
S01. Create/restrict the ProjectionWriter capability so all runtime group projection mutations go through its owning flow. Projection fields are group id, name, members, schema and lifecycle; no rows or version-vector progress.
S02. Take ownership before the database read used to construct the replacement map and retain it through commit and ArcSwap publication. Represent database-committed/projection-pending state privately; return the writer only after consistency is restored.
S03. Cover every caller: creation, acceptance, activation, replay metadata refresh and recovery. Audit other group-metadata writers and delivery/security consumers of old published snapshots. Explicitly distinguish acceptable old immutable views from operations requiring current consistency.
S04. Preserve whole-map replacement and atomic predecessor/successor visibility. Do not introduce affected-group deltas or a new mirrored mutable group database; finer writer concurrency is not needed for this task.

Acceptance and validation
Prove that a second projection writer cannot build/publish during the first owner's interval, including delayed commit completion. Show unrelated work remains ownership-compatible. Inject post-commit publication failure paths and verify repair/fault retains ownership correctly. Existing immutable/coherent view tests remain valid.

Review and size
200-400 edited/new LOC including tests. Follow parent Rust validation, touched-file duplication and no-staging rules. Close only after review.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

RuntimeGroupStateSnapshot publishes group id, name, members, resolved schema and lifecycle, with no rows or version vectors. Preserve whole-map replacement. The writer must be acquired before the snapshot-building database read and held through commit/replace, including creation, acceptance, activation and recovery/replay refresh. Private DatabaseCommittedButProjectionPending belongs to the owning flow; it is not a second mutable database mirror.

The existing coherent Arc can remain visible while stale, but each delivery/security/host consumer must be audited for whether that is acceptable. Operations requiring current consistency cannot bypass the owner by cloning a writer/service handle. Test writer exclusion across a delayed completion and repair/fault without unsafe ownership return. Unrelated work may overlap if it needs neither that writer nor affected records; per-group projection deltas remain deferred."""
