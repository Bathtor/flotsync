title = "Reassess temporary local public key bundle provisioning API"
body = """
Reassess load_local_public_key_bundle after flotsync-git-d03 removes the replicated-checklist dependency on the temporary fixed static-group setup bridge.

Current understanding:
C01. The helper itself is already group-independent: it loads encrypted local private-key material and derives the shareable public bundle from the replication store.
C02. Pre-runtime keys init-local and keys export-local still require this capability.
C03. The current static-group coupling lives in replicated-checklist config parsing, runner startup, and the init-local/trust side effects rather than in the helper signature or implementation.
C04. Moving the helper into the example would require exposing or duplicating lower-level encrypted-store handling, so reassessment should preserve that encapsulation.

Scope:
S01. Review the helper against the decoupled checklist setup produced by flotsync-git-d03.
S02. Decide whether it should remain a replication provisioning API, move behind a narrower replication-owned setup/key-management boundary, or disappear only if the decoupled flow provides a real replacement.
S03. Update its API placement, naming, documentation, exports, and focused tests as required by that decision.
S04. Remove stale fixed-static-group wording and references from the surviving boundary.

Acceptance:
A01. The decision reflects the post-d03 callers rather than the temporary static-group bridge.
A02. Local public-bundle initialisation/export remains possible without exposing encrypted store internals to the example.
A03. The resulting API and documentation describe the actual ownership and stability of the capability."""
