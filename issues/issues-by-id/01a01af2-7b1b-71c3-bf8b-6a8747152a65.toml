id = "01a01af2-7b1b-71c3-bf8b-6a8747152a65"
ref = "flotsync-j6x"
title = "Add paired row scans and provenance"
body = """
Provide the storage foundation for comparing rows from a previous and successor replication group without moving application-facing reconciliation semantics into ReplicationStore implementations.

Parent context:
C01. Parent task flotsync-9fs keeps RowId group-scoped and defines row correspondence within one explicit group replacement.
C02. Storage owns efficient retrieval and alignment of stored row records; replication owns visibility, correspondence, field equality, cut evidence, and listener API semantics.
C03. This child lands before runtime/listener child flotsync-v76 consumes row transitions and creator provenance.

Agreed storage model:
A01. A transition scan compares the same DatasetId reference in the previous and current groups. Dataset renames do not preserve row correspondence.
A02. The request accepts previous/current GroupDatasetSchemaRef values and rejects unequal dataset references before performing store work.
A03. Each emitted DatasetRowStateTransition has one RowKey and independently optional stored previous/current ReplicationRowStateRecord values, including tombstones.
A04. Every transition has at least one stored side, and every present record has row_id equal to the enclosing row_key.
A05. Transitions are ordered by ascending RowKey across keys present in either group occurrence.
A06. DatasetRowStateTransitionBatch carries one DatasetId, both group IDs, both dataset-existence flags, rows, and exclusive-after continuation.
A07. The previous/current fields derive their meaning from the enclosing batch's previous/current group references.
A08. Storage returns stored records only; application-facing row changes, field differences, and migration-cut classifications remain replication concerns.

Public API implementation:
B01. Expose DatasetRowStateBatch::transition_with_limit as the reusable public default alignment operation.
B02. Rename the row value, result batch, scan method, helper methods, tests, and documentation consistently around directional transition terminology while retaining previous/current fields.
B03. The default trait implementation performs two ordinary scans and an in-memory alignment. Document this cost and encourage efficient stores to override it.
B04. The alignment assigns iterator next values directly into optional transition fields, asserts the row invariant, uses option_when for continuation, and keeps complex test projections in named locals.
B05. Document that records consumed beyond the last emitted key are omitted from the returned result and may be fetched again when the source scans resume after next_after.
B06. Reusable output buffers remain deferred to P3 task flotsync-duu so ordinary and transition scans can adopt one consistent contract.

Agreed provenance:
P01. ReplicationRowStateRecord carries created_by: Option<UpdateId>.
P02. DatasetRowStatePatch carries the exact applying change_id.
P03. Store Some(change_id) when an active row key is first introduced, None when a tombstone is first observed without a stored row, and preserve known provenance across later changes.
P04. Initial active snapshot rows use Some(INITIAL_STATE_ORIGIN).
P05. Validate stored creator member indices against group membership and report creator-specific structured corruption errors with row context.
P06. SQLite stores the creator member index and scalar creator version as INTEGER values. A generic SQLite-local newtype losslessly reinterprets u64 bits as i64 and back; upper-half values therefore appear negative in SQLite.
P07. Sortable version BLOBs remain only where unsigned range ordering is required.

SQLite transition scan:
S01. Override the default with a CTE that selects the limited combined RowKey page before joining previous/current row records.
S02. Apply the exclusive after bound in both key-select arms so non-initial pages remain indexed range scans.
S03. SQLx QueryBuilder remains a textual builder because it has no typed query AST or composable bound-query union.
S04. Keep complete static SQL statements visibly formatted as multi-line literals. Generate individually assembled QueryBuilder fragments without unnecessary formatting whitespace, and use format_args! for qualified projections without allocating temporary strings.
S05. Keep the authoritative projection-column array, previous/current ordinal layouts, and ordinal accessors together on one layout type.
S06. Keep bounded fetch_all materialisation in this slice with a TODO(flotsync-duu) source comment; reconsider streaming together with reusable decoded output.
S07. Load dataset-presence flags in one focused query and both group member counts in a second focused query.
S08. Document that a nullable joined snapshot means the corresponding left-join side had no stored row.
S09. Add an adjacent SQLite DDL comment documenting the unsigned creator bits stored in signed INTEGER form.

Validation:
V01. Contract tests cover both-present, previous-only, current-only, tombstones, empty/missing datasets, ordering, pagination, and exact-limit continuation.
V02. Tests cover one shared DatasetId with differing previous/current schemas and reject mismatched dataset references.
V03. SQLite tests cover known and unknown creator provenance, preservation across changes, incomplete provenance, invalid creator indices, and creator integer round trips across the i64 sign boundary.
V04. Tests use typed error variants and fields rather than rendered messages.
V05. Do not add allocation thresholds or SQLite query-plan assertions to unit tests.
V06. Run formatting, focused tests, the broader single-threaded replication suite, diff checks, and pedantic Clippy.

Explicit exclusions:
X01. Do not add listener lineage types or RowChange production in this child.
X02. Do not compare materialised field values in storage.
X03. Do not replay old-group update logs to infer missing history.
X04. Do not implement schema-added/defaulted/removed field handling.
X05. Do not implement reusable storage output buffers here; follow-up flotsync-duu owns that work.
X06. Do not add query-plan performance tests.

Estimate:
E01. Public API renaming, validation, and documentation: 100-170 touched LOC.
E02. SQLite query/layout and integer representation cleanup: 100-180 touched LOC.
E03. Call-site and test updates: 80-140 touched LOC.
E04. Expected third-review revision is 280-490 touched LOC; the complete child remains below 1,000 touched LOC."""
