id = "019f6edb-fadb-7fc2-a851-d7d919537b1a"
ref = "flotsync-nk9"
title = "Rethink replication snapshot batching and storage row batch API"
body = """
The replication snapshot scan currently returns one owned named RowStateSnapshot per row. That repeats schema field names, allocates per-row structures, and makes projection into SnapshotValueRowBatch either quadratic in the field count or dependent on more per-row indexing.

Agreed design:
- Keep Schema position-independent and preserve its unordered equality semantics.
- Add a reusable immutable projected-key map: contiguous values plus hashbrown::HashTable<usize>, with keys borrowed through a projection and indexed using a cheap trusted-data hasher.
- Build an opaque OrderedSchema on that collection. It chooses the source Schema hashmap iteration order; callers cannot select or sort the order.
- OrderedSchema uses one whole-schema borrowed/owned enum rather than Cow per field. Borrowed construction indexes references to the original fields and metadata; owned construction stores them directly.
- OrderedSchema equality is intentionally contextual: OrderedSchema-to-OrderedSchema PartialEq is positional, OrderedSchema-to-Schema is unordered, and eq_unordered explicitly compares two ordered schemas without considering position.
- Add a schema-bound row-major state batch that owns its OrderedSchema wrapper, stores row metadata separately, and stores field states flat without names.
- Decode rows append-first with rollback on failure. reset_rows retains allocation under one layout; reuse_for_schema clears rows and changes the wrapper only when positional equality says the batch layout differs.
- Adapt replication storage and snapshot consumers to the batch without coupling SQLite directly to SnapshotValueRowBatch.

Child split:
- flotsync-nk9.1 implements ProjectedHashMap and OrderedSchema, including ownership and comparison semantics.
- flotsync-nk9.2 implements InMemoryStateRowBatch and integrates it through the replication store and snapshot consumers. It is blocked by flotsync-nk9.1.

Efficiency and complexity:
- Field names and Field allocations remain authoritative in Schema for the common borrowed path.
- OrderedSchema pays one O(fields) index build and O(fields) index storage per reusable layout.
- Each decoded row stores only metadata and field states, reducing name storage from O(rows * fields) to O(fields) references/index entries and making field lookup expected O(1).
- Positional equality prevents accidental reuse across different batch layouts, while explicit unordered comparison preserves data-model semantics where position is irrelevant.

Estimated size:
- flotsync-nk9.1: approximately 500-750 LOC including tests.
- flotsync-nk9.2: approximately 770-1,100 LOC including integration tests; split transition adaptation further if this estimate grows materially.
- Combined: approximately 1,270-1,850 LOC, which is why the work is divided into independently reviewable children.

Validation is specified independently in each child issue. The parent remains open until both children are accepted."""
