id = "01a1bb81-ade5-7962-8959-67d39ab70290"
ref = "flotsync-8hv"
title = "Make Flotsync core identities usable without runtime dependencies"
body = """
MaintainRS needs `flotsync_core::GroupId` to implement `From<GroupId>` for its shared `Scope` type. Core currently gets async-std and Kompact through its unconditional Utils dependency. Consumers of the shared identity types need a feature set that keeps both dependencies out of their build.

1. Keep the entire Core API available without runtime dependencies. Give Utils empty defaults and have Core request it with `default-features = false`. Keep the existing `GroupId` definition and import path.
2. Add two opt-in Utils features. `async-timeouts` enables async-std for `FutureTimeoutExt` and `TimeoutError`. `kompact-runtime` enables Kompact and futures-util for claimable promises, the Kompact helper modules, and handler-error extensions. Keep `OptionExt::when` available with defaults disabled and preserve enabled items at their existing import paths.
3. Request the features at their users. IO, Routes, and UDPour need `kompact-runtime`. Replication needs both. Discovery forwards `kompact-runtime` to Utils through `peer-announcement-via-kompact`, which the zeroconf actor feature also enables.
4. Add `scripts/check-core-runtime-deps.nu` and run it in the Linux PR tests with Nushell 0.117.0. Inspect the locked Core dependency tree with defaults disabled across all targets and include normal and build dependencies. Fail if async-std or Kompact appears or Cargo fails, and check that Core compiles with defaults disabled. Check runtime consumers individually for correct feature declarations and run existing runtime tests.

Discovered during MaintainRS maintain-rs-m5t.9.2. Once the minimal build is available, use it in `maintain_rs_shared` and replace the app’s `scope_for_group` helper with `From<GroupId> for Scope` in MaintainRS."""
