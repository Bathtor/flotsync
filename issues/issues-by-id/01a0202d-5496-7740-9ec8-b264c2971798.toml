title = "Add checklist group replacement reconciliation"
body = """
Teach the replicated checklist application to use group-replacement lineage for explicit dirty-state reconciliation after the core listener API and runtime behaviour land.

Context:
C01. flotsync-v76 introduces atomic GroupReplacement DataChanged events, parent PreviousRow metadata, canonical field differences, and conservative cut evidence.
C02. The checklist currently rejects listener changes which overlap dirty local rows; a group replacement instead requires reconciling an entire old application view with the successor view before merging the event ReadToken.
C03. Mechanical API conformance remains in flotsync-v76. This task owns meaningful application policy and user-visible behaviour.

Implementation:
I01. Define checklist-specific reconciliation state for clean, dirty, unresolved, introduced, removed, identical, and divergent rows.
I02. Consume each GroupReplacement provider completely and stage one atomic application-view transition before merging its ReadToken.
I03. Remap clean corresponding rows automatically when safe.
I04. Preserve dirty edits when they can be reapplied to the successor, using previous-row correspondence, canonical field differences, and cut evidence.
I05. Represent ambiguous or conflicting dirty rows explicitly instead of silently discarding local work or choosing a framework-wide merge policy.
I06. Handle old-only deletes, successor-only upserts, unavailable predecessors for newly added members, identical rows, divergent rows, and repeated group replacements.
I07. Extend REPL or runner presentation as needed so unresolved reconciliation is visible and can be resolved deliberately.

Validation and documentation:
V01. Add focused checklist tests for clean remapping, dirty reapplication, conflicting divergence, introduced rows, removed rows, unavailable predecessors, and repeated replacements.
V02. Update the replicated-checklist scenario and user-facing documentation with the concrete application policy.
V03. Keep the policy example-specific; do not move automatic conflict resolution into the replication framework.

Dependencies and exclusions:
X01. This task is blocked by flotsync-v76 and consumes its final public API.
X02. Schema-added/defaulted/removed reconciliation remains outside this task unless separately aligned.
X03. Stable group-lineage identity remains deferred to flotsync-2js.

Estimate:
E01. Reconciliation model and application state changes: 180-320 LOC.
E02. Listener/REPL integration: 140-260 LOC.
E03. Tests and scenario documentation: 220-380 LOC.
E04. Expected total: 540-960 LOC."""
