id = "01a01af2-8bbe-70f3-bea5-684f2e1c723e"
ref = "flotsync-v76"
title = "Emit group replacement row lineage"
body = """
Expose group-replacement lineage to listeners and implement the streaming replication-layer comparison using the transition scan and provenance foundation from flotsync-j6x.

Parent context:
C01. Parent task flotsync-9fs keeps RowId group-scoped while relating matching DatasetId and RowKey occurrences within one explicit group replacement.
C02. Applications own reconciliation of dirty state; Flotsync reports conservative correspondence, divergence, and cut evidence without choosing a merge.
C03. This child consumes the raw row-transition scan and created_by provenance supplied by the completed storage child.
C04. Substantive replicated-checklist dirty-state reconciliation remains separated into follow-up child flotsync-fk0; this child makes only minimal API-conformance changes to that example.

Agreed listener API:
A01. Keep ReplicationEvent::DataChanged and add DataChangeLineage distinguishing Update changes within a group from GroupReplacement { migration_id }.
A02. RowChange contains PreviousRow metadata and a RowChangeKind Upsert or Delete action.
A03. PreviousRow distinguishes NotCompared updates, a Present visible predecessor, an Absent predecessor with not-stored or tombstone evidence, and Unavailable predecessor state.
A04. NotStored means Flotsync inspected the locally hosted old group and found no stored occurrence for the corresponding key. Unavailable means the old group could not be inspected, so past existence is unknown.
A05. Corresponding visible rows emit one successor Upsert naming the previous RowId. Previous-visible and current-missing rows emit Delete for the previous RowId. Current-only rows emit successor Upsert with absent or unavailable evidence.
A06. Upserts carry Option<Box<[RowFieldDifference]>> previous-value differences. Some means visible predecessor and successor values were compared; an empty collection means identical. None means no comparison, with PreviousRow explaining why.
A07. RowFieldDifference uses Cow<'static, str> field names so static schema names can be borrowed and shared/dynamic schema names remain owned.
A08. Previous stored rows carry conservative evidence as Option values: creator is Local or Other when known; creation and latest state are Included or NotIncluded relative to the accepted cut when provable; None means Flotsync cannot establish the answer.
A09. Included means the accepted old-group state used to create the successor contained the operation or latest state. NotIncluded means locally known old-group work is newer than the accepted cut and is not known to have reached the member that created the successor.
A10. One GroupReplacement DataChanged event is the atomic application transition across all datasets, including an empty provider. Applications merge its ReadToken only after consuming and recording the complete replacement.

Repository-specific behaviour:
R01. A locally accepted MigrationProposal carries the hosted predecessor and final cut required for comparison.
R02. A migration-sourced GroupInvitation carries its MigrationId but deliberately has no hosted predecessor or cut. It still emits GroupReplacement lineage, with current rows marked PreviousRow::Unavailable and no value comparison.
R03. Ordinary creation invitations use DataChangeLineage::Update.
R04. Hosted membership changes preserve the predecessor schema. Preparation clones it, inbound proposal admission rejects changed schema definitions before setup work, and activation repeats the check before committing.
R05. Visibility mapping is: visible and visible to successor Upsert with comparison; visible and missing or tombstoned to old-row Delete; missing or tombstoned and visible to successor Upsert with absence evidence; neither visible to no row change.
R06. A tombstoned predecessor is application-absent but retains its RowId and latest-state cut evidence. A missing stored predecessor is represented separately.
R07. Cut comparison uses Option and VersionVector::partial_cmp: less or equal is Included, greater is NotIncluded, and an undefined comparison is None.

Implementation work:
I01. Rewrite the public rustdoc in application terms, including the concrete distinction between NotStored and Unavailable and the reconciliation consequence of cut evidence.
I02. Remove Unknown evidence variants in favour of Option fields and remove PreviousValueComparison in favour of optional previous-value differences.
I03. Add Cow<'static, str> field names, borrowing from SchemaSource::Static and owning names for shared schemas.
I04. Put differing-field iteration on RowValues, field-name access on RowFieldDifference, and construction on RowId.
I05. Remove the component-local GroupReplacementRowReadTransaction and use Box<dyn ReplicationStoreReadTransaction> directly.
I06. Refactor hosted transition translation into readable visibility branches calling small named helpers. Use PreviousRow constructors and Option utilities for absence.
I07. Preserve one consistent read transaction, deterministic dataset order, bounded reusable batches, release-on-drain, release-on-drop, opaque multi-group ReadToken semantics, and the current post-commit listener failure model.
I08. Refactor activation so snapshot embedding writes successor state without building the replacement listener Vec. After atomic activation and old-group closure commit, construct the appropriate update or replacement notification and its pinned read transaction.
I09. Keep visibility, correspondence, field comparison, creator classification, and causal interpretation in replication. Storage transition records remain raw inputs.
I10. Make only minimal replicated-checklist source and test adaptations required by the API change.

Review remediation and tests:
Q01. Adapt provider state-machine tests to the existing ReplicationStoreReadTransaction test infrastructure rather than retaining a production-only mocking trait.
Q02. Cover multi-page and multi-dataset traversal, invisible-only pages, scan failure propagation, and transaction release on drain and drop.
Q03. Cover every previous/current visibility combination, identical and divergent values, stable field ordering, creator classifications, and included/not-included/unknown cut evidence.
Q04. Cover borrowed field names from static schemas and owned field names from shared schemas.
Q05. Reuse established LazyLock schema fixtures and use constants for fixed const-constructible identifiers.
Q06. Retain secure migration listener-delivery waits, schema-mismatch rejection, empty replacement, invitation, restart, repeated-change, and read-token ordering coverage.

Validation and documentation:
V01. Update public rustdoc and the relevant OKF API and group-replacement documents using the project-local OKF conventions; regenerate and check the index.
V02. Update listeners, runtime tests, secure integration tests, examples, and documentation for DataChangeLineage::Update and the simplified upsert comparison field.
V03. Run formatting, focused data-type/provider/runtime tests, broader single-threaded replication tests as appropriate, replicated-checklist tests, and pedantic clippy for touched Rust targets.
V04. Before hand-off, audit every item in .agent_local_docs/tmp/flotsync-v76-review-2026-08-23.md and report anything unresolved or intentionally deferred.

Explicit exclusions:
X01. Replicated-checklist dirty-state reconciliation, conflict presentation, and user resolution remain deferred to priority-2 child flotsync-fk0, blocked by this task.
X02. Detailed schema-added, defaulted, and removed field semantics and the columnar schema helper remain deferred.
X03. Application-specific dirty-state merging and automatic framework conflict resolution remain out of scope.
X04. Stable group-lineage identity remains in priority-4 follow-up flotsync-2js.
X05. A general retryable listener outbox is not introduced; post-commit listener failure retains the existing recovery model.

Estimate:
E01. Public API and rustdoc: 90-150 changed LOC.
E02. RowValues, Cow ownership, and helper placement: 70-130 changed LOC.
E03. Provider simplification: 100-180 changed LOC, likely a net deletion.
E04. Test restructuring: 180-300 changed LOC.
E05. Call sites and OKF documentation: 80-140 changed LOC.
E06. Expected review delta: 520-900 changed LOC, below 1,000 LOC and not requiring another task split.

Review round 3 implementation:
Q07. Generalise RowValues::differing_field_names terminology from previous to other and require equal field counts with a documented assertion.
Q08. Export coerce_infallible from flotsync_utils and use that shared adapter for the provider's Result::map_err conversion.
Q09. Express optional creator and version-order evidence with Option filtering/mapping while preserving synthetic-origin and unknown semantics.
Q10. Add focused field-count and utility coverage, then rerun the touched-crate and replication validation before returning the issue to review.

Review round 4 implementation:
Q11. Require RowValues comparisons to use identical field sets, failing immediately when an equal-length row contains a different field name; schema evolution remains outside this comparison path.
Q12. Extend focused RowValues coverage for equal-count/different-field rows, then rerun data-types, provider, formatting, and pedantic clippy validation."""
