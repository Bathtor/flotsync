title = "Convert recovery and narrow topology dependencies"
body = """
Goal
Convert startup recovery and narrow runtime/topology service assembly. Implements parent R12; follows flotsync-zop.12.

Instructions
S01. Represent replay-unresolved-decisions, resume-accepted-activations and ready as lifecycle/recovery states. Reuse normal decision notification and activation machines rather than duplicating their transaction logic.
S02. Preserve recovery order, unresolved decision replay and accepted work resumption without re-asking the listener. Retain startup error/fault context and cleanup behaviour.
S03. Keep application synchronisation host-owned before component activation. Preserve listener replacement while inactive, queued inbound work during startup and the existing staged-host hand-off.
S04. Narrow grouped identity/store/security/listener/actor dependencies at topology construction. Keep the existing IO/transport/discovery/delivery topology split and public Kompact exports. No parallel topology startup or component-replacement implementation.

Acceptance and validation
Existing startup replay, accepted activation restart, queued inbound delivery, listener-before-runtime hand-off and startup failure cleanup tests pass. Recovery can use the same owned partitions while blocking ordinary admission.

Review and size
350-550 edited/new LOC including tests, 200-350 moved. Avoid moving the entire topology file. Follow parent checks and no-staging policy; retain flotsync-5ou/sae/3ht/gxo boundaries and close after review.
"""
