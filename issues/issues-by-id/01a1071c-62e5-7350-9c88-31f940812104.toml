title = "Bound ingress effects and notification capacity"
body = """
Goal
Make mailbox, active-effect and notification capacity policies safe before live asynchronous execution. Capacity/overflow part of parent R15/R18; follows flotsync-zop.19.

Instructions
S01. Specify concrete limits/accounting for pending entries and payload bytes, active operations/effects, flow-owned accumulations and queued notification output. Reserve completion capacity before launching effects and output capacity before work that can commit and generate notifications.
S02. Define and implement each event family's full/expired/stopping policy. API overload uses an explicit typed outcome; coalesce advisory data only with a proven merge rule. Preserve accepted mutation and reliable processed obligations; never acknowledge just to free memory.
S03. Inspect actual reliable redelivery/negative-completion behaviour. Do not assume dropping a promise produces retry. If safe bounded ingress requires a delivery hand-off change, make it a separately estimated/reviewable linked child before enabling that cap; the parent cannot finish with this unresolved. Best-effort loss needs a demonstrated catch-up path.
S04. Be precise that local bounds do not bound upstream Kompact mailboxes. Implement producer permits/credits only where the selected end-to-end guarantee requires them. Review public overload/config additions concretely before editing their contracts; do not silently change existing error meaning.

Acceptance and validation
Fill the queue while active completions still arrive; prove they are admitted and release capacity. Verify rejection/coalescing, accounting through flow consumption and no dropped accepted obligations. No hidden unbounded overflow collection or database-write transaction waiting on a callback.

Review and size
450-700 edited/new LOC including tests excluding separately split transport work. Follow parent contract/review rules, relevant tests/Clippy and no staging. Record actual coverage and remaining linked work before closure.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Source inspection establishes a precise reliable-delivery fact: dropping the final uncompleted KClaimablePromise clone makes the delivery await fail, removes its accepted inbound copy and withholds the recipient acknowledgement, leaving the sender able to retry. Port fan-out means dropping just the runtime clone is not necessarily final. Reliable Summary response completion belongs to SummaryRequestManagerComponent; runtime-owned invitation/proposal and SummaryRequest obligations have different success points. This evidence does not establish a bounded producer deferral/backpressure contract; specify and test the actual hand-off before relying on rejection.

Reserve completion capacity before starting effects and a notification lane/output capacity before event-producing writes. Batches reserve before their first input transaction, preserving contiguous callbacks. Include payload bytes, in-flight effects, accumulated batch observations and retained provider resources in accounting; one queue-entry limit is insufficient. Empty activation/creation notifications still consume output capacity. Local limits do not bound Kompact's upstream queues. Concrete API overload, reliable retry and callback re-entry policies remain required acceptance work here, with separately linked/estimated delivery changes if needed."""
