title = "Specify runtime flow contracts and characterisation coverage"
body = """
Goal
Establish the behavioural and ownership contracts for the agreed flotsync-zop conversion before extracting production logic. Implements parent R01. First review unit; no dependency on generic FSM or simulator projects.

Instructions
S01. Read the current component, listener/provider, group-state and host code and existing runtime tests. Inventory each API/port/startup input, transaction boundary, reply/processed promise and listener ordering requirement.
S02. Write transition/ownership tables for publish, single/batch apply, decisions, activation, creation, membership change and recovery. For each interval list owned partitions, allowed temporary inconsistency, excluded consumers, published views, and success/failure restoration. Explicitly distinguish lifetime ownership from transition-only borrowing.
S03. Record the final scheduler contract: only the shared mailbox head can start a new flow; existing finite flows selectively receive anywhere; head-of-line blocking is intentional. No active flow may require a later queued new flow to start in order to complete. Specify terminal treatment of unsupported/stale/orphaned events and completion-capacity reservation.
S04. Add only missing behavioural characterisation tests and narrow controlled-completion fixtures. Reuse existing tests rather than reproducing them. Cover commit-before-notification, partial batch progress, accepted-work restart, post-commit provider failure and listener hand-off.

Acceptance and validation
The tables identify all production block_on/spawn_local paths and proposed ownership intervals. Controlled tests can stop at transaction/listener boundaries without sleeps or a full network simulator. Public APIs and production behaviour remain unchanged. Any docs/ work follows the local OKF skill. Use existing test helpers and socket reservations; run relevant tests serially in the sandbox and pedantic Clippy for Rust edits.

Review and size
250-400 new/edited LOC including fixtures/tests/documentation; no bulk relocation. Follow parent review rules: no staging, no branch switching, no unsolicited API changes. Record test coverage and remaining contract questions; do not close until user acceptance.
"""
