id = "019f8ffb-e40e-7c62-b6da-37833e90b02b"
ref = "flotsync-bym"
title = "Redesign shared group state behind restricted trait-object views"
body = """
Objective

P01. Replace the concrete shared membership map with one authoritative immutable runtime group-state snapshot that projects active storage records into restricted membership and application views.

State model

P02. Introduce a private RuntimeGroupStateSnapshot and private entry representation independent of the public ReplicationGroupRecord storage API. The snapshot contains active groups, including Closed groups, with canonical membership, group name, group schema, and lifecycle.

P03. Keep pending invitation and membership-change messages only in pending decision, activation, and protocol records. Remove message from ReplicationGroupRecord, ReplicationGroupMaterialRecord, and the initial SQLite active-group schema because it is no longer needed after activation. No database migration is required.

P04. Keep one Arc<SharedGroupState> whose SharedGroupState owns ArcSwap<RuntimeGroupStateSnapshot> directly. All component and application views load the same Arc-backed snapshot; do not maintain a second membership map.

Restricted component API

P05. Turn GroupMemberships from a concrete map into an object-safe Send + Sync trait with members(group_id), contains_group(group_id), and an unordered boxed groups() iterator yielding group id plus borrowed GroupMembers.

P06. Turn SharedGroupMemberships into an object-safe Send + Sync trait whose snapshot() method returns Arc<dyn GroupMemberships>. RuntimeGroupStateSnapshot implements GroupMemberships, and SharedGroupState implements SharedGroupMemberships.

P07. Route establishment, delivery ingress, group broadcast, runtime codecs, summary handling, catch-up handling, and runtime logic receive Arc<dyn SharedGroupMemberships>. A snapshot acquisition adds one source-trait dispatch and each query adds one membership-trait dispatch, but the design adds no persistent heap allocation, ArcSwap, or snapshot map.

P08. Keep GroupMembers backed only by its identity trie. Reconstruct canonical order on demand and implement value-aware PartialEq and Eq on TrieMap itself so membership equality compares the authoritative representation without duplicating identities or reconstructing order.

Restricted application API

P09. Add sealed public ReplicationGroupView and ReplicationGroupSnapshot traits using the sealed crate. ReplicationGroupView exposes group id, optional name, unordered member iteration, schema, lifecycle, and readable/writable conveniences. ReplicationGroupSnapshot exposes lookup plus unordered boxed group and readable-group iterators. Neither trait exposes storage records, key bindings, progress vectors, local member index, security material, or messages.

P10. Add ReplicationApi::group_state() -> Result<Arc<dyn ReplicationGroupSnapshot>, ApiError>. The returned snapshot is the latest state published by the running local runtime, remains internally consistent while retained, may become stale after return, performs no store access or peer catch-up, and returns RuntimeUnavailable after shutdown.

State transitions and progress reads

P11. Build and validate an ordinary next RuntimeGroupStateSnapshot from the resulting active group records before each registry-changing store commit. Reject duplicate group ids instead of silently replacing entries. After a successful commit, replace the shared ArcSwap value once. Do not expose a prepare/publish protocol.

P12. Apply the same full-snapshot replacement path to startup hydration, local creation, invitation activation, migration acceptance to ReadOnly, migration activation to old Closed plus new Open, replayed activation, active replay metadata refresh, and test installation. Auto-accepted migration acceptance publishes its ReadOnly state even when subsequent activation fails. API and responder completion occurs only after the corresponding state publication.

P13. Keep version-vector updates out of group state because they are represented by read tokens and transaction-scoped records. Keep pending and inactive group material out until activation.

P14. Project storage records without cloning complete records merely for validation. Validation may borrow the record while the runtime snapshot moves only the application-facing fields and canonical membership it retains.

P15. Add a narrow unordered public storage projection and transaction query for writable group ids and version vectors. SQLite loads it in one authoritative query without loading names, members, schemas, key material, or security material. Snapshot and inbound listener-token construction use this query directly instead of collecting runtime ids and loading complete records.

Testing support

P16. Reuse the production RuntimeGroupStateSnapshot projection for application-facing test snapshots through a test-support factory. Keep only the smaller membership fake for unit tests that intentionally exercise membership consumers without complete storage/application records.

Checklist application

P17. Remove ChecklistRepl store retention and direct active-group ReplicationStore reads. Pre-runtime key provisioning remains outside the live group-state API scope.

P18. Query ReplicationApi::group_state() at each group-dependent checklist operation and retain the result only as that operation consistency boundary. ChecklistSession retains the selected default and working set, not a group snapshot.

P19. Keep all deterministic sorting in checklist presentation code. Neither restricted group API promises group or member iteration order.

P20. Run default repair against one operation-local complete snapshot, including Closed groups for successor traversal, while showing and loading rows only for readable groups. Use the public readable_groups, is_readable, and is_writable conveniences. Rename refresh terminology to repair_default_group and DefaultGroupRepair. Remove load_group_records, load_readable_groups, the retained store field, and the stale flotsync-git-c9m TODO.

Coverage and conformance

P21. Cover snapshot replacement and retained-old-snapshot stability, identical membership and application projections, name/schema/lifecycle projection, message exclusion, unordered iterator contracts, trie equality, on-demand canonical member reconstruction, duplicate-id rejection, authoritative writable-version reads, startup hydration, every lifecycle transition, observable ReadOnly state after failed auto-accepted activation, active replay metadata publication, atomic old/new activation publication, runtime-unavailable behaviour, production-backed test snapshots, lifecycle conveniences, default repair, and application use without direct group-store reads.

P22. Preserve all repository Rust, Snafu, Kompact, formatting, pedantic Clippy, socket-reservation, and single-threaded sandbox test requirements. Keep storage and runtime component documentation aligned with the final contracts.

Implementation split and estimate

P23. Part one covers runtime APIs and related crates: storage-message removal, trie representation and equality, private state model, restricted traits, narrow writable-version storage API, component rewiring, central state replacement, public runtime API, production-backed test support, and focused tests. Estimate 1,500-2,350 touched LOC across the complete child.

P24. Part two covers checklist application usage and cleanup: operation-local runtime snapshots, lifecycle conveniences, UI-boundary sorting, default repair naming, removal of store-backed registry APIs, and focused tests. Estimate 450-750 touched LOC across the complete child.

P25. Implement the two parts as linked child issues, with the checklist child blocked by the runtime/API child."""
