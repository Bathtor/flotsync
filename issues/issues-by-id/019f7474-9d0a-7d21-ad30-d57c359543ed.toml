id = "019f7474-9d0a-7d21-ad30-d57c359543ed"
ref = "flotsync-6p3"
title = "Redesign activation change delivery for memory-bounded listener batches"
body = """
Goal

Finish memory-bounded listener delivery for creation-sourced InitialSnapshot::Inline activation without exposing listener rows before the activation transaction commits.

Current aligned state

R01. Pending-group snapshot embedding writes only store patches; it no longer constructs listener RowChange values.
R02. StoreActivationRowProvider covers creation, hosted replacement, and unavailable replacement activation from one pinned post-commit read transaction.
R03. The provider scans deterministic datasets in reusable RowChangeBatch values with a 128-row store limit, filters tombstones, and explicitly releases an exhausted transaction.
R04. Creation delivery uses ordinary upserts with PreviousRow::NotCompared; replacement translation and evidence semantics remain unchanged.
R05. Runtime coverage observes provider batch boundaries and verifies a 129-row creation activation as one Update event with batches of 128 and 1.
R06. Provider lifecycle, naming, documentation, and item-order review feedback has been incorporated.
R07. A post-commit provider transaction failure is an unrecoverable runtime-component fault, not a process panic. The application remains responsible for handling runtime unavailability and explicitly resynchronising after restart.
R08. The post-commit regression exercises real successor row state, proves that restart does not replay the missed event, and proves explicit snapshot resynchronisation.
R09. Public RuntimeUnavailable documentation needs to distinguish normal unavailability from an unknown mutating-operation outcome and give application recovery guidance.
R10. Shared test controls and listener captures should use one mutex-protected state per test double rather than one mutex per field.
R11. Internal unrecoverable classification should describe the general component-continuation contract rather than the sole current error variant.

Implementation plan

I01. Keep pending-group snapshot embedding store-only and retain dataset-at-a-time store patching.
I02. Keep StoreActivationRowProvider as the shared creation and replacement provider.
I03. Keep one pinned transaction, deterministic dataset cursor, reusable RowChangeBatch, and 128-row scan limit across all activation modes.
I04. In creation mode, scan the committed activated group, skip tombstones, and emit RowChange::ordinary_upsert so PreviousRow remains NotCompared.
I05. Preserve hosted and unavailable replacement translation and evidence semantics.
I06. After activation commits, open a read transaction for the activation event. Preserve acquisition failure as a distinct post-commit activation error and classify it as HandlerError::Unrecoverable at activation handler boundaries. Do not panic the process; pre-commit activation errors retain their existing API or inbound handling.
I07. Document that pending activation has already been removed at this boundary, so restart does not replay the missed listener event and the application must explicitly resynchronise row state.
I08. Keep activation free of collected update-row and listener-selection plumbing while leaving VecRowProvider available for unrelated ordinary listener batches.
I09. Assert that the provider retains its transaction while datasets remain so an internal lifecycle violation fails immediately rather than spinning.
I10. Retain the creation-specific naming and repository item ordering established during review.
I11. Retain and extend provider tests for creation pagination, tombstones, NotCompared lineage, batch reuse, scan limits, release, errors, and the transaction invariant.
I12. Retain post-commit runtime coverage with a schema-backed predecessor row, runtime unavailability without a panic, committed successor row state, no listener-event replay after restart, and successful explicit snapshot resynchronisation.
I13. Document ApiError::RuntimeUnavailable for application developers: discard the unusable handle, load a fresh runtime, and resynchronise after an unexpectedly unavailable mutating call because commit may have preceded the fault.
I14. Generalise activation and inbound error predicates to is_unrecoverable, defined by whether the component may safely continue processing.
I15. Consolidate all four shared FailingStore failure controls behind one Arc<Mutex<FailingStoreControlState>> shared by the store and delegated transactions. Keep immutable configuration and transaction-local flags outside it.
I16. Consolidate ListenerStub captures, counters, rejection control, and buffered receiver behind one Mutex<ListenerStubState>; keep the channel sender outside it.
I17. Validate with rustfmt, the focused regression, runtime group tests, the full replication library suite, pedantic Clippy, and diff whitespace checks, all sequentially.

Estimate

E01. Original implementation remains approximately 205-355 touched LOC.
E02. First review follow-up remains approximately 30-70 touched LOC.
E03. Second review follow-up remains approximately 80-140 touched LOC.
E04. Third review follow-up is approximately 120-205 touched LOC, mostly mechanical consolidation with a net reduction in test plumbing.
E05. The complete task remains comfortably below 1000 LOC."""
