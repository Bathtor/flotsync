title = "Redesign activation change delivery for memory-bounded listener batches"
body = """
Goal

Finish memory-bounded listener delivery for non-replacement InitialSnapshot::Inline activation without exposing listener state before the activation transaction commits.

Current state

R01. Group-replacement activation already omits in-memory listener rows and rederives replacement changes after commit through a store-backed batched provider.
R02. Creation-sourced inline activation still selects InitialSnapshotListenerRows::Collect, builds one Vec<RowChange> while embedding the snapshot, and wraps it in VecRowProvider after commit.
R03. The public create_group path currently creates groups empty and publishes initial application rows through ordinary updates, but creation invitations can represent inline initial snapshots and the API should not retain this accidental memory multiplier.

Plan

I01. Reuse or minimally generalise the recent store-backed activation provider machinery for creation-sourced inline snapshots.
I02. Omit listener row materialisation during the activation transaction and open a post-commit read transaction pinned to the activated group state.
I03. Emit DataChangeLineage::Update rows in bounded reusable batches with the activation read token.
I04. Preserve one DataChanged event/provider per activation and current listener failure semantics.
I05. Add focused coverage proving creation activation reads rows from the committed store in bounded batches and does not affect the replacement provider path.

Estimate

Approximately 80-180 LOC if the group-replacement provider can be reused as expected, below 1000 LOC."""
