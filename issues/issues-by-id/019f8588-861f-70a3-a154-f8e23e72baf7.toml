title = "Build the composite multi-group checklist workspace"
body = """
Objective:
L01. Replace the transitional zero-or-one-group checklist session with one heterogeneous working set containing process-local and real-group items.

Plan:
L02. Introduce composite item identity from Local or Group(GroupId) association plus RowKey, and re-key rows, ordering, dirty state, events, and sync plans accordingly.
L03. Load every readable group and checklist snapshot into one workspace, retain registry metadata, merge read tokens, and route listener rows by RowId group.
L04. Resolve groups by UUID-first syntax or exact unique name, add group list/default/clear-default, and keep the default session-only and never inferred.
L05. Plain add uses the current default or creates a process-local item. List indices remain always unambiguous and bare row UUIDs work only when unique until qualified references land in flotsync-git-d03.4.
L06. Existing members and check commands use the default. Transitional sync publishes only the default group, drains events for all groups, reports remaining dirty groups, and leaves local items unsynchronised.
L07. Add focused working-set, parser, startup/restart, selector, default, snapshot, listener-routing, and transitional-sync tests.

Deferrals:
L08. Group creation and invitations remain in flotsync-git-d03.3.3. Qualified references, move/copy, all-group sync, and default repair after lifecycle changes remain in flotsync-git-d03.4.

Estimate:
L09. Approximately 1,150-1,700 LOC including focused tests."""
