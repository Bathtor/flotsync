id = "019f8588-861f-70a3-a154-f8e23e72baf7"
ref = "flotsync-git-d03.3.2"
title = "Build the composite multi-group checklist workspace"
body = """
Objective:
W01. Replace the transitional optional single-group checklist session with one heterogeneous workspace containing process-local items and items from zero or more readable replication groups.

Item identity and working set:
W02. Add ChecklistItemAssociation with Local and Group(GroupId) variants plus ChecklistItemId combining the association and RowKey.
W03. Re-key visible rows, display order, dirty state, queued changes, event history, listed items, and sync bookkeeping by ChecklistItemId.
W04. Keep global list indices unambiguous. Resolve bare RowKey UUIDs only when exactly one visible item has that UUID and report all associations when ambiguous; qualified item syntax remains deferred to flotsync-git-d03.4.
W05. Keep one workspace-wide optional ReadToken. Snapshot and accepted listener tokens merge through ReadToken::merge_applied.

Group registry and default:
W06. Retain every readable ReplicationGroupRecord in an application registry. Resolve syntactically valid UUID selectors first and otherwise resolve exact unique names, reporting candidate UUIDs for ambiguous names.
W07. Add group list, group default <group>, and group clear-default. Selector commands consume their remaining words as the exact name, allowing whitespace without flag syntax.
W08. Keep the default session-only and initially absent. Only writable groups can become default because the default controls insertion and publication.
W09. Plain add targets the current default group or creates a process-local item when no default exists. Existing edits select items globally; members and check use the default.

Startup, events, and transitional sync:
W10. Use the store only before runtime startup to discover every readable group. Do not retain or access it from ChecklistRepl; checklist operations go through public ReplicationApi methods.
W11. Always construct a workspace, load each readable group checklist snapshot serially into it, and merge the returned read tokens.
W12. Route listener rows by their full RowId group and reject unknown groups or wrong datasets.
W13. Decode each listener batch atomically and reject it if any change targets an item that remains dirty. Rejection does not change rows, display order, dirty state, queued events, event history, or the workspace read token. The transitional error tells the user to restart for a fresh snapshot; retry buffering remains intentionally absent.
W14. Add group-specific sync planning and successful-plan clearing. Publish only the current default group, update its receipt token, clear its successful dirty plan before draining listener events, then accept clean listener batches and apply queued events. Other groups and local items remain dirty.
W15. Remove application-level dirty-row rebasing. Clean listener upserts and deletes apply directly; add a TODO linked to flotsync-git-d03.4, where all-group synchronisation removes the temporary dirty-conflict rejection.
W16. Update list, show, event, me, mutation-result, and sync output to display item association. Prefer unique group names while retaining UUIDs where needed, add ChecklistRowChange::item_id(), and format the sync summary legibly with indoc.

Errors and coverage:
W17. Replace the transitional multiple/no-active-group errors with precise unknown group, ambiguous group name, no default, non-writable default, ambiguous item, unknown event group, incoming dirty-row conflict, and missing read-token errors.
W18. Cover duplicate RowKeys across local and group associations, local-only editing, unique and ambiguous selectors, group-specific dirty state, registry UUID/name resolution, default set/clear, multi-group startup snapshots, token merging, listener routing, default-only publication, successful default echoes, atomic dirty-conflict rejection with unchanged state/token, and remaining-dirty reporting.
W19. Preserve all existing checklist behaviour and keep workspace checks and pedantic Clippy clean.

Deferrals:
W20. Group creation and invitation mediation remain in flotsync-git-d03.3.3.
W21. Canonical qualified item references, copy/move, all-group sequential synchronisation, scenario documentation, automatic default hand-off after group lifecycle changes, and removal of the temporary dirty-listener conflict remain in flotsync-git-d03.4.

Estimate and execution:
W22. The original cohesive child remains approximately 1,120-1,670 LOC. This agreed review pass should add roughly 50-90 lines and remove roughly 100-170 lines.
W23. Keep this as one cohesive child as explicitly agreed; do not subdivide it further."""
