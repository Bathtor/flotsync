title = "Add qualified item transfer and all-group synchronisation"
body = """
Objective:
T01. Make item identity and synchronisation work across the heterogeneous workspace, including UUID-preserving copy/move and one command that submits every dirty real group sequentially.

Item selection plan:
T02. Introduce canonical displayed references local/ROW_UUID, UNIQUE_GROUP_NAME/ROW_UUID, or GROUP_UUID/ROW_UUID when the name is absent or ambiguous. Keep the checklist dataset implicit.
T03. Accept a bare RowKey UUID only when exactly one current item has it across local and real-group associations. Report all qualified candidates when ambiguous.
T04. Use item-first edit grammar: edit <item> note, edit <item> copy <new-group>, and edit <item> move <new-group>. Resolve the source solely from the item reference and resolve the target using workspace group-name/UUID rules.

Transfer plan:
T05. Preserve the source RowKey UUID for both copy and move while changing the RowId group component. Treat this as a checklist convention, not replication-level record identity.
T06. Copy stages a complete target upsert and keeps the source. Move publishes or confirms the complete target upsert before staging/submitting the source tombstone.
T07. Support an unassociated local item as a transfer source into a real group. A real target is required; this slice does not create a pseudo local group selector.
T08. On move failure, retain enough pending state to retry safely. Never delete the source after a failed target publication; after target success and source-delete failure, show both copies and report the incomplete move.

Synchronisation plan:
T09. Make unqualified sync drain listener events, partition pending mutations by real group, and submit groups one at a time with the appropriate group-specific view of the workspace read token.
T10. Preserve target-before-source ordering for moves even when this requires two submissions. Continue attempting later independent groups after a failure and return a per-group summary rather than hiding partial success.
T11. Leave process-local unassociated items unsynchronised until explicitly copied or moved into a real group.

Coverage and documentation:
T12. Add focused selector/ambiguity and transfer-state tests, plus multi-runtime integration coverage for copy, move, partial failure, all-group sequential sync, and restart.
T13. Update the replicated-checklist scenario documentation and command help for positional REPL grammar, qualified identifiers, name ambiguity, explicit default semantics, process-local item lifetime, and route assumptions.

Acceptance:
T14. Items with the same RowKey UUID in different groups remain separately addressable through qualified references.
T15. Copy and move retain that UUID, target the requested real group, and obey target-before-source safety semantics.
T16. One sync attempts every dirty real group sequentially and reports each outcome.
T17. Integration tests demonstrate several groups synchronising within one peer workspace and across peers.

Estimate:
T18. Approximately 700-1,050 LOC across selectors, operation staging, sync orchestration, default lifecycle repair, tests, and documentation.

Default lifecycle follow-up:
T19. Whenever a registry refresh observes that the session default is no longer readable because of a membership migration, follow the lifecycle successor and make the readable successor group the new default. If no readable successor exists, clear the default and report the change rather than leaving a stale selection.
T20. Cover default hand-off to a migration successor, fallback clearing, and restart semantics. Restart still begins with no default because the selection remains session-only."""
