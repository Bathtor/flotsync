title = "Make paging continuations backend-opaque"
body = """
# Make paging continuations backend-opaque

## Status and decision

Plan agreed by the user on 2026-09-17: implement O01 (typed, erased continuation) together with O04 (continuation supplied at page completion) and H02 (no public ordering-hint type parameter).

This issue is the authoritative implementation handover. The current request only authorises recording the agreed plan; do not start implementation in the task-update turn. On a subsequent implementation request, follow this plan and re-read the current code and applicable AGENTS.md instructions first.

Parent: flotsync-h3l. Discovered during flotsync-h3l.2, now completed. The earlier research comment preserves the alternatives and sources; its standalone O01 per-record continuation description is superseded by the combined design below.

## Problem and outcome

PageCursor<Params, Key> currently requires a Rust Key: Clone + Ord whose comparison reproduces the database order. Collations, composite index semantics and engine-native continuation tokens invalidate that assumption. The public MemberKeyPageKey is a concrete example of SQLite representation leaking into the API.

After this change, callers construct PageCursor<Params> and pass it to the existing load_*_into methods. Only the backend knows its continuation representation and ordering. Shared machinery manages transaction association, source-record limits, lifecycle, batch clearing and cancellation; it does not compare continuations.

## Required contracts

C01. Bounded traversal uses a deterministic total order supplied by the backend within the bound transaction. The backend applies its own comparisons, collation and tie-breakers consistently when selecting and resuming records.

C02. A successful continuation resumes after the final successfully accepted source record in backend order. Source acceptance is a successful PageBatch::push, not an increase in output length: custom batches may retain a different number of values.

C03. Continuation state is opaque to ordinary callers, owned and Send + 'static. It must not borrow the transaction between calls. Query parameters may still borrow caller-owned data and must not acquire a 'static requirement.

C04. Preserve object-safe store traits, interchangeable batches, page-limit changes between calls, borrowed predicates, complete-result conveniences and wrapper forwarding. Preserve the existing separate call and predicate lifetimes; mutable cursor invariance was already investigated and accepted.

C05. Preserve transaction mismatch recovery, failed-cursor rejection and exhausted-cursor rejection. Re-submitting an exhausted cursor remains an error, not a successful empty page. Starting a call clears prior batch values and metadata, including when validation rejects it.

C06. Errors after an active attempt begins, including batch failure and dropped/cancelled futures, clear partial output and metadata and invalidate the cursor. No pending continuation is committed on an unsuccessful fill.

C07. A continuation format/type mismatch is a contextual contract error, not a panic or a silent restart. Reject it before consuming valid cursor state so the cursor remains usable with its original format and transaction. This check identifies representation compatibility, not query identity.

C08. Do not reintroduce PageOperationId, public per-query cursor aliases/newtypes, or type-level enforcement that a cursor belongs to a specific operation. Reusing the same private continuation type does not prove operation identity; do not document it as doing so.

C09. Unlimited fills consume the entire remaining selection and finish Exhausted. They still apply any existing continuation predicate, but require no ORDER BY unless the operation independently promises ordered results. A bounded-to-unlimited transition must not repeat previously accepted records.

C10. Page completion keeps cancellation cleanup active until metadata installation and cursor-state commit both succeed. If a custom metadata setter panics, unwinding clears the batch and invalidates the cursor. Once an attempt has failed, every finish form reports CursorFailed before validating its completion value.

C11. A full bounded SQLite page must produce its backend continuation. Missing continuation state is an internal contract error which invalidates the cursor; it must not silently truncate the result by reporting exhaustion.

C12. PageAttempt::finish consumes the attempt. Completed is therefore observable only by Drop while suppressing cleanup; every other PageAttempt method treats Completed as unreachable rather than returning an ordinary failed-state value.

## Agreed API shape

The following sketches describe API roles, not complete compilable declarations:

    pub struct PageCursor<Params> { /* parameters, binding, erased continuation, lifecycle */ }

    pub enum PageEnd<C> {
        MayHaveMore(C),
        Exhausted,
    }

    cursor.begin_page::<SqliteContinuation, _>(transaction_id, batch)?
        -> PageAttempt<'call, Params, SqliteContinuation, Batch>

    page.after() -> Option<&SqliteContinuation>
    page.push(input) -> Result<(), PageError>
    page.finish(metadata, PageEnd::MayHaveMore(next)) -> Result<(), PageError>

A backend selects C: Send + 'static at begin_page. Do not require Clone, Ord, Eq or serialisation. Publicly expose the generic support needed by downstream backend implementations, while actual SQLite continuation types stay private to SQLite.

PageEnd::MayHaveMore(C) means another call may be needed and commits C for that call. It does not promise that another record actually exists. PageEnd::Exhausted means the backend established that no selected records remain; it installs successful metadata and discards continuation storage.

PageAttempt::push receives only the input record. It checks the sampled source limit, calls the batch and counts successful source acceptance. The backend supplies one next continuation when finishing the whole page, after all accepted records succeeded. Shared code must not reconstruct traversal state from projected output.

Store only the erased continuation value in the cursor; its Any runtime identity is the continuation-format identity. Do not store a parallel TypeId. A fresh cursor has no continuation, while begin_page validates the concrete type of any stored continuation before constructing an attempt. Distinguish absence from a wrong type and preserve mismatch recovery. Keep lifecycle named and explicit.

Avoid per-record boxing, downcasting or cloning. Keep candidate continuation typed in backend/attempt-local state and erase only at successful page completion. The previous continuation may be owned by the active attempt or accessed through its borrowed cursor; either implementation must require no Clone and must preserve rejection recovery and cancellation cleanup.

Keep the attempt guard active until successful completion has installed metadata and committed state. Invalid completion, such as MayHaveMore for an Unlimited attempt, must follow the normal contract-error cleanup path. Shared code cannot establish semantic advancement by inspecting opaque C; backend selection and tests carry that responsibility.

## Concrete implementation sequence

I01. Inspect api/paging/mod.rs, error.rs and tests.rs. Replace PageCursor<Params, Key> with PageCursor<Params>; introduce PageEnd<C> and typed begin/resume over erased storage. Remove PageKeyProgress and NonIncreasingKey plus their obsolete shared validation. Retain source-limit, binding and lifecycle checks, using Snafu errors consistent with existing classification.

I02. Update the paging module documentation and examples to show caller construction, backend typed begin, record-only push and explicit finish outcome. Document all fresh/resumed/exhausted/failed outcomes, continuation-format mismatch recovery and MayHaveMore semantics. Explain that opaque tokens may use database order without any Rust comparison equivalent, and qualify deterministic backend traversal as a bounded-page requirement.

I03. Update all seven metadata methods in api/store.rs and their implementations/forwarders:
- replication groups;
- writable replication-group versions;
- member public-key ids;
- member public keys;
- member-key trust evidence;
- pending group decisions;
- pending group activations.

Remove only the public continuation type arguments. Preserve predicate borrowing, method names ending in _into, inferred batch constructors, object safety, and adjacency of complete-result conveniences to their corresponding methods. Search all call sites rather than assuming this list is exhaustive.

I04. Keep begin_page at the SQLite transaction API boundary in store/sqlite/mod.rs. Query implementations in groups.rs, security.rs and pending_groups.rs continue accepting prepared attempts. Retain the narrow SQLite-owned no-metadata batch alias.

I05. Introduce private SQLite continuation representations for group ids, composite member identity/fingerprint positions and trust-evidence positions as appropriate. Move the necessary canonical textual member identity representation out of api/security_material.rs; delete public MemberKeyPageKey and its reexports after adapting references. A private representation may use ordinary Rust values; its SQL comparison semantics must not become a shared Ord contract.

I06. Adapt store/sqlite/paging.rs helpers to typed opaque continuations without Ord/Clone bounds. Preserve shared conditional lower-bound binding and conditional ordering/limit construction. Describe scalar SQLite continuation values using their SQL type, such as TEXT, and reserve expression terminology for SQL fragments. Bind borrowed continuation text directly where SQLx immediately encodes it into the owned SQLite argument buffer; do not add a redundant caller-side clone. Composite SQL comparisons must use the same fields and collation as their ORDER BY. Do not add unnecessary ordering to unlimited queries.

I07. Each SQLite query tracks enough backend-local information to finish after successful pushes. For an exactly full bounded page, return MayHaveMore(last accepted position); for a shorter page or an unlimited fill, return Exhausted. Treat a full bounded page without a continuation as an internal paging contract error. The subsequent empty confirmation after an exact-size page remains valid. No lookahead, count query or extra ordering is required. Missing/empty filters finish Exhausted with successful metadata. Do not base completion on batch.len().

I08. Where traversal naturally produces keys per row, retain only the final required candidate and construct it once from the last accepted backend record, and only when a full bounded page needs it. Do not allocate, format, box or encode continuation values for every row, for unlimited pages or for short pages. Ensure a rejected record never advances the committed cursor. Avoid borrowing a whole non-Sync PageAttempt across helper futures unnecessarily; preserve existing ownership discipline.

I09. Update test_support/metadata_paging.rs and SQLite scenarios. Keep the helper decomposition from the reviewed implementation and multiplicity-sensitive unordered comparison helper. Keep the agreed fixed 64-call test-only bound on paging loops so a broken backend fails rather than hanging; revisit it only if real fixtures reach that limit. Resolve TODO(flotsync-o3o) notes only where this change actually resolves the concern; do not remove unrelated follow-ups.

## Ordering hints and exclusions

H02 is the selected direction: no phantom OrderHint generic parameter and no runtime ordering-preference API in this task. Document that the engine defines traversal order; logical field preferences, where useful, are method documentation rather than a promise of Rust ordering.

Not selected: O02 byte codecs/transportable tokens; O03a backend-owned lifecycle facade; O03b executable backend cursors/transaction factories. Do not refactor transaction connection ownership, introduce a shared transaction executor, add serialisation, add offset pagination or introduce a pagination dependency.

Custom collection batches are separate follow-up work; this task preserves existing batch projection behaviour and does not address their allocation strategy.

## Validation and acceptance

V01. Shared tests use continuation types with neither Ord nor Clone; verify fresh installation, exact typed resumption, successful replacement and disposal at exhaustion. Verify incompatible type rejection preserves original usable state.

V02. Cover source limit violations, arbitrary output cardinality, successful metadata installation, batch failure, unfinished drop and cancellation. Cover panic unwinding from a custom metadata setter and both completion values after a prior attempt failure. A failed finish or fill must leave no committed next token and no partial output.

V03. Retain exhausted-cursor errors, transaction mismatch recovery, failed-cursor errors, exact-size bounded pages followed by empty confirmation, rotated batches and changed limits. Cover bounded-to-unlimited resumption and Unlimited finishing Exhausted.

V04. Preserve borrowed predicate use through public trait objects and forwarding wrappers. Ensure external backend implementations can use the generic paging support without accessing private SQLite types.

V05. Backend tests assert bounded termination, completeness and absence of duplicates without deriving expected traversal order from Rust Ord. Retain composite member-key tie coverage and the existing structured-versus-text identity regression.

V06. Add an actual SQLite collation-order regression whose SQL order differs from Rust lexical order. A focused test-only table/query is sufficient; do not change production schema semantics solely to manufacture the case. Exercise multiple pages and prove complete, nonduplicated traversal using backend continuation predicates.

V07. Run focused paging and SQLite tests, the full replication library suite, documentation tests, rustfmt and all-target pedantic Clippy. Follow sandbox test-thread rules and never run cargo commands concurrently. Inspect touched files for newly duplicated helpers before handover.

V08. Confirm no public continuation Key or Ord assumption remains in the paging contract, no operation-specific cursor restriction was introduced, and unlimited unordered queries did not gain ORDER BY. Report any remaining limitation against these criteria before requesting review.

## Size and work boundaries

Estimate: core contract 150-250 changed LOC; API/SQLite/forwarding 150-250; tests/docs 200-350; page-completion protocol another 80-150, partly offset by simpler push code. Overall approximately 580-1000 changed LOC. This replaces the old optimistic estimate made before metadata paging existed.

Do not implement the alternative designs. If actual scope materially exceeds 1000 LOC, propose a split around the core contract/backend integration and additional backend contract coverage rather than broadening into transaction architecture.

Keep this issue body as the holistic current plan; use comments for subsequent progress/review history. Set status_reason to in review only after implementation and checks. Close only after user acceptance.

Do not stage, unstage, commit, create/switch branches or otherwise alter the Git index as part of implementation or task updates. The user's staging is review progress. A later explicit commit request authorises committing the worktree under the applicable instructions.

## Research references

SeaORM: https://docs.rs/sea-orm/latest/sea_orm/struct.Cursor.html
Diesel: https://diesel.rs/guides/extending-diesel.html
RBatis: https://docs.rs/rbatis/latest/rbatis/macro.pysql_select_page.html
paginator-rs: https://github.com/maulanasdqn/paginator-rs
page-turner: https://docs.rs/page-turner/latest/page_turner/

The research and rejected alternatives remain in comment 01a0ade6-1020-7113-ad7a-d28d2ef3a53e. The agreed design above supersedes the earlier exploratory issue body.
"""
