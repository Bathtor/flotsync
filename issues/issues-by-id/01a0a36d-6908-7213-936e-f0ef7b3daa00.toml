body = """
Planning research, 2026-09-17. Alternatives for alignment; no implementation agreed or started.

Current-state constraints: seven metadata into methods, borrowed predicates with separate call/predicate lifetimes, transaction binding, exhausted-cursor errors, cancellation clearing, arbitrary batch projections, unlimited unordered reads, and complete-result wrappers must survive. Remove the public SQLite-shaped MemberKeyPageKey and shared Ord checking. Continuation format identity must not be presented as operation identity or reintroduce public query-specific cursor types.

Research:
- SeaORM Cursor uses query order columns and IntoValueTuple bounds, with before/after, first/last, ascending/descending, and ConnectionTrait execution. Comparison is expressed in SQL. https://docs.rs/sea-orm/latest/sea_orm/struct.Cursor.html
- Diesel official pagination extension wraps a query in Paginated<T> and implements PostgreSQL QueryFragment using LIMIT/OFFSET plus a window count. It illustrates backend-specific query generation, not an opaque keyset contract. https://diesel.rs/guides/extending-diesel.html
- RBatis pysql_select_page uses page number/size and a count switch to generate paginated SQL. https://docs.rs/rbatis/latest/rbatis/macro.pysql_select_page.html
- paginator-rs has common parameters and separate SQLx/SeaORM/SurrealDB integrations, field/value cursor input, encoded cursor transport, and next/previous cursor response metadata. https://github.com/maulanasdqn/paginator-rs
- page-turner (general paginated APIs, not a database abstraction) separates page items from next-request state using TurnedPage::next/last. https://docs.rs/page-turner/latest/page_turner/

O01: PageCursor<Params> keeps lifecycle/transaction binding and an erased Box<dyn Any + Send>. Backend begin selects C: Send + static and checks format type before resuming; PageAttempt exposes Option<&C>. Use private SQLite continuation types without Clone/Ord; move state into attempt and commit only on success. Hold candidate C unboxed within attempt and erase only at page boundary to avoid per-record box allocations. Retain borrowed Params outside erased state. Existing per-record push records C after successful batch acceptance. Estimated 500-850 changed LOC including all call sites/tests/docs.

O02: Same public PageCursor<Params>, owned opaque bytes internally. Define explicit backend format discriminator plus checked private codec; encode pending continuation at page boundary, decode once at begin. No public import/export or serialisation guarantee merely because representation is bytes. Preserve all lifecycle semantics. Estimated 600-950 changed LOC; extra codecs/errors provide little benefit for transaction-local cursors.

O03a: Lazy public cursor facade retains borrowed Params, but boxed backend state owns continuation and lifecycle via a small object-safe internal/backend interface. Shared guard enforces limit/clearing/cancellation. This hides more state but needs virtual lifecycle access; erasing borrowed Params themselves with Any is not possible. Keeping Params outside static erased state is the practical variant and converges on O01 with richer state. Estimated 700-1100 changed LOC.

O03b: Transaction factory returns Box<dyn GroupPages + predicate> whose load_into method accepts rotating batches and owns a shared transaction executor handle, not a transaction borrow. Backend object holds predicate and state; shared guard still handles cancellation. Requires serialised shared connection ownership and explicit transaction close/commit/release behaviour so an outstanding cursor cannot prolong transaction validity. Wrappers decorate/forward factory objects. Strongest backend ownership, but changes transaction architecture and adds result-specific cursor interfaces. Estimated 1400-2200 changed LOC; split executor lifecycle work from paging conversion if chosen.

O04 (additional, orthogonal): Separate record acceptance from page continuation. PageAttempt::push(input); finish(metadata, PageEnd<C>) where PageEnd is MayHaveMore(C) or Exhausted. Backend builds one next token after successful records, or uses its native page token. It can conservatively return MayHaveMore for exact-size pages, preserving existing empty confirmation, without forcing lookahead. This combines with O01 or O02; does not require new dependencies. Unlimited fills must finish Exhausted and retain existing lower-bound filtering without forced ORDER BY. Estimated +80-150 LOC beyond O01, potentially offset by simpler per-record code.

H01: Phantom logical field hint is possible without Ord but provides no runtime choice and adds type distinctions. H02 (preferred): omit hint parameter, document engine-defined stable order and method-level preferred fields. H03: if caller-selected preference is actually needed, immutable value-level order hint in Params; backend owns collation/tie-breakers. Optional advisory preferences must be distinguished from guaranteed result sorting. No new ordering overhead for unordered unlimited calls.

Validation: preserve exact-size/empty confirmation, exhausted reuse error, mismatch recovery, batch failure, cancellation, rotated batches/limits, borrowed parameters and trait-object forwarding. Add a non-Ord/non-Clone continuation and type mismatch tests, bounded termination checks and duplicate-sensitive completeness assertions. Add actual SQLite collation-order regression deliberately disagreeing with Rust lexical order. Run paging/SQLite and complete replication tests, docs, formatting and pedantic Clippy after implementation.

Proposed direction: O01 plus O04, H02. Retain all existing contracts unless explicitly changed during alignment. Estimates replace the optimistic earlier 180-300 LOC figure now that metadata call sites and tests exist. No Git index changes."""
