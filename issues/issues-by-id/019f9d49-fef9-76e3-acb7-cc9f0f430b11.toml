id = "019f9d49-fef9-76e3-acb7-cc9f0f430b11"
ref = "flotsync-tt1"
title = "Split I/O and replication example crates"
body = """
Objective

Split the mixed flotsync_io_examples package into two runnable example crates without changing the replicated_checklist binary, CLI grammar, configuration format, or runtime behaviour.

Crate boundary

P01. Keep netcat, http_server, app, support, the HTTP smoke script, and both direct-I/O smoke-test suites in flotsync_io_examples.
P02. Create flotsync_replication_examples as a workspace member. Move the complete replicated_checklist module tree and its binary there, retaining the binary name replicated_checklist.
P03. The checklist currently does not use flotsync_io_examples::ExampleRuntime, so do not introduce a shared runtime or utility crate unless the move reveals genuinely shared code.
P04. Give the new crate its replication-level dependencies and features. Move local-secret-manager feature wiring and replication test-support wiring to it; remove replication and checklist-only dependencies from flotsync_io_examples.

Repository alignment

P05. Update workspace membership, package-qualified commands, and Cargo.lock.
P06. Split documentation by abstraction level: retain direct-I/O material in docs/flotsync_io_examples.md; add replication-example material for replicated-checklist setup and usage; preserve the manual scenario documentation; update docs/index.md and README.
P07. Search CI, scripts, Nix configuration, issue references, and developer instructions for paths or package-qualified commands coupled to the old layout. Update only references genuinely affected by the split.
P08. Apply the repository OKF documentation conventions while editing docs/.

Coverage and acceptance

P09. Preserve existing netcat and HTTP unit/smoke coverage in flotsync_io_examples, and all replicated-checklist parser, working-set, runtime, invitation, security, multi-group, synchronisation, and transfer coverage in flotsync_replication_examples.
P10. Validate both crates independently with formatting, complete tests, all-target pedantic Clippy, workspace checks, and the OKF documentation checker.
P11. Building flotsync_io_examples must not build or expose the replication application solely because the packages were formerly combined; flotsync_replication_examples must contain and run replicated_checklist with unchanged user-facing behaviour.

Estimate and review structure

P12. Expect approximately 6,750 mechanically relocated Rust lines plus 150-300 substantive lines of manifests, imports, documentation, and repository-reference updates. The raw diff exceeds 1,000 LOC, but behavioural change should be zero.
P13. Keep this as one atomic task because the crate boundary must not land half-applied. For review, use two commits if useful: first the pure crate/module move plus workspace manifests, then dependency trimming and documentation/repository-reference cleanup. Split any substantive behavioural work into follow-up tasks."""
