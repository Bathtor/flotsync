title = "Extract runtime messages and API adapters"
body = """
Goal
Separate the component shell's public messages, test plumbing and narrow API adapters without changing scheduling. Implements parent R02; follows flotsync-zop.01.

Instructions
S01. Extract ReplicationRuntimeMessage, pending decision response types and test-support commands into cohesive modules while retaining existing public re-exports and cfg visibility.
S02. Isolate security request handling and summary ingress/delegation behind narrow adapters. Keep current block_on versus spawn_local choices, promise ownership, error mapping and remote SummaryRequestManager routing unchanged.
S03. Do not create a new component, public gateway contract or general dispatch framework. This is preparatory organisation; lifetime partition ownership will be added by later children.
S04. Keep moved text mechanically recognisable. Separate relocation from necessary import/visibility changes, provide an old-to-new symbol map, and avoid incidental renaming/formatting across unrelated code. Preserve the repository mod.rs convention when turning a file into a folder module.

Acceptance and validation
The shell retains the same public API, actor vocabulary and test-support behaviour. Existing downstream boundary tests and affected runtime tests cover the move; no tests that merely mirror module layout. Inspect touched files for duplicated helpers and run formatting/pedantic Clippy as appropriate.

Review and size
150-250 new/edited LOC, plus 450-700 existing LOC relocated. Split mechanical patches if needed to keep review comprehensible; follow parent constraints, stage nothing and close only after user acceptance.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

The inventory identifies ten production block_on and four spawn_local paths. Keep security assessment/feedback/known-key requests and advisory observed summaries distinct from exclusive mutation flows. Local public-key bundle lookup, decode/scope checks and host group-state/diagnostic/peer-route/shutdown access also have explicit boundaries; a mechanical extraction must not silently route them all through a new public gateway. NeedRange remains catch-up-manager work.

Reliable delivery fans out to the runtime and SummaryRequestManagerComponent with clones of one KClaimablePromise. Invitation/proposal and inbound SummaryRequest success points are runtime-owned; reliable Summary response completion is summary-manager-owned after correlation, while runtime inspection is advisory. Preserve the existing single completion owner, public exports and cfg(test) submission adapters. The new submit_update_batch_for_test helper in handle.rs is shared by synchronous and controlled tests; retain that delegation rather than duplicating ingress."""
