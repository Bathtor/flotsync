ref = "flotsync-ozi"
title = "Rethink replication component public API boundary"
body = """
Goal

Provide a stable, executor-independent application-facing replication API boundary suitable for MaintainRS without requiring it to own or address FlotSync Kompact components directly.

Current findings

C01. ReplicationApi is Send + Sync and its object-safe operation futures are Send. Arc<dyn ReplicationApi> owns the internal runtime host and is suitable for application state.
C02. ReplicationEventListener is Send + Sync and returns Send futures, allowing an application-owned listener to bridge events without exposing Kompact values.
C03. Runtime shutdown takes live ownership exactly once, stops the internal topology and Kompact system, is idempotent, and makes later API calls report RuntimeUnavailable.
C04. KompactConfig retains Rc-backed factories and KompactConfig::build returns a boxed-local future. Directly awaiting build would therefore make the complete runtime-load future non-Send.
C05. Runtime system creation now owns the optional TOML text and isolates complete KompactConfig construction plus config.build().wait() inside the existing process-global blocking::unblock pool. Store, listener, topology-start, and remaining async work stay on the caller executor.
C06. ReplicationRuntimeComponent currently receives application-facing asks and delegates remote summary requests to SummaryRequestManager. This is current internal routing, not a selected long-term single-gateway architecture.
C07. The upstream limitation is reported as kompics/kompact#232, requesting a Send-compatible asynchronous creation path.

Architecture constraints and deferrals

A01. Preserve the public ReplicationRuntimeComponent and ReplicationRuntimeMessage exports because a direct Kompact integration interface remains planned.
A02. The direct Kompact integration path remains tracked by flotsync-3ht and is not required for MaintainRS.
A03. Do not select or document a single gateway component as the long-term architecture. Future multiple components and multiple concern-scoped API interfaces remain open.
A04. Do not refactor the present summary-manager delegation in this slice. Any future API/component decomposition needs its own design work.
A05. Keep application store, listener, topology-start, and other Send async work on the caller executor. Isolate only Kompact system configuration and creation on the blocking pool.

Plan

P01. Completed: file the upstream Kompact issue requesting a Send-compatible creation path.
P02. Completed: manage blocking from the workspace dependency table and consume it through workspace inheritance in discovery and replication.
P03. Completed: own optional runtime TOML and construct, configure, and synchronously build KompactConfig entirely inside blocking::unblock.
P04. Completed: await only the Send blocking task while preserving startup error context, test socket reservations, and cleanup behaviour.
P05. Completed: document the workaround in source and link kompics/kompact#232.
P06. Completed: keep public Rustdoc concise and framework-neutral, covering caller-visible executor compatibility, shared internal runtime and lifecycle, listener hand-off expectations, and shutdown ordering without naming hidden topology.
P07. Completed: consolidate all compile-time application-boundary checks in application_runtime_boundary.rs: trait-object Send + Sync, normal load-future Send, and representative API-operation future Send. Runtime host tests remain behavioural.
P08. Completed: preserve public Kompact exports, component topology, current request routing, and future multiple-component/API choices.
P09. Completed: rustfmt, focused serial runtime host/lifecycle tests, the normal downstream boundary integration test, and pedantic Clippy for affected crates all pass.

Estimate

The review correction required approximately 25 changed LOC. The complete task remains within the original 110-220 LOC estimate and below 1000 LOC."""
