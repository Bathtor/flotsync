ref = "flotsync-nk9.2"
title = "Add schema-bound state row batches"
body = """
Implement a reusable schema-bound positional state-row batch and use it for ordinary replication-store scans, building on OrderedSchema from flotsync-nk9.1.

Scope:
- Add generic InMemoryStateRowBatch<Metadata, OperationId> in flotsync_data_types.
- Store an owned OrderedSchema, per-row metadata, and flat row-major InMemoryFieldState values without repeated field names.
- Provide new, reserve_rows, capacity, len, is_empty, schema, row, rows, reset_rows, reuse_for_schema, and push_decoded_row.
- Decode directly into flat storage. Roll back all field states appended for a failed row and publish metadata only after the complete decoder succeeds.
- Add InMemoryStateRowView with metadata, positional access, expected-constant field-name lookup, RowStateRead, RowValueRead, and owned snapshot materialisation.
- Generalise borrowed RowStateSnapshot storage to a field-state slice so existing InMemoryStateData and the new batch share the same snapshot path.
- Add ReplicationRowMetadata for row key, tombstone state, creator update, and last-changed versions, plus a replication state-batch alias.
- Change ordinary replication-store scans to fill a caller-owned reusable state batch and return page metadata for group, dataset, dataset existence, and continuation.
- Decode SQLite protobuf snapshots directly through ProtoSchemaSnapshotDecoder into the batch.
- Retain one raw state batch in snapshot and activation providers, and use row views for SnapshotValueRowBatch, RowChangeBatch, and inline initial snapshot projection.
- Keep ReplicationRowStateRecord for point loads, replay, writes, and transition results in this child.
- Keep the specialised SQLite two-schema transition scan unchanged. Let the default transition implementation materialise compatibility records from temporary positional batches.
- Track a general schema-bound transition and point-load redesign as a separate child of flotsync-nk9, blocked by this task.

Concrete API direction:
- InMemoryStateRowBatch owns its positional schema and reusable vectors.
- InMemoryStateRowView exposes metadata(), field_at(), snapshot(), RowStateRead, and RowValueRead.
- ReplicationStoreReadTransaction::scan_dataset_row_batch receives a mutable ReplicationStateRowBatch output and returns DatasetRowScanPage metadata.
- Store implementations call reuse_for_schema before filling output.

Agreed review adjustments:
- Enforce the complete borrowed-snapshot invariant with an unconditional ordered-schema/field-slice length assertion and focused mismatch coverage.
- Make reuse_for_schema compare against the unordered Schema before constructing a replacement OrderedSchema, avoiding a schema-index allocation on unchanged scans and retaining the existing positional layout for semantically equal schemas.
- Document that append_decoded_snapshot_fields may leave partially appended fields on error and that callers must roll back or discard the vector.

Validation:
- Data-types tests cover successful append, decoder rollback, row bounds, positional and named lookup, snapshot materialisation, capacity retention, reset, same-schema reuse without replacing the ordered schema, different-schema replacement, and borrowed snapshot length mismatch rejection.
- SQLite tests cover limits, continuation, dataset existence, metadata fidelity, tombstones, malformed snapshots, and batch reuse.
- Snapshot-provider, activation-provider, and inline-initial-snapshot tests cover direct projection from positional row views.
- Existing point-load, replay, write, and transition tests remain green.
- Run formatting, focused crate tests, workspace all-target checking, pedantic Clippy, and diff whitespace checks serially.

Estimated size:
- Generic batch and views: 280-380 LOC.
- Replication API and SQLite integration: 160-240 LOC.
- Ordinary scan consumers: 120-180 LOC.
- Tests and adapters: 200-280 LOC.
- Review adjustments: 15-30 LOC.
- Total: approximately 775-1,110 LOC. Transition and point-load redesign remains outside this child to keep this task focused."""
