title = "Investigate intermittent network catch-up stalls"
body = """
Investigate intermittent network catch-up stalls observed while validating flotsync-zop.04. Do not assume the failure is pre-existing or caused by the extraction until its waiting dependency is identified.

Evidence (2026-10-05)
The unchanged runtime::tests::delivery::partial_update_batch_retry_narrows_remaining_need test timed out waiting for two listener data-change events in one delivery-suite rerun and three subsequent isolated captured-output runs. Cleanup then timed out waiting for a test reply/future and aborted during unwinding. The initial 23-test delivery run passed, and a later full 23-test run passed with normal capture. Five isolated runs with --nocapture passed after removing temporary tracing. A temporary copy of committed baseline 261d7fe passed the same isolated captured-output test 24 consecutive times. This comparison leaves a possible timing regression unresolved.

The failure logs show SQLite work progressing before the stall; the last observed statement differs between runs. Reliable delivery later times out awaiting the recipient acknowledgement. No classified inbound failure or component panic preceded the primary listener timeout. Temporary traces demonstrated successful applied-marker, version-vector update and commit continuations in a passing run; those traces have been removed. Reverting the last dependency-range helper refinement to return an owned Vec did not eliminate the captured-output failure, so the final implementation retains direct accumulation.

Reproduction
Run cargo test -p flotsync_replication --lib runtime::tests::delivery::partial_update_batch_retry_narrows_remaining_need -- --exact --test-threads=1 outside the sandbox. Compare normal capture, --nocapture and the full runtime::tests::delivery:: selection. The fixture declares its two UDP endpoints through the existing socket broker. Keep tests serial and preserve their current timeout/retry semantics during diagnosis.

Investigation and acceptance
Identify the awaited operation and who must resume it. In particular, inspect interactions between runtime blocking handlers, advisory summary futures, store connections/transactions and delivery acknowledgement; these are hypotheses, not established causes. Obtain a controlled reproduction or an effect trace that distinguishes transaction progress from listener/ack progress, then fix the identified boundary with a focused regression. Also make fixture cleanup preserve the primary diagnostic rather than aborting on a second destructor panic if that is independently reproducible. Do not hide the failure by increasing timeouts, disabling capture or weakening assertions.

Relation to conversion
flotsync-zop.04 preserves existing blocking single/batch orchestration and commit units. Resolve whether this finding needs a correction before accepting that extraction or supplies an independently justified prerequisite for later FSM/concurrency work. Diagnostic logs and baseline comparison notes are in .agent_local_docs/tmp/zop/04-* on the investigating machine; persistent evidence is summarised here so the issue does not depend on those temporary files.
"""
