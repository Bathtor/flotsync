ref = "flotsync-zop.08"
title = "Convert pending group decision flows"
body = """
Goal
Convert invitation/proposal decision processing and explicit responses into finite owned flows. Implements parent R08; follows flotsync-zop.07.

Instructions
S01. Model classify, verify, policy, persist and notify/activation handoff phases with typed payloads. Own the reliable processed or API reply obligation until the existing success/failure boundary.
S02. A persisted decision awaiting human input ends its finite flow and returns stable partitions. Do not hold partitions while waiting indefinitely for a human response. A later responder starts a resolution flow that validates the stored key.
S03. Keep predecessor decision-set and relevant group ownership together through acceptance. Preserve stale responder idempotence, exact accepted-direction replay and rejection of conflicting successors.
S04. Compose the current activation helper as a typed effect temporarily; later activation conversion replaces this adapter. Preserve auto-accept acceptance-before-activation and caller-specific listener/error policies. Keep blocking admission for now.

Acceptance and validation
Cover auto-reject, persisted ask, auto-accept, explicit accept/reject, duplicate/stale responder, competing targets and reliable processed timing. Confirm listener response routing cannot silently lose a promise and that finite flow termination leaves resumable stored decisions/activation work.

Review and size
450-700 edited/new LOC including tests, at most 200 moved. Do not add key-discovery protocols, new activation semantics or public session APIs. Follow parent checks/no-staging policy; user acceptance precedes closure.
"""
