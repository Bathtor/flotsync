title = "Implement head-only flow admission and selective scheduling"
body = """
Goal
Implement the agreed head-only admission policy with selective receive for active flows. Scheduling half of parent R15; follows flotsync-zop.18.

Instructions
S01. Start a new flow only from the actual shared-mailbox head and only when its complete partition set is available. Never scan for younger eligible new work; intentional head-of-line blocking is the fairness trade-off.
S02. Existing flows select their first matching event from anywhere, using their current receive policy. Reconsider the head after consumption/termination; rotate fairly between active flows and bound work per turn so ingress/lifecycle also progress.
S03. Distinguish start requests, correlated continuations, replay/stale/orphan input and lifecycle control. A second publish for the same group is new work. Invalid/unmatchable head input must receive an explicit outcome rather than remain permanently stranded.
S04. Enforce the progress condition: an active owner cannot wait for a new flow behind a blocked head. Preserve operation correlation and do not reset arrival order to bypass the policy. Do not add age-based reservations, bypass admission or mandatory local queue layouts.

Acceptance and validation
Exercise A owning projection, head B needing projection, younger independent C and completion A behind both: A completes, then B starts before C. Also cover multiple active receivers, pattern changes, malformed/orphan head, multi-partition atomic admission and scheduling budget exhaustion. Include a negative dependency-cycle scenario in design/test fixtures.

Review and size
250-450 edited/new LOC including tests. Integrate with simulated completions while production remains serial. Follow parent validation and review/no-staging rules.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Turn the accepted trace into a scheduler test: active A owns projection; head B needs it; younger independent C cannot start; A's completion behind both is selectable; after A restores ownership B starts before C. A second publish request is new work even when its group matches A. Rotate active receivers with bounded scan/transition budgets and reconsider the actual head after progress.

Finite flows alone do not prove unconditional fairness: effects must complete or reach a safe timeout/fault outcome, and no owner can depend on starting a new request behind a blocked head. Listener re-entry must hand off work rather than await a conflicting operation. Unsupported/stale/orphan head inputs need explicit terminal handling. Keep lifecycle control and reserved effect completions able to progress when ordinary ingress is full; do not solve pressure by bypassing older new work."""
