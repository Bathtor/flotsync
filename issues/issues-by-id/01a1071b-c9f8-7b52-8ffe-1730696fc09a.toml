ref = "flotsync-zop.06"
title = "Compose inbound and listener flow FSMs"
body = """
Goal
Convert inbound single/batch application and ordered listener delivery into owned composed FSMs. Implements parent R06 and F03/F07; follows flotsync-zop.05.

Instructions
S01. Reuse the extracted transaction service and driver. Single apply owns its delivery context and moves through transaction completion, observations/listener delivery and classified termination.
S02. Batch state owns the remaining-input cursor, accumulated catch-up observations and group consistency interval. Keep the group partition for the whole batch. Compose the single-apply behaviour without forcing identical single/batch observation timing where current code differs.
S03. Factor a narrow listener child operation owning payload/provider and continuation. Preserve ordinary empty-update filtering, empty activation events and transaction/provider cleanup. Do not introduce independent listener components or framework local inboxes.
S04. Preserve one transaction per batch input, earlier committed notifications and observation flush on partial failure. Retain blocking execution for the whole batch at this stage.

Acceptance and validation
Exercise successful and failing batches, causal chains, duplicate inputs, failure after an earlier item is notified and listener rejection. Trace listener and catch-up effect order; verify no publication/live update interleaving. Reuse existing tests and controlled fixtures.

Review and size
450-700 new/edited LOC including tests, at most 200 moved. If listener extraction and batch conversion exceed 800 substantive lines, present them as separately reviewable patches within this child. Follow parent Rust checks, no staging and user-reviewed closure.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Retain the whole-batch group interval and one listener lane from before the first input transaction through all per-input callbacks; no second input transaction may begin before the first callback completes. A single ready causal chain remains atomic. Persisting a causal wait ends the flow. Accumulated batch catch-up observations must be flushed after successful completion and on transaction/listener failure without reapplying the committed prefix.

Ordinary empty update batches are filtered, while empty activation and creation DataChanged notifications are required. Model provider exhaustion/drop and callback completion explicitly; a row provider may retain a read transaction. DataChangeCompletionGate and the new batch test give deterministic sequencing evidence, but do not impose global cross-group serialisation as a permanent policy. Reserve notification capacity before committing event-producing work when .20/.22 enable asynchronous overlap."""
