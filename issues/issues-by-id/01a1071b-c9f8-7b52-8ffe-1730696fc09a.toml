author = "codex"
body = """
Reconciliation and proposed plan, 2026-10-11. Claimed by codex; planning only, pending user alignment. Current branch is codex/decompose-replication-runtime-component-flotsync-zop. No production edits or staging.

Current code
C06-A. inbound_support::persist_and_apply_update already owns the complete linear transaction and returns committed event batches, available ranges and needed ranges. It handles applied duplicates, final-cut exclusion and persisted causal waiting. Keep this service and its validation/error precedence.
C06-B. component/mod.rs handle_update sends availability, then needs, then awaits callbacks. persist_apply_and_notify_update_batch uses one transaction per input, collects observations before item callbacks, awaits those callbacks before the next transaction, and flushes availability then needs at successful exhaustion or transaction/listener failure.
C06-C. flow_driver.rs already supplies component-local FlowIdAllocator, FlowSlot, FlowEffect/FlowStep, non-cloneable group/listener claims and fault retention. Claims are logical ownership markers; no persistent mutable row/vector cache exists. Current exclusion depends on block_on.
C06-D. listeners.rs filters empty ordinary update batches but direct creation and activation notifications must still deliver empty DataChanged events. Activation providers can retain a read transaction; existing tests cover drain/release and failure/drop. The event transfers provider ownership into the callback, so callback completion does not independently prove provider exhaustion.
C06-E. Delivery tests already cover causal waiting/drain, duplicates, causal-chain rollback, prefix preservation, store/listener failure and callback-before-next-transaction. Missing direct evidence for the new design is pure effect/continuation ordering, observation flush on failure, protocol validation and queued publication/live-update exclusion during a held batch callback. The test-only single-update handler currently omits catch-up observations; address this explicitly rather than silently keeping a divergent orchestration.

Proposed holistic plan
P06-A. Add a narrow ListenerFlow in component/listener_flow.rs. Named constructors accept filtered ordinary update batches or one required DataChanged event with its position/provider. States own remaining events and caller continuation through Ready -> Delivering -> Accepted/Failed; record Delivering before returning the callback effect. Deliver one callback at a time and stop on rejection. Transfer the event/provider into the callback effect; preserve existing provider exhaustion/release/drop mechanics and error types. Do not invent an independent provider-exhaustion acknowledgement. Route existing data-change notification helpers through this child, retaining caller-specific error wrapping and operation-specific ordering. Estimated 160-220 new/edited LOC.
P06-B. Add concrete inbound composition in component/inbound_flow.rs. The root owns authenticated delivery context and FlowOwnership; a reusable ApplyFlow owns one input/origin, transaction waiting state and listener child. After committed transaction completion, expose observations to the parent while retaining the listener continuation. Single apply emits availability then needs before resuming listener delivery. Finish stored causal waits without waiting for another input. Expected completion returns success, pre-commit failure or committed listener failure with original error/context; the component applies the existing inbound failure classification. Estimated 200-270 LOC.
P06-C. BatchApplyFlow owns input cursor, sender, accumulated ranges, current ApplyFlow and the entire group/listener ownership interval. On each committed result, accumulate ranges before resuming its listener child. Start the next transaction only after all callbacks for that input succeed. On exhaustion or either transaction/listener failure, send accumulated availability then needs exactly once before returning the terminal result/claims; include observations for an input whose callback failed. Empty batches succeed without opening a transaction. Never replay a committed prefix internally. Estimated 160-220 LOC.
P06-D. Reuse the existing driver facilities and component-scoped ID sequence. Proposal: one shared FlowSlot<RuntimeFlow> with concrete Publication and Inbound variants, replacing publication_slot, so their group/listener admission remains explicitly exclusive. This is a small tagged owner, not a framework or DSL. Keep async effect execution and thin component adapters in mod.rs; child machines receive typed data, not component/services access. Retain block_on for the complete operation. Validate ID/phase before moving state, restore explicitly after terminal obligations, retain ownership on internal faults and use existing component fault handling. Route test apply entry points through production orchestration, deliberately aligning single-update catch-up effects. Estimated 140-200 LOC.
P06-E. Add focused pure transition traces for single and batch ordering, observation aggregation/flush, empty inputs, listener rejection and invalid completions/ownership. Add listener continuation and provider drop/drain coverage at the new hand-off where existing provider tests do not cover it. Extend the existing controlled batch test with queued publication and live-update work; verify no later commit/callback begins before release and batch completion. Reuse existing causal-chain/duplicate/prefix/retry integration coverage and activation/creation empty-event coverage. Estimated 240-340 test LOC. Perform serial Cargo tests, formatting, pedantic Clippy, Rust instruction audit and touched-file duplication review before hand-over.

Size and review sequence
Total estimate 900-1250 substantive new/edited LOC, at most 200 mechanically moved. This may exceed 1000 LOC and exceeds the original estimate. Recommend two self-contained reviewable patches within this child: first listener child plus single apply and shared blocking admission; then batch composition, failure flush and controlled batch exclusion coverage. Pause for review between them. If accepted, integrate this complete plan into the issue body before implementation and set status_reason to plan agreed.

Preserved boundaries
No transaction-body redesign, mutable database mirror, new listener component/inbox, concurrent effects or scheduler registry. Generic DSL work remains deferred as recorded by the user. Registry/asynchronous execution remain .15/.16; notification-capacity reservations and overlap remain .20/.22. Keep creation/activation/replacement ordering and existing error source chains. Closure remains user-reviewed; no staging."""
