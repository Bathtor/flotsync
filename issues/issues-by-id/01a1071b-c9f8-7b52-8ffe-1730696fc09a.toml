id = "01a1071b-c9f8-7b52-8ffe-1730696fc09a"
ref = "flotsync-zop.06"
title = "Compose inbound and listener flow FSMs"
body = """
Goal
Convert inbound single/batch application and ordered listener delivery into owned composed FSMs. Implements parent R06 and F03/F07; follows accepted flotsync-zop.05.

Status
User agreed P06-A through P06-E on 2026-10-11 and explicitly requested one task/change, without splitting into review patches or pausing between parts. Implement the complete scope in this child. Current branch: codex/decompose-replication-runtime-component-flotsync-zop. DSL exploration flotsync-oyr remains deferred.

Current-code reconciliation
inbound_support::persist_and_apply_update already owns the linear transaction and returns committed listener batches and catch-up observations. Preserve its validation precedence, error classification, duplicate/final-cut behaviour and ready-chain atomicity.
Single apply sends availability then needs before listener delivery. Batch commits one transaction per input, accumulates observations before callbacks, finishes every callback before the next transaction and flushes observations on success or failure.
The driver already provides component-local IDs, non-cloneable group/listener claims and fault retention. There is no persistent mutable group row/vector cache to partition. Claims are logical runtime ownership markers; block_on supplies current handler exclusion.
Ordinary empty updates are filtered; empty creation/activation DataChanged events are required. Providers transfer into callback effects and may retain a read transaction. Callback completion is distinct from exhaustion/drop; preserve existing provider cleanup.
The test-only single-update handler omits catch-up observations today; route it through production orchestration deliberately.

Agreed holistic implementation plan
P06-A. Add narrow ListenerFlow in component/listener_flow.rs. Named constructors accept filtered ordinary update batches or one required DataChanged event with its position/provider. Own remaining events and continuation through Ready -> Delivering -> Accepted/Failed. Record waiting state before returning callback effect; deliver one callback at a time and stop on rejection. Transfer event/provider to callback effect, preserving exhaustion/release/drop mechanics and existing error types. Do not invent provider-exhaustion acknowledgement. Route existing data-change helpers through this child while keeping caller-specific wrapping and operation-specific ordering. Estimate 160-220 new/edited LOC.
P06-B. Add concrete composition in component/inbound_flow.rs. Root owns authenticated context and FlowOwnership; reusable ApplyFlow owns input/origin, transaction waiting state and listener child. Expose observations to parent after commit while retaining listener continuation. Single apply sends availability then needs before resuming listener delivery. Persisted causal waits end the flow. Return success, pre-commit failure or committed listener failure with original error/context; component retains inbound drop/fatal classification. Estimate 200-270 LOC.
P06-C. BatchApplyFlow owns remaining-input cursor, sender, accumulated observations, current ApplyFlow and the entire group/listener interval. Accumulate each committed result before resuming its listener child. Begin next transaction only after callbacks succeed. Flush availability then needs exactly once on exhaustion or transaction/listener failure before terminal release; include observations from committed input whose callback failed. Empty batch opens no transaction. Never replay committed prefix internally. Estimate 160-220 LOC.
P06-D. Reuse driver and component ID sequence. Replace publication_slot with shared FlowSlot<RuntimeFlow> containing concrete Publication/Inbound variants. Keep async effect execution and thin adapters in mod.rs; children receive typed data rather than component/services access. Retain whole-operation block_on. Validate ID/phase before moving state, restore explicitly after terminal obligations and retain ownership on protocol faults. Route fixture apply entry points through production orchestration, aligning single-update observations. Estimate 140-200 LOC.
P06-E. Add focused pure transition traces for single/batch effect order, accumulated observation flush, empty inputs, listener failure and invalid completions/ownership. Cover listener continuation/provider drop/drain at the new hand-off where existing tests do not. Extend controlled batch coverage with queued publication/live update work to prove no commit/callback interleaving. Reuse causal-chain, duplicate, prefix preservation, retry and empty activation/creation coverage. Run serial Cargo tests, formatting, pedantic Clippy, Rust instruction and touched-file duplication checks before review. Estimate 240-340 test LOC.

Acceptance and preserved contracts
Read docs/replication_runtime_flow_contracts.md relevant phase, field-use and evidence tables alongside current code. Keep whole-batch group/listener ownership from before first transaction through callbacks and final observation flush. A single ready causal chain remains atomic; persisted causal waiting terminates finite flow. Earlier committed notifications survive partial failure and accumulated observations flush without reapplication.
Preserve ordinary empty-update filtering and empty activation/creation notifications, provider lifetimes and transaction cleanup. DataChangeCompletionGate supplies deterministic evidence, without making global cross-group serialisation permanent.
No transaction-body redesign, mutable database mirror, listener component/inbox, generic DSL or concurrency registry in this child. Registry/asynchronous execution remain .15/.16. Reserve notification capacity before event-producing commit when .20/.22 introduce asynchronous overlap. Preserve publication, creation and replacement effect ordering and error source chains.

Review and size
Reconciled estimate: 900-1250 substantive new/edited LOC including tests, at most 200 mechanically moved; original 450-700 estimate is superseded. User explicitly accepted implementing this as one task/change despite possible size over 1000 LOC. No staging; set in review after validation. Close only after user acceptance.
Agreed review refinements, 2026-10-11
User authorised R06-01/R06-02/R06-03 and a fresh AGENTS.md audit. Implement in this same task and change.
R06-01 refines P06-B/C: ApplyFlow is a concrete FSM owning its transaction wait, committed listener continuation and callback transitions. It returns committed observations to the parent and classifies transaction/listener failures. BatchApplyFlow owns the current ApplyFlow as well as sender, cursor and accumulated evidence; it advances the cursor only after child success. The root retains authenticated context and resource ownership and handles single observation timing or final batch flush. Inputs move into transaction effects when started; children never receive component services.
R06-02 refines P06-A: keep the owning SmallVec batch iterator and filter empty ordinary batches when requesting the next event; box only that event's provider. Store a required single notification directly, without a queue allocation. Preserve callback ownership, rejection and continuation semantics.
R06-03 refines P06-D: compare a closed InboundPhase enum; render static phase names only for contextual protocol diagnostics. Validate before moving state.
P06-E additionally covers the concrete child independently, batch child ownership, lazy batch retention and required single delivery. Audit every touched Rust file against the actual root AGENTS.md and user instructions, including docs/outcomes, item order, fallible expression placement and control flow; run serial runtime tests, formatting, no-default-features and pedantic Clippy.
Refinement estimate: replace approximately 250-350 production lines and add 80-140 test lines. Preserve the full original goals, accepted constraints and linked deferrals above. No split, staging, branch change or issue closure.

Agreed second review refinements, 2026-10-11
User accepted P06-F1 through P06-F6 and instructed implementation. These refine the full P06-A through P06-E plan and previous R06 changes above, in the same task/change.
P06-F1: Match publication's Advertise/Advertised/Advertising names for inbound catch-up submissions. The batch child retains a distinct parent-permission wait because its evidence is accumulated before callbacks and advertised at batch termination. Preserve single/batch timing.
P06-F2: Rewrite item documentation to describe the attached type, variant, field or method first, followed by useful invariants and lifecycle context. Replace vague disposition/obligations terminology with outcomes and concrete actions in touched flow code. Document ApplyFlow completion transitions/results/errors and state/event representations. Strengthen this rule in root AGENTS.md; keep implementation-only rationale in ordinary source comments.
P06-F3: Initialise BatchApplyFlow directly as Running for a first input or Finished for an empty batch, sharing child construction with later advancement.
P06-F4: Keep IntoIter::find, which consumes each examined batch and drops skipped empties without rescanning. Document next_notification's operation and Some/None meanings; cover interspersed and trailing empties and remaining cursor state.
P06-F5: Introduce InboundResult with context and InboundOutcome fields; reuse it as the inbound RuntimeOutcome payload and drive_inbound return value. Preserve outer protocol errors and convert the domain outcome at callers. Match all terminal outcomes exhaustively. Box the larger InboundFlow variant and remove the large_enum_variant allowance.
P06-F6: Extract queued-work setup and final store/callback assertions into named helpers. Keep both callback gates visible in the main batch scenario, preserve queued publication/live-update exclusion evidence and remove the too_many_lines allowance.
Estimate 250-435 new/edited LOC, including moves. Preserve all accepted goals, contracts and linked deferrals above. The complete change remains one task despite exceeding 1000 LOC. Validate serial runtime tests, formatting, pedantic Clippy and no-default-features compilation; audit touched item documentation and duplicated helpers. Preserve the user's staging state; no branch change or commit requested. Close only after user acceptance.
"""
