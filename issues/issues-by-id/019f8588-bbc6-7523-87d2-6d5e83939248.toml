title = "Add checklist group creation and invitation mediation"
body = """
Objective

P31. Add named group creation and interactive invitation decisions to the multi-group checklist workspace.

Temporary group-state access

P32. Retain Arc<SqliteReplicationStore> in the checklist runner and reload readable ReplicationGroupRecords before group-dependent commands and after group creation or invitation acceptance. Replace the session registry from each result rather than incrementally mirroring runtime state.
P33. Use direct store access only for group metadata. Creation, invitation decisions, startup snapshot loading, and publication continue through public replication APIs. Add a prominent TODO(flotsync-git-c9m) at the workaround boundary requiring replacement by the future restricted application view.

Group creation

P34. Add flag-free group create <name>. Display known member identities with their trust summaries, sorted by member identity and fingerprint at the UI boundary, then prompt for one additional member identity per line until a blank line completes the ordered list. The local creator is always position zero.
P35. Validate member syntax, duplicates, and accidental repetition of the local member. Preserve the typed member-identity parse source through Snafu. Treat the known-member report as a reference only and let create_group enforce authoritative key policy.
P36. Define and document the immutable checklist GroupSchema once with LazyLock. Display the resolved name, creator-first member order, schema, and absent message using readable indoc-based multi-line output, then require explicit confirmation before creating and sending invitations.
P37. Create through ReplicationApi::create_group. Successful local creation must notify ReplicationEventListener with an empty DataChanged event carrying the new group read position before returning. The checklist refreshes group metadata from the store, drains the listener event into the single working set, does not load the guaranteed-empty group through snapshot_rows, and leaves the current default unchanged.

Invitation mediation

P38. Queue membership invitations and their one-shot responders separately from dataset-change delivery. Name both channels explicitly as batch and invitation channels. Display source, group ID, optional name and message, ordered members, and schema using readable indoc-based multi-line output. The example may retain its existing <unnamed>/<none> placeholders.
P39. Add group invitations, group accept <number>, and group reject <number>. Name one-based invitation values positions and derived zero-based values indices. Each decision consumes the corresponding responder; rejection reports UserDenied.
P40. Accepted initial rows enter the application only through ReplicationEventListener. After successful acceptance, refresh group metadata from the store, drain and apply listener-delivered activation rows before returning, and do not call snapshot_rows for that group. Do not change the current default. Restart behaviour continues to rely on runtime replay of unresolved pending decisions.
P41. Document the listener-before-success contract on local group creation and responder acceptance. Document responder rejection operationally as refusing the invitation or proposal with the supplied reason and removing the pending work from local storage. Continue rejecting membership-change proposals as unsupported. Automatic default repair after later group deactivation remains in flotsync-git-d03.4.

Validation

P42. Cover parsing, one-member-per-line wizard termination and validation, exact creation requests, confirmation behaviour, store-backed refreshes, listener delivery before local creation success, absence of post-creation snapshot loading, invitation queueing and decisions, listener-only accepted-row ingestion, unchanged defaults, and relevant single-runtime integration paths. Add handler-level tests with narrow injected wizard/confirmation boundaries rather than testing only disconnected ingredients. Existing replication tests remain responsible for transport-level multi-runtime behaviour.

Deferrals

P43. Defer the responsibility-based split of runner/repl.rs to P0 follow-up flotsync-git-r7j so this review remains behaviour-focused.

Estimate

P44. Approximately 950-1,450 LOC for the complete slice. The second review delta is expected to remain below 300 LOC; the larger module split is explicitly deferred."""
