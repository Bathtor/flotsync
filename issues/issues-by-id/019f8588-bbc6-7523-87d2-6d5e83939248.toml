title = "Add checklist group creation and invitation mediation"
body = """
Objective:
M01. Add named group creation and interactive invitation decisions to the multi-group checklist workspace.

Plan:
M02. Add flag-free group create <name>. Display the known-member trust report, prompt for an ordered whitespace-separated membership list, and validate syntax, duplicates, and local-member inclusion.
M03. Treat the report as user reference only. Show trust state before confirmation, then let create_group perform the authoritative key-policy and blocked-key checks and report any failure directly.
M04. Show creator-first order, name, and checklist schema before explicit confirmation; create with no message and never set the new group as default.
M05. Queue group invitations and one-shot responders in the REPL. Add indexed group invitations, group accept <index>, and group reject <index>, then refresh registry and snapshots after acceptance without changing the default.
M06. Continue rejecting membership-change proposals as unsupported and add focused parser, wizard, responder, refresh, restart, and multi-runtime tests.

Deferrals:
M07. Qualified item references, move/copy, all-group sync, and default repair after group deactivation remain in flotsync-git-d03.4.

Estimate:
M08. Approximately 750-1,150 LOC including end-to-end coverage."""
