title = "Resolve second replicated checklist manual scenario findings"
body = """
Purpose

M01. Resolve the two findings from the resumed replicated-checklist manual scenarios without expanding into unrelated example or delivery refactors.

Findings

F05. The group-invitation display has the same presentation defect previously fixed for group creation: it uses debug formatting instead of user-facing display formatting.

F06. Reliable delivery currently waits 300 seconds for a recipient acknowledgement before retrying an ambiguously lost invitation envelope. The original five-minute choice assumed semantic processing might include a human accept/reject step, but the current runtime acknowledges after committed pending-work storage and successful listener notification. Human acceptance or rejection happens later and is not part of reliable-delivery completion.

Agreed plan

P01. Extract the existing user-facing group-schema formatting so group-creation summaries and invitation displays share the same deterministic Display-based rendering.

P02. Add a pure group-invitation formatter. Render creation and migration sources explicitly, render optional name/message metadata without Debug quoting, retain canonical member order, display schemas using the shared formatter, and summarise initial snapshots without Rust type names. Keep the existing print wrapper as the REPL boundary.

P03. Add exact-output invitation-formatting coverage, including creation and migration source rendering and the relevant initial-snapshot summaries.

P04. Change the default flotsync.reliable-delivery.recipient-ack-timeout from five minutes to ten seconds while keeping it independently configurable. Ten seconds is deliberate: after successful local transport submission these messages are small, normal completion only requires persistence plus listener notification, and no manual decision lies on the acknowledgement path. This timeout detects ambiguous loss; it is distinct from the 30-second retry delay used after a known failure. Document this reasoning with the configuration default.

P05. Keep visible timeout reporting rate-bounded: warn on the first recipient-ack timeout for a message, log subsequent timeouts for that message at debug level, and clear the reporting marker when an acknowledgement arrives. This prevents an unreachable peer from clobbering the REPL every ten seconds.

P06. Preserve existing redelivery and receiver-side duplicate semantics. Extend focused tests only where needed to cover the new default/reporting state; do not redesign reliable delivery.

Estimate

E01. Invitation formatting and exact-output tests: approximately 90-160 LOC.
E02. Timeout default, rate-bounded reporting, documentation, and focused tests: approximately 50-100 LOC.
E03. Total expected change: approximately 140-260 LOC, below 1000 LOC and not worth subdividing."""
