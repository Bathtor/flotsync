ref = "flotsync-git-d03.3.1"
title = "Report known member key trust"
body = """
Objective:
K01. Add the narrow read-only replication API needed for the checklist creation wizard to list member identities and key bindings already known by the local database, together with stored trust information.

Boundary:
K02. This answers only which member-key bindings are stored and whether each has local explicit trust. It does not expose key bytes or private material, query AuthorityScope values, include blocked-key policy, or predict that create_group will succeed.
K03. Group creation remains the single authority-policy decision point. The later wizard uses this report as human-readable reference and reports any create_group validation failure directly.

Store layer:
K04. Add ReplicationStoreReadTransaction::load_member_public_key_ids returning every stored MemberKeyId without an ordering guarantee. Implement one SQLite query selecting member identity and fingerprint from member_public_keys, and update the failing runtime test transaction.
K05. Cover an empty table, several identities, several fingerprints for one identity, and complete order-independent result comparison through the SQLite implementation.

Report model:
K06. Add KnownMemberKeysReport as a top-level application value containing KnownMemberReport entries. Each member entry contains its MemberIdentity and KnownMemberKeyReport bindings; each binding contains the fingerprint and the existing MemberKeyTrustReport. Public fields make no ordering promises.
K07. Keep the current precise trust wording: local explicit trust yes or no. Absence of trust evidence must not be labelled distrusted, and the model can grow with MemberKeyTrustReport if more trust forms are added later.
K08. Implement compact Display output grouped by member. Compare the complete rendered output in tests; an empty report prints an explicit no-known-members state.

Security and runtime routing:
K09. Add a security-store known_member_keys_report method that opens one read transaction, loads all ids once, loads trust evidence for each binding, groups bindings by identity through flotsync_core::member::TrieMap without depending on provider order, and consumes the map directly into report entries.
K10. Implement From<MemberKeyTrustEvidenceSet> for MemberKeyTrustReport and use it in both known-member and public-bundle report paths without evaluating authority permissions for the new report.
K11. Add ReplicationApi::known_member_keys, its runtime message/handler/handle dispatch, and public exports. The handler delegates to the security store and preserves existing ApiExternal error translation.

Core collection API:
K15. Add consuming IntoIterator implementations for TrieMap and TrieSet. Map iteration yields owned (Identifier, V) entries; set iteration yields owned Identifier values without requiring callers to clone or remove entries individually.
K16. Cover consuming map and set iteration, including nested identifiers and owned non-Copy values, in the core trie tests.

Coverage:
K12. Add exact API display and trust-conversion tests, security-store tests for empty, trusted, not-locally-trusted, order-independent multi-binding grouping, runtime API dispatch coverage, plus compile updates for the one non-SQLite transaction implementation.
K13. No checklist runner or wizard code changes in this child; flotsync-git-d03.3.3 consumes the API later.

Estimate:
K14. Approximately 380-650 LOC across public types, one store query, trust conversion, runtime routing, consuming trie iteration, and focused tests. This remains below 1,000 LOC and needs no further split."""
