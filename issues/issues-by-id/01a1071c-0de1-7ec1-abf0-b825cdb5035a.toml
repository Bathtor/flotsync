title = "Extract activation transaction and provider boundaries"
body = """
Goal
Extract activation transaction and listener-provider construction boundaries. Implements parent R09; follows flotsync-zop.08.

Instructions
S01. Separate accepted-work loading/activation transaction from post-commit provider creation. Preserve target material validation, initial snapshot embedding, predecessor closure and removal of pending work in the same transaction.
S02. Make the commit boundary visible in owned result types. Do not blur a transaction failure with failure opening a provider after pending activation has been removed.
S03. Preserve StoreActivationRowProvider and its paging/read-token/lineage contracts. Leave its existing tests in place; avoid relocating its entire large module during this extraction.
S04. Keep current whole-map group projection construction/publication and callback order. Narrow helper dependencies without enabling concurrent execution or adding affected-group deltas.

Acceptance and validation
Existing bounded activation batches, hosted/unavailable predecessor lineage, accepted-work restart and post-commit read failure tests remain valid. Verify transaction and provider cleanup on each outcome; preserve unrecoverable error classification after activation commit.

Review and size
200-300 edited/new LOC, 300-450 relocated. Separate movement from necessary error/result changes. Follow parent validation and duplication checks, stage nothing and close only after acceptance.
"""
