ref = "flotsync-git-d03.5"
title = "Add qualified checklist item transfer"
body = """
Objective

T51. Add canonical qualified item references plus UUID-preserving copy and move commands to the heterogeneous checklist workspace, using ordinary same-pass checklist mutations and accepting the example application's limited partial-publication recovery.

Dependency and current state

T52. This child follows flotsync-git-d03.4, which supplies deterministic all-group publication, composite-token advancement, partial-failure reports, and safe listener-drain gating. Transfer reuses that synchroniser unchanged rather than adding publication phases.
T53. ChecklistItemId already scopes a RowKey by Local or Group association, the working set already detects ambiguous bare UUIDs, and complete ChecklistItem values can already produce full-row insertion patches.

Qualified references and grammar

T54. Change editing to item-first grammar: edit <item> note, edit <item> copy <target-group>, and edit <item> move <target-group>. Target group names remain tail words so the REPL keeps its simple whitespace parser and supports names containing spaces.
T55. Parse qualified source references at the final slash. Continue accepting one-based list positions and bare RowKey UUIDs when globally unique.
T56. Resolve item references through ChecklistSession and pass one resolved ChecklistItemId into working-set mutations. Resolve local/ROW_UUID directly. Resolve a UUID group qualifier directly to the exact group association even when its metadata is absent from the readable registry, then require the resulting item identity to be visible. Resolve non-UUID qualifiers through exact unique group-name rules.
T57. Display local/ROW_UUID for process-local items. Use UNIQUE_NAME/ROW_UUID only when the name is unambiguous, is not the reserved word local, contains no whitespace, and is not itself UUID-shaped; otherwise display GROUP_UUID/ROW_UUID. This ensures every displayed canonical reference resolves back to the same visible item. Ambiguous bare UUID errors list canonical qualified candidates.

Copy and move behaviour

T58. Copy the source's complete current ChecklistItem into the target group under the same RowKey, stage a complete target upsert, and keep the source unchanged.
T59. Reject a target association equal to the source association and reject an existing target with different contents. Treat an identical existing target as idempotent success.
T60. Move performs the same target staging and then immediately deletes the source locally in the same command. An existing replicated source becomes a dirty tombstone; a process-local or never-published source is simply removed.
T61. Reuse the existing deterministic all-group sync for both target upserts and source tombstones. Their group UUID order may publish the source tombstone before the target upsert, and a later target failure can therefore leave the replicated source deleted. This limitation is explicitly accepted for the example.
T62. Within one process, any failed group remains dirty and a later ordinary sync retries it. A source-delete failure leaves the target and the pending tombstone in the ordinary working-set state. Recovery after restart from a partially published move is not automated by this slice, although the replication history retains tombstoned data.
T63. Do not add pending-transfer state, target/source phases, overlap tracking, transfer-specific outcomes, or special listener-drain rules. Chained local copy or move commands are governed by the same visible-row and collision rules as other edits.

Synchronisation and reporting

T64. Keep ChecklistRepl::synchronise_groups and ChecklistSyncReport group-oriented. Existing group outcomes, retained dirty rows, token advancement, and listener-drain gating cover copy and move without transfer-specific extensions.
T65. Correct any stale checklist help or API documentation that still claims sync is limited to the default group.

Coverage and documentation

T66. Add parser and resolver tests for item-first edit commands, final-slash qualification, local references, UUID and unique-name group selectors, ambiguous bare UUIDs, canonical candidate display, reserved local handling, whitespace-name fallback, UUID-shaped-name fallback, registry-missing UUID round trips, and list-position compatibility.
T67. Add working-set tests for UUID-preserving copy, same-association rejection, divergent collision rejection, identical-target idempotency, move from clean replicated, dirty replicated, never-published, and process-local sources, plus chained operations.
T68. Add handler and runtime-backed coverage demonstrating copy convergence, same-pass move publication, both group-order partial-failure directions with ordinary retry, and independent operations across several groups. In particular, prove that target success followed by source-delete failure leaves only the source tombstone dirty and does not drain listener events.
T69. Update the replicated-checklist scenario runbook using repository OKF conventions with qualified references, item-first grammar, copy/move commands, accepted partial-publication limitation, retry within one process, and the absence of automated restart recovery.

Acceptance

T70. Items sharing one RowKey across associations remain separately addressable through canonical qualified references.
T71. Copy and move preserve RowKey, reject divergent target collisions, and use the ordinary all-group synchroniser without transfer-specific state.
T72. A move stages its target upsert and source removal together, with the source becoming a tombstone when it was previously replicated.
T73. Partial publication remains visible through ordinary group outcomes and dirty state, and retry within the same process requires only another sync.
T74. Scenario documentation states the accepted ordering risk and restart-recovery limitation without claiming crash-atomic transfer semantics.

Estimate

T75. Approximately 500-800 LOC: 180-260 LOC for grammar and resolution, 100-180 LOC for copy/move working-set operations, and 220-360 LOC for handlers, tests, and documentation. The agreed simplification keeps this below 1,000 LOC and removes the former transfer-state and two-phase synchronisation boundary."""
