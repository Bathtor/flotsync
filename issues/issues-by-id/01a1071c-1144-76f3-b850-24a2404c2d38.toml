title = "Convert membership replacement flow"
body = """
Goal
Convert local membership replacement into an owned orchestration flow. Second half of parent R11; follows flotsync-zop.11.

Instructions
S01. Model preparation, persisted acceptance, activation, outbound dispatch, listener completion and reply. Compose the shared activation machinery while leaving operation-specific effect order visible.
S02. Acquire predecessor/successor/decision-set ownership together. Preserve acceptance making the old group read-only, immutable accepted direction/final cut, target activation and eventual old-group closure.
S03. Dispatch replacement messages after activation and before the activation listener event, as current behaviour requires. Avoid mixing this with creation's listener-before-invitation rule.
S04. Retain resumable accepted work on activation failure and existing fatal post-commit handling. Do not add leave, schema-change, cross-group read-token remapping or long-lived transfer semantics.

Acceptance and validation
Cover successful replacement lineage, competing proposals, invalid membership/name inputs, acceptance committed before failure, read-only predecessor preservation, and notification/reply ordering. All partition restoration/fault paths are explicit; execution remains blocking.

Review and size
300-450 edited/new LOC including tests, 150-250 moved. Follow parent transaction/error and Rust validation rules, inspect touched duplication and leave staging untouched. User acceptance precedes closure.

Findings from accepted flotsync-zop.01

The accepted baseline is docs/replication_runtime_flow_contracts.md. Read its relevant phase, field-use and evidence tables alongside current sources before this child. These findings supplement the instructions above; existing scope, review estimates, dependencies and deferred work remain applicable.

Membership replacement commits acceptance first, leaving the predecessor read-only and activation resumable; activation then commits successor-active/predecessor-closed/pending-removed, followed by dispatch, listener completion and reply. Failure before activation commit retains the accepted checkpoint. Callback failure preserves activation and dispatch; it must not retry either committed phase.

Own the hosted predecessor, target and predecessor DecisionSet across the relevant intervals, plus projection and notification resources when used. Membership preparation reads can become stale before acceptance writes; expose source lifecycle/cut/schema/security assumptions for .16 repeat validation. Add controlled evidence for dispatch-before-listener/reply and accepted-checkpoint failure, since .01's new publication/batch gates do not prove this outer sequence."""
