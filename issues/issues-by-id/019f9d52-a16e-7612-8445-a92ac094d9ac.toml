ref = "flotsync-git-728"
title = "Review replicated checklist manual scenario findings"
body = """
Purpose

M01. Collect and resolve findings reported while manually running the replicated checklist scenarios.
M02. Preserve the staged review boundary: reproduce F02 first, review the regression test, implement the fix, review the fix, address F01, then resume manual testing.

Findings

F01. When creating a group, the final summary is debug-printed instead of display-formatted.
F02. Group invitations are not being delivered during the manual scenario. Release-mode logging is insufficient to identify where delivery stops; no warning or error is observed.
F03. Add a command that lists discovered peers and their visible status. The current interface does not reveal whether two peers cannot discover or contact each other, or whether they are communicating but ignoring each other because they share no group.
F04. Withdrawn. The apparent move-by-name failure resulted from running the command on the wrong node; the requested first-group and the listed second-group belonged to different node contexts.

Progress

S01. F02 is fixed and approved. Trusted peers can establish routes and deliver a first invitation without an existing shared group.
S02. F01 is the remaining immediate repair before manual checklist testing resumes.
S03. F03 remains recorded as lower-priority follow-up usability work after the invitation and summary fixes.

F02 diagnosis

D01. Group creation installs the local group and then submits invitations through reliable delivery.
D02. Route establishment suppressed introduction responses when the local peer had no groups.
D03. It also accepted route-publication claims only when the claimed group identifiers overlapped local memberships.
D04. The older invitation test bypassed both checks by injecting direct peer routes, so it could not expose the first-invitation bootstrap cycle.
D05. This explained both an entirely new recipient and peers whose existing groups were unrelated: invitation delivery required a route, while the route handshake required pre-existing shared membership.
D06. Route establishment already has a separate authority capability. Shared group membership must not be a prerequisite.
D07. Existing route-publication policy intentionally permits an authenticated member route once the exact public key material is stored. This remains distinct from the stronger replication-runtime authority.

Agreed staged plan

R01. Keep the deterministic regression test for peers without a shared group. Use a reusable fixture helper accepting an array of application/member identities. The helper declares its socket budget, provisions every member with the other members' key material and explicit trust, starts every runtime, and installs symmetric all-to-all route-establishment watches using the runtimes' actual advertised endpoints.
R02. Destructure the returned fixture array into named Alice and Bob bindings. Wait for Alice's verified route to Bob, create the group through Alice, and expect listener delivery through Bob. Do not inject direct delivery routes.
R03. Preserve the committed failing regression checkpoint for the first review boundary.
R04. Make member-route publication independent of shared membership while retaining the existing default authority requirement of StoredPublicKeyMaterial. ReplicationRuntime remains stricter and requires local explicit trust.
R05. Allow introduction claims with no group IDs. Preserve decoded group IDs and validate them separately from route authority: empty and wholly unknown group sets do not block publication; locally known groups containing the claimant are consistent; any locally known group excluding the claimant rejects the claim, including mixed true/false sets.
R06. Keep group IDs as optional signed protocol context. Document that the wire field may be empty without putting authorisation policy in the protobuf documentation.
R07. Cover empty-group claim encoding/decoding, response generation, permitted route publication without shared membership, default trust decisions, local membership consistency, and the end-to-end first-invitation path.
R08. Any later release-visible diagnostics must be transition- or action-driven and rate-bounded. Do not add timer-triggered visible logs that can clobber REPL input.
R09. Address F01 next.
R10. Resume the manual scenarios once F01 is fixed. An intermediate manual rerun is unnecessary because the automated regression reproduces F02.
R11. Treat F03 as follow-up usability work after invitation delivery is restored.

Estimate

E01. Regression fixture refactor and test: approximately 60–100 LOC.
E02. Routing fix, review corrections, and focused authority coverage: approximately 250–550 LOC.
E03. F01 is small and F03 remains separately scoped. The immediate work remains well below 1000 LOC."""
