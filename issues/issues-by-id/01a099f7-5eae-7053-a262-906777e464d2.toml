body = "Implemented the shared paging foundation. Added generic query-bound PageCursor state, UUID transaction and operation identities, batch-owned bounded/unlimited policies, Vec and compile-time SmallVec projection batches, one-to-one borrowed-view projection, explicit page metadata/status, and a shared PageAttempt lifecycle helper. The helper enforces transaction/operation binding, exclusive key advancement, limits and projection cardinality; unfinished, cancelled, store-failed, projection-failed and contract-failed attempts clear partial output and invalidate the cursor. Added transaction identity plumbing for SQLite and test wrappers plus coverage for identity stability/distinctness and higher-ranked trait-object projection. Validation: all 404 flotsync_replication library tests passed; focused paging tests passed; cargo fmt check passed; all-target pedantic clippy passed without warnings. Touched-file duplicate audit found no duplicate paging implementation; PageBatch remains separate from the application-facing ProviderBatch because paging projections may borrow caller context and do not satisfy ProviderBatch static ownership."
created_at = "2026-09-13T09:13:08.829157Z"

