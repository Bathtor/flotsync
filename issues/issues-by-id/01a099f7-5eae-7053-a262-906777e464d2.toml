id = "01a099f7-5eae-7053-a262-906777e464d2"
ref = "flotsync-h3l.1"
title = "Implement shared store paging foundation"
body = """
Scope
Implement the reusable paging foundation and transaction identity plumbing. The child remains larger than 1000 LOC because it establishes the common contract, two reusable batch implementations, transaction integration, documentation, and contract tests. Keep the work reviewable as the common contract and errors, concrete batches and tests, then transaction identity plumbing.

Starting points
Work from the current unstaged changes in flotsync_replication/src/api/paging/, api/store.rs, api/mod.rs, store/sqlite/mod.rs, store/sqlite/tests.rs, and runtime/tests/mod.rs. Preserve manual changes. Leave every touched file unstaged so staging remains the user review marker. Keep the existing application-facing ProviderBatch and BatchProvider contracts functional.

Paging ownership
PageCursor<Params, Key> owns immutable query parameters, an exclusive continuation, and cursor lifecycle. On first use it binds to one StoreTransactionId. Compatible cursor types may be supplied to different pageable operations; their interpretation belongs to those APIs. No transaction borrow survives a page call.

PageBatch is the single object-safe consumer-owned page contract. It has an associated input family for temporary borrowed inputs and associated metadata. It exposes the sampled page limit, clearing, output length and emptiness, fallible input acceptance, successful-fill metadata completion, and metadata access. Concrete batch implementations expose typed retained-value access. Paging counts successful source-record pushes independently of batch output length; custom batches may choose their own output cardinality.

PageLimit is Max(NonZeroUsize) or Unlimited and converts to Option<NonZeroUsize> through into_option(). A maximum is sampled once per fill. Different batch instances, acceptance callbacks, and limits may be used on successive calls. Clearing removes prior values and metadata while retaining reusable allocation and configuration.

Successful page methods return Result<(), PageError>. Metadata belongs to the batch; continuation, possible remaining records, exhaustion, and failure belong to the cursor. Exact-size final pages may require one empty follow-up to establish exhaustion. Exhaustion is permanent.

Public store flow
Custom store implementations begin a fill through PageCursor::begin_page(transaction_id, batch). The returned public PageAttempt exposes query parameters, the exclusive lower-bound key, the sampled limit, exhaustion state, fallible push, and finish. PageAttempt construction itself is private so the cursor is the discoverable entry point.

PageAttempt centralises transaction binding, clearing, source-record limits, strictly increasing key sequences, continuation, completion, and failed or cancelled cleanup. Its private lifecycle enum represents filling, already exhausted, failed, and completed states. A successful push advances the pending source-record count and key; continuation is committed only by finish. Errors and cancellation clear partial output and metadata and fail the cursor. External callback effects cannot be rolled back.

Batch implementations
Keep paging/mod.rs for the common contract, paging/error.rs for common errors, paging/vec_batch.rs for VecPageBatch, paging/inline_batch.rs for InlinePageBatch, and paging/tests.rs for shared contract tests. Keep implementation-specific tests beside their implementations.

Provide OwnedPageBatchInput<T> as the default input family for owned values. Reorder and default concrete batch parameters so the common identity case needs no callback: VecPageBatch<Value, Metadata>::bounded(limit), VecPageBatch<Value, Metadata>::unlimited(), and InlinePageBatch<Value, Metadata, N>::new(). Provide explicit bounded_with, unlimited_with, and new_with constructors for transforming or borrowed inputs. Use flotsync_utils::NonOwningPhantomData for type-level input-family markers. Downstream stores may implement PageBatchInput for their own local borrowed-input family types.

VecPageBatch and InlinePageBatch retain one output value for every successful push. This is their implementation behaviour rather than a global paging invariant. InlinePageBatch has a compile-time non-zero-capacity assertion evaluated when construction is instantiated. Its direct push rejects values beyond N with the common PageLimitExceeded error and never spills.

Errors
Keep Snafu-derived contextual errors and StoreError classification. Backend access failures preserve their original classification. Batch callback failures remain distinct from paging contract failures. Transaction mismatch, failed cursor, non-increasing key sequence, limit exceeded, and record after exhaustion are operation-scoped contract errors. Remove batch-cardinality, invalid-inline-limit, and separate inline-full errors. PageBatch::push returns PageError so supplied implementations can translate callback failures to BatchPush and inline overflow can return PageLimitExceeded directly.

Transaction identity
StoreTransactionId remains UUID-backed and provides from_uuid plus new_random for the straightforward backend default. SQLite allocates pool identifiers from a process-wide AtomicU64 and transaction identifiers from a per-pool AtomicU64, then constructs each UUID from the two halves. Both counters use relaxed wrapping allocation. Practical uniqueness assumes no object carrying an earlier identifier survives a complete u64 allocation cycle. Do not add an active-pool registry or identifier reclamation. Runtime wrappers of existing transactions forward their identity; standalone wrappers create their own identity. Tests describe transaction identity as a top-level concept.

Documentation and acceptance
Document the expected high-level paging flow in the module with an example covering cursor construction, begin_page, params, after, limit, push, finish, batch inspection, and cursor state. Describe inputs as successive records whose keys form a strictly increasing sequence.

Tests cover exclusive advancement, equal and non-increasing keys, over-limit backend input, empty and exact-multiple results, permanent exhaustion, wrong transaction, failed batch push, classified store failure, cancelled fill, cleared partial output and metadata, rotated batches and changed limits or callbacks, inline non-spilling capacity, unlimited traversal, identity-default constructors, compile-time rejection of zero inline capacity where rustdoc supports it, and higher-ranked borrowed inputs through a dyn PageBatch. SQLite tests cover stable identity within a transaction and distinct identity across transactions and pools.

Validation and delivery
Run rustfmt, focused paging and transaction tests serially as required, broader relevant flotsync_replication tests, and all-target pedantic Clippy. Inspect touched files for newly duplicated helpers. Compare the result against review rounds R2 and R3 in .agent_local_docs/tmp/flotsync-h3l.1-review-2026-09-14.md. Set the issue to in review for handover, leave all changes unstaged, and do not close the issue without user agreement."""
