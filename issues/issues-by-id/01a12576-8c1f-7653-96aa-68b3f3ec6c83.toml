title = "Complete replication API re-exports for application consumers"
body = """
Discovered during maintain-rs-m5t.4.3 review in /Users/lkroll/Programming/maintain-rs. flotsync_replication already re-exports some row/value APIs, but application schema codecs still require direct flotsync_core and flotsync_data_types dependencies for GroupId, Field, Schema, scalar/nullability types, NullableBasicValue and primitive value representations. Consumers should be able to use the replication application API through one coherent public import surface, with the exact dependency types used by replication.

Audit the public application API and re-export the required identity, schema, value, decoding and error types through flotsync_replication. Choose clear namespaces where flat names would collide; do not create duplicate wrapper types. Add an external consumer compile fixture depending only on flotsync_replication that defines schemas, constructs identities and values, and encodes/decodes rows. Document the imports and identify which low-level testing APIs still legitimately require separate dependencies. Explain the dependency/version consistency benefit accurately: separate direct dependencies do not inherently diverge when Cargo resolves them to the same source/version. Align on the concrete API before implementation. Source context: src-tauri/Cargo.toml and src-tauri/src/replication in MaintainRS.

Additional evidence from maintain-rs-m5t.5.2 review, 18 October 2026: the application now needs a direct keyring-core dependency solely to match typed credential-store errors nested in LocalStoreSecretError (for example NoStorageAccess, NoEntry and invalid-record errors). Include these error types in the public-surface audit: expose the exact keyring error type through an appropriate security namespace and make it reachable through the replication application import surface. Also cover LocalStoreSecretError, currently imported directly from flotsync_security. Extend the external consumer fixture to classify these credential-store failures using only the supported replication imports, with the relevant credential-manager features enabled. Preserve feature/target gating and avoid a second wrapper/error vocabulary. This is a follow-up requirement only; no dependency or upstream implementation changes are requested in MaintainRS here."""
