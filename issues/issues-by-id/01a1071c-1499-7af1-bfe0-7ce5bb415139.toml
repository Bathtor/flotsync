title = "Implement flow-owned partition registry"
body = """
Goal
Generalise the initial single-flow ownership slots into the concrete partition registry needed for concurrency. Implements parent R14 plus the R13 ownership audit; follows flotsync-zop.14.

Instructions
S01. Inventory actual mutable fields/aliases after extraction. Define explicit Available(value), OwnedBy(flow), and Faulted(context) availability; move owned values into the finite FSM or its in-flight effect for the full consistency interval.
S02. Implement atomic acquisition of each flow's complete partition set and explicit restoration/fault disposition. No partial hold-and-wait and no unconditional drop-based unlock. A safe subsection may return partitions at a documented stable checkpoint and later re-enter admission.
S03. Preserve access to separately published immutable snapshots only for consumers whose stale-tolerance is documented. Exclusive partition ownership must not be bypassable via cloned mutable service handles or unrestricted component access.
S04. Audit finite flow progress: no active owner may require a later queued new flow to start. Keep admission limited to one operation for now. Store descriptors document shared databases/record scopes; they are not a blanket application reader/writer lock.

Acceptance and validation
Tests show unavailable partitions cannot be acquired, multiple-partition acquisition is all-or-nothing, valid state returns only after cleanup/publication, and cancellation/fault cannot silently return inconsistent state. Audit touched-file duplication and temporary adapters without a repository-wide rewrite.

Review and size
300-450 edited/new LOC including tests. Follow parent Rust checks and no-staging/review requirements. This establishes ownership mechanics, not concurrent scheduling yet.
"""
