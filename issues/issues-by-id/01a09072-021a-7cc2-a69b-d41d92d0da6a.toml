body = "API decisions consolidated: use a fixed UUID-backed transaction identity, with generation controlled by the backend (v4 is not required); identities must distinguish transaction instances across pools/store instances accessible to surviving cursors. Associated identity types are rejected to avoid propagation through runtime trait objects. Projection is one-to-one; batches own per-call bounded or unlimited sizing and may be replaced or rotated between calls. Provide reusable Vec and compile-time inline SmallVec batch implementations. Generic cursor construction, first-use binding, one object-safe method per pageable query, and shared paging lifecycle machinery remain agreed directions. Preparing the holistic implementation plan and proposed child-task boundaries; implementation has not started."
