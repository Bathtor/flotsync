title = "Support custom page batch collections"
body = "Explore reusable page batches backed by caller-selected collection types so complete-result helpers can populate sets, maps, or other collections directly instead of first allocating a Vec. Cover identity and transforming batches, collection construction and storage reuse, metadata retention, fallible insertion, object-safe PageBatch use, type inference for common constructors, and how collection cardinality interacts with paging source-record counts. This is follow-up design and implementation work discovered while reviewing flotsync-h3l.2; it is outside the current metadata paging change."
