name: platforms

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_NIGHTLY_TOOLCHAIN: nightly
  RUST_MSRV_TOOLCHAIN: 1.96.0

jobs:
  native-tests:
    name: native-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub auth for git dependencies
        run: >
          git config --global
          url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf
          "https://github.com/"

      - name: Install Linux discovery dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libavahi-compat-libdnssd-dev

      - name: Install Windows Bonjour runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install bonjour -y --no-progress

      - name: Configure libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmBin) {
            "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

      - name: Install minimum supported Rust version
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV_TOOLCHAIN }}

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.67.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run nightly workspace tests
        run: cargo +${{ env.RUST_NIGHTLY_TOOLCHAIN }} test --workspace --locked

      - name: Build nightly release workspace
        run: cargo +${{ env.RUST_NIGHTLY_TOOLCHAIN }} build --workspace --release --locked

      - name: Compile nightly benchmarks
        run: cargo +${{ env.RUST_NIGHTLY_TOOLCHAIN }} bench --workspace --no-run --locked

      - name: Run MSRV workspace tests
        run: cargo +${{ env.RUST_MSRV_TOOLCHAIN }} test --workspace --locked

      - name: Build MSRV release workspace
        run: cargo +${{ env.RUST_MSRV_TOOLCHAIN }} build --workspace --release --locked

      - name: Compile MSRV benchmarks
        run: cargo +${{ env.RUST_MSRV_TOOLCHAIN }} bench --workspace --no-run --locked
